        '<label class="field"><span>SR ผู้รับงาน</span><select id="a-sr">' + opt('', 'ทั้งหมด', f.sr) +
        (state.ref.sr_users || []).map(function (u) { return opt(u.email, u.full_name, f.sr); }).join('') + '</select></label>' : '') +
      '<label class="field"><span>ความเร่งด่วน</span><select id="a-prio">' + opt('', 'ทั้งหมด', f.prio) + opt('urgent', 'ด่วนมาก', f.prio) +
        opt('high', 'สูง', f.prio) + opt('normal', 'ปกติ', f.prio) + opt('low', 'ต่ำ', f.prio) + '</select></label>' +
      '<div class="row tight"><label class="field"><span>สร้างตั้งแต่</span><input type="date" id="a-from" value="' + esc(f.from) + '"></label>' +
      '<label class="field"><span>ถึง</span><input type="date" id="a-to" value="' + esc(f.to) + '"></label></div>' +
      '<label class="field"><span>เรียงตาม</span><select id="a-sort">' + opt('', SORT_LABEL.smart + ' (ค่าเริ่มต้น)', f.sort) +
        ['updated_desc', 'created_desc', 'due_asc'].map(function (k) { return opt(k, SORT_LABEL[k], f.sort); }).join('') + '</select></label>' +
      '</div><footer class="adv-foot"><button class="btn" id="a-reset">ล้าง</button><span class="sep"></span>' +
      '<button class="btn primary" id="a-apply">ใช้ตัวกรอง</button></footer></aside>';
    $('#modal-root').appendChild(root);
    const close = function () { root.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = function (e) { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    $all('[data-close]', root).forEach(function (b) { b.onclick = close; });
    const val = function (id) { const el = $('#' + id, root); return el ? el.value : ''; };
    $('#a-reset', root).onclick = function () { $all('select, input', root).forEach(function (el) { el.value = ''; }); };
    $('#a-apply', root).onclick = function () {
      const next = { stage: val('a-stage'), group: val('a-group'), requestor: val('a-req'), sr: val('a-sr'), prio: val('a-prio'),
        from: val('a-from'), to: val('a-to'), sort: val('a-sort') };
      if (next.from && next.to && next.from > next.to) { toast('วันที่เริ่มต้องไม่เกินวันที่สิ้นสุด', 'err'); return; }
      close();
      apply(next);
    };
    const first = $('select', root);
    if (first) first.focus();
  }

  /* ---------- page ---------- */
  return {
    render: function (view, route, isCurrent) {
      const f = fromRoute(route);
      let shown = PAGE_SIZE;
      // listeners go on this page's own wrapper (not on #view, which outlives the page)
      view.innerHTML = '<div class="tickets-page">' + shell(f) + '</div>';
      const pg = view.firstChild;

      const draw = function () {
        if (!board.rows || !isCurrent()) return;
        const base = board.rows.filter(function (r) { return advMatch(r, f) && textMatch(r, f.q); });
        $('#t-tabs', pg).innerHTML = tabsHtml(base, f);
        const tab = tabsFor().filter(function (t) { return t.id === f.tab; })[0] || TABS[0];
        const list = base.filter(tab.test).sort(SORTS[f.sort] || SORTS.smart);
        $('#t-results', pg).innerHTML = tableHtml(list, f, shown);
        $('#t-chips', pg).innerHTML = chipsHtml(f);
        const nAdv = ['stage', 'outcome', 'sla', 'requestor', 'sr', 'group', 'prio', 'sort'].filter(function (k) { return f[k]; }).length + (f.from || f.to ? 1 : 0);
        const badge = $('#f-adv-n', pg);
        badge.hidden = !nAdv; badge.textContent = nAdv;
      };
      const update = function (patch) {
        Object.assign(f, patch);
        shown = PAGE_SIZE;
        saveRoute(f);
        draw();
      };

      // one delegated handler: survives every redraw of tabs / chips / table
      pg.addEventListener('click', function (e) {
        const t = e.target.closest('[data-tab], [data-unchip], [data-clear], [data-more], [data-new], tr.click');
        if (!t) return;
        if (t.hasAttribute('data-tab')) update({ tab: t.getAttribute('data-tab') });
        else if (t.hasAttribute('data-unchip')) {
          const k = t.getAttribute('data-unchip');
          if (k === 'q') $('#f-q', pg).value = '';
          update(k === 'date' ? { from: '', to: '' } : { [k]: '' });
        } else if (t.hasAttribute('data-clear')) {
          $('#f-q', pg).value = '';
          const blank = { tab: 'all', q: '', sort: '' };
          ADV.forEach(function (k) { blank[k] = ''; });
          update(blank);
        } else if (t.hasAttribute('data-more')) { shown += PAGE_SIZE; draw(); }
        else if (t.hasAttribute('data-new')) go({ page: 'new' });
        else go({ page: 'ticket', id: t.getAttribute('data-id') });
      });
      pg.addEventListener('keydown', function (e) {
        const tr = e.target.closest('tr.click');
        if (tr && e.key === 'Enter') go({ page: 'ticket', id: tr.getAttribute('data-id') });
      });
      $('#f-q', pg).addEventListener('input', debounce(function () { update({ q: $('#f-q', pg).value.trim() }); }, 150));
      $('#f-adv', pg).onclick = function () { openAdvanced(f, update); };

      // show what we have at once, then refresh in the background (cheap: the server caches per data version).
      // A late answer never overwrites a newer one.
      if (board.user !== state.me.email) { board.rows = null; board.user = state.me.email; }
      if (board.rows) draw();
      {
        const seq = ++board.seq;
        const res = $('#t-results', pg);
        if (board.rows && res) res.classList.add('refreshing');
        api('listTicketBoard').then(function (d) {
          if (seq !== board.seq) return;
          board.rows = d.rows;
          board.at = Date.now();
          draw();
        }).catch(function (e) {
          if (seq !== board.seq || !isCurrent()) return;
          if (board.rows) toast('โหลดรายการล่าสุดไม่สำเร็จ — แสดงข้อมูลเดิม: ' + e.error, 'err');
          else $('#t-results', pg).innerHTML = errorHtml(e, 'App.reload()');
        }).then(function () {
          const r = $('#t-results', pg);
          if (r) r.classList.remove('refreshing');
        });
      }
    }
  };
})();
</script>

<script>
/**
 * SR per item: badge, "โยกงาน" (an SR passes their item to another SR) and the SR Manager / Admin split panel.
 * Shared by the request page and the pricing page. Server: transitionTicket assign_items / transfer_item.
 */
const ItemAssign = (function () {
  function badge(it, showDone) {
    if (it.quote_status) return '';
    if (!it.sr_email) return '<span class="sla warning">⚠ รอ SR Manager แบ่งงาน</span>';
    return '<span class="badge tag-sr">👤 ' + esc(it.sr_name || it.sr_email) + '</span>' + (showDone && it.sr_submitted ? ' <span class="sla ok">✓ ส่งราคาแล้ว</span>' : '');
  }
  function srOptions(cur, blank) {
    return (blank ? '<option value="">— เลือก SR —</option>' : '') + (state.ref.sr_users || []).map(function (u) {
      return '<option value="' + esc(u.email) + '"' + (u.email === cur ? ' selected' : '') + '>' + esc(u.full_name) + '</option>';
    }).join('');
  }
  function transfer(d, it, done) {
    dialog({ title: '🔀 โยกรายการ #' + it.line_no + ' ไปให้ SR อื่น', message: it.product_name + ' — ราคา supplier ที่กรอกไว้ย้ายไปด้วย',
      html: '<label class="field"><span>ให้ SR <span class="req">*</span></span><select id="dlg-sr">' +
        '<option value="">— เลือก SR —</option>' + (state.ref.sr_users || []).filter(function (u) { return u.email !== it.sr_email; })
          .map(function (u) { return '<option value="' + esc(u.email) + '">' + esc(u.full_name) + '</option>'; }).join('') + '</select></label>',
      comment: 'optional', commentLabel: 'หมายเหตุถึง SR ที่รับงาน', confirmText: 'โยกงาน',
      validate: function (root) { return $('#dlg-sr', root).value ? null : 'กรุณาเลือก SR'; }
    }).then(function (res) {
      if (!res) return;
      api('transitionTicket', d.ticket.ticket_id, 'transfer_item', res.comment, { expected_version: d.ticket.version, item_id: it.item_id, sr_email: $('#dlg-sr', res.root).value })
        .then(function () { toast('โยกรายการ #' + it.line_no + ' แล้ว', 'ok'); refreshPoll(); done(); })
        .catch(function (e) { toast(e.error, 'err', 9000); if (e.code === 'VERSION_CONFLICT') done(); });
    });
  }
  /** SR Manager / Admin: one select per item, save only the changed lines. */
  function panelHtml(d) {
    if (!d.permissions.can_assign_items) return '';
    const items = d.items.filter(function (it) { return !it.quote_status; });
    const none = items.filter(function (it) { return !it.sr_email; }).length;
    return '<div class="card" id="ia-panel"><h3>👥 แบ่งงาน SR ตามรายการ' + (none ? ' <span class="sla warning">รอแบ่ง ' + none + ' รายการ</span>' : '') + '</h3>' +
      '<div class="small muted">รายการที่กลุ่มสินค้ามี SR ประจำ (แท็บ ProductGroups › sr_email) เข้า SR อัตโนมัติหลัง GM อนุมัติ · รายการ “อื่นๆ / ไม่มี SR” แบ่งที่นี่</div>' +
      '<div class="tbl-wrap"><table class="tbl stack"><thead><tr><th>#</th><th>สินค้า</th><th>กลุ่มสินค้า</th><th>SR ผู้ทำราคา</th></tr></thead><tbody>' +
      items.map(function (it) {
        return '<tr><td data-label="#">' + it.line_no + '</td><td class="main">' + esc(it.product_name) + (it.sr_submitted ? ' <span class="sla ok">✓ ส่งแล้ว</span>' : '') + '</td>' +
          '<td data-label="กลุ่มสินค้า">' + esc(it.product_group_name) + '</td>' +
          '<td data-label="SR"><select data-ia="' + esc(it.item_id) + '" data-cur="' + esc(it.sr_email || '') + '">' + srOptions(it.sr_email, !it.sr_email) + '</select></td></tr>';
      }).join('') + '</tbody></table></div><div class="actions"><button class="btn primary" id="ia-save">💾 บันทึกการแบ่งงาน</button></div></div>';
  }
  function bindPanel(view, d, done) {
    const btn = $('#ia-save', view);
    if (!btn) return;
    btn.onclick = function () {
      const list = $all('[data-ia]', view).filter(function (s) { return s.value && s.value !== s.getAttribute('data-cur'); })
        .map(function (s) { return { item_id: s.getAttribute('data-ia'), sr_email: s.value }; });
      if (!list.length) { toast('ยังไม่ได้เปลี่ยน SR ของรายการใด', 'err'); return; }
      btn.disabled = true;
      api('transitionTicket', d.ticket.ticket_id, 'assign_items', '', { expected_version: d.ticket.version, assignments: list })
        .then(function () { toast('แบ่งงาน ' + list.length + ' รายการแล้ว', 'ok'); refreshPoll(); done(); })
        .catch(function (e) { btn.disabled = false; toast(e.error, 'err', 9000); if (e.code === 'VERSION_CONFLICT') done(); });
    };
  }
  return { badge: badge, transfer: transfer, panelHtml: panelHtml, bindPanel: bindPanel };
})();

      '<dt>กลุ่มลูกค้า</dt><dd>' + esc(t.customer_group || '–') + '</dd>' +
      '<dt>ประเทศปลายทาง</dt><dd>' + esc(t.destination_country || 'ไทย') + '</dd>' +
      '<dt>วันที่ต้องการให้ตอบกลับราคา</dt><dd>' + esc(fmtDate(t.due_date)) + (t.priority !== 'normal' ? ' · ' + prioText(t.priority) : '') + '</dd>' +
      '<dt>เอกสารที่ต้องการประกอบ</dt><dd>' + esc(t.documents_needed || 'ไม่ต้องการเอกสารประกอบ') + '</dd>' +
      '<dt>SR ผู้รับงาน</dt><dd>' + esc(t.sr_name || '–') + '</dd>' +
      (d.sla ? '<dt>ครบกำหนด (SLA)</dt><dd>' + esc(d.sla.due_text) + ' น. <span class="sla ' + (d.sla.overdue ? 'breach">⏰ เกินกำหนด' : 'ok">ภายในกำหนด') + '</span>' +
        ' <span class="small muted">' + esc(d.sla.label) + ' · ' + fmtNum(d.sla.hours) + ' ชม.ทำงาน</span></dd>' : '') +
      '<dt>สร้างเมื่อ</dt><dd>' + esc(fmtDateTime(t.created_at)) + '</dd>' +
      (t.revision_count ? '<dt>ขอแก้ราคา</dt><dd>' + t.revision_count + ' ครั้ง</dd>' : '') +
      (t.rejection_reason ? '<dt>เหตุผล</dt><dd>' + esc(t.rejection_reason) + '</dd>' : '') +
      (t.description ? '<dt>หมายเหตุ (Remark)</dt><dd style="white-space:pre-wrap">' + esc(t.description) + '</dd>' : '') +
      '</dl></div>';
  }

  /** What SR checks before accepting a job: is the request complete enough to quote? */
  function completeness(d) {
    const t = d.ticket;
    const pics = function (it) { return d.attachments.filter(function (a) { return a.item_id === it.item_id; }).length; };
    const noSpec = d.items.filter(function (it) { return !it.net_weight || !it.size || !it.packing_size || !(it.qty > 0); });
    const noPic = d.items.filter(function (it) { return !pics(it); });
    const daysLeft = t.due_date ? Math.round((new Date(t.due_date + 'T00:00:00') - new Date(todayYmd(0) + 'T00:00:00')) / 86400000) : null;
    return [
      { ok: !!(t.customer_name && t.customer_group), label: 'ลูกค้า + กลุ่มลูกค้า', detail: [t.customer_name, t.customer_group, t.destination_country].filter(Boolean).join(' · '), key: 'ประเทศปลายทาง / กลุ่มลูกค้า' },
      { ok: !noSpec.length, label: 'สเปกครบทุกรายการ (NW · Size · Packing · ปริมาณ)', detail: noSpec.length ? 'ไม่ครบ: ' + noSpec.map(function (it) { return '#' + it.line_no; }).join(', ') : d.items.length + ' รายการ', key: 'สเปก / Grade / ขนาด' },
      { ok: !noPic.length, label: 'รูปภาพสินค้า', detail: noPic.length ? 'ไม่มีรูป: ' + noPic.map(function (it) { return '#' + it.line_no; }).join(', ') : 'มีรูปครบ', key: 'รูปภาพสินค้า', warn: true },
      { ok: true, label: 'เอกสารที่ลูกค้าต้องการ', detail: t.documents_needed || 'ไม่ต้องการเอกสาร', key: 'เอกสารที่ต้องการ' },
      { ok: daysLeft == null || daysLeft >= 2, label: 'เวลาหาราคา', detail: daysLeft == null ? '–' : 'เหลือ ' + daysLeft + ' วัน (ต้องการ ' + fmtDate(t.due_date) + ')', key: 'วันที่ต้องการ (เร็วเกินไป)', warn: true }
    ];
  }
  function queueCheck(d) {
    const rows = completeness(d);
    const bad = rows.filter(function (r) { return !r.ok && !r.warn; }).length;
    const warn = rows.filter(function (r) { return !r.ok && r.warn; }).length;
    return '<div class="notice qcheck"><b>งานใหม่ในคิว — ตรวจความครบถ้วนก่อนรับงาน</b><ul>' + rows.map(function (r) {
      return '<li class="' + (r.ok ? 'ok' : (r.warn ? 'warn' : 'bad')) + '">' + (r.ok ? '✓' : '⚠') + ' ' + esc(r.label) + ' <span class="small muted">— ' + esc(r.detail) + '</span></li>';
    }).join('') + '</ul><div class="small">' + (bad ? 'ข้อมูลยังไม่ครบ ' + bad + ' ข้อ → กด <b>↩ ตีกลับ</b> ให้ Sales เพิ่มข้อมูล' :
      warn ? 'ข้อมูลหลักครบ แต่มี ' + warn + ' ข้อที่ควรดู (⚠) → รับงานได้ หรือกด <b>↩ ตีกลับ</b> ถ้าจำเป็นต้องมี' : 'ข้อมูลครบ → กด <b>✅ รับงาน</b>') + '</div></div>';
  }

  function notices(d) {
    const t = d.ticket;
    let html = '';
    if (t.stage === 'need_info' && t.info_request) {
      const labels = (t.info_request.items || []).map(function (k) {
        const c = d.checklist.filter(function (x) { return x.item_key === k || x.check_id === k; })[0];
        return c ? c.label : k;
      });
      const fromQueue = t.info_request.return_stage === 'pending_assign';
      html += '<div class="notice warn"><b>' + (fromQueue ? 'SR ตีกลับ — ข้อมูลไม่ครบ:' : 'SR ขอข้อมูลเพิ่ม:') + '</b> ' + esc(t.info_request.comment) +
        (labels.length ? '<div class="small">รายการที่ขาด: ' + esc(labels.join(', ')) + '</div>' : '') + '</div>';
    }
    if (t.stage === 'returned') html += '<div class="notice warn">Sales Manager ส่งกลับให้แก้ไข — ดูเหตุผลใน Timeline ด้านล่าง แล้วกด “แก้ไขใบขอราคา”</div>';
    if (t.stage === 'pending_sr_manager') html += '<div class="notice">SR ส่งราคาแล้ว — รอ SR Manager ตรวจราคา แล้วส่งให้ GM อนุมัติ</div>';
    if (d.parent) html += '<div class="notice side-follow">📌 ใบส่งราคาตามหลัง — แยกมาจาก <a href="#" data-goto="' + esc(d.parent.ticket_id) + '">' + esc(d.parent.ticket_no) + '</a></div>';
    if (d.follow_ups && d.follow_ups.length) {
      html += '<div class="notice side-follow">📌 มีรายการส่งราคาตามหลัง: ' + d.follow_ups.map(function (c) {
        return '<a href="#" data-goto="' + esc(c.ticket_id) + '">' + esc(c.ticket_no) + '</a> <span class="small muted">(' + esc(c.stage_label) + ')</span>';
      }).join(' · ') + '</div>';
    }
    if (t.stage === 'pending_assign' && (d.me.role === 'sr' || d.me.role === 'sr_manager')) html += queueCheck(d);
    const isGm = d.me.role === 'gm';
    if (t.stage === 'pending_gm') {
      html += '<div class="notice side-sales"><b>🛒 อนุมัติฝั่งขาย</b>' + (isGm ? ' — ตรวจคำขอของ Sales: ลูกค้า สินค้า ปริมาณ และราคาที่ลูกค้าคาดหวัง ก่อนส่งให้ SR หาราคา' : ' — รอ GM อนุมัติคำขอราคา') + '</div>';
    }
    if (t.stage === 'pending_gm_price') {
      html += '<div class="notice side-buy"><b>📦 อนุมัติฝั่งซื้อ</b>' + (isGm ? ' — ตรวจราคาซื้อจาก vendor, ต้นทุนถึงคลัง, GP และราคาขาย (SR Manager ตรวจแล้ว) ก่อนส่งราคาขายถึง Sales' : ' — SR Manager อนุมัติแล้ว รอ GM อนุมัติราคา') + '</div>';
    }
    if (t.stage === 'awaiting_sales_ack') html += '<div class="notice">' + (d.me.role === 'sales' ? 'GM อนุมัติราคาแล้ว — ตรวจราคาขายด้านล่าง แล้วกดรับทราบ หรือขอให้ปรับราคา' : 'ส่งราคาขายถึง Sales แล้ว — รอ Sales รับทราบ') + '</div>';
    return html;
  }

  function actionBar(d) {
    const t = d.ticket;
    const p = d.permissions;
    const buttons = [];
    if (p.can_edit_request) buttons.push('<button class="btn" data-nav="edit">✏️ แก้ไขใบขอราคา</button>');
    if (d.me.role === 'sales' && t.requestor_email === d.me.email) buttons.push('<button class="btn" data-copy>📄 สร้างใบใหม่จากใบนี้</button>');
    const srWork = p.actions.indexOf('doc_complete') !== -1 || p.actions.indexOf('submit_quote') !== -1;
    if (srWork) buttons.push('<button class="btn primary" data-nav="pricing">' + (t.stage === 'doc_check' ? '📋 ตรวจเอกสาร' : '💰 กรอกราคา / เทียบราคา') + '</button>');
    // SR Manager / GM may fix the price in their own approval step, then approve
    if (p.can_edit_quotes && (t.stage === 'pending_sr_manager' || t.stage === 'pending_gm_price')) buttons.push('<button class="btn" data-nav="pricing">✏️ แก้ไขราคา</button>');
    p.actions.forEach(function (a) {
      const ui = ACTION_UI[a];
      if (ui) buttons.push('<button class="btn ' + ui.cls + '" data-action="' + a + '">' + esc(ui.label) + '</button>');
    });
    if (!buttons.length) return '';
    const adminNote = d.me.role === 'admin' ? (t.stage === 'deleted' ? '<div class="notice warn">🗑 ใบนี้ถูกลบแล้ว — เห็นเฉพาะ Admin · กด “กู้คืน” เพื่อนำกลับมาที่ขั้นตอนเดิม</div>' :
      '<div class="small muted" style="margin-bottom:6px">🛡 โหมด Admin — ปุ่มด้านล่างทำแทนผู้รับผิดชอบขั้นนี้ได้ทุกขั้น (บันทึกใน Timeline ว่า Admin ทำแทนใคร)</div>') : '';
    return '<div class="card">' + adminNote + '<div class="actions">' + buttons.join('') + '</div></div>';
  }

  function itemsHtml(d) {
    const showQ = d.permissions.can_view_quotes;
    return '<div class="card"><h3>รายการสินค้า (' + d.items.length + ')</h3>' + d.items.map(function (it) {
      let html = '<div class="item-row"><div class="head"><span>#' + it.line_no + ' ' + esc(it.product_name) + '</span><span class="sep"></span>' +
        '<span class="badge">' + esc(it.product_group_name) + '</span>' + ItemAssign.badge(it, showQ) +
        (it.can_transfer && d.me.role === 'sr' ? ' <button type="button" class="btn sm ghost" data-transfer="' + esc(it.item_id) + '">🔀 โยกงาน</button>' : '') + '</div>' +
        '<dl class="kv small" style="margin-top:6px">' +
        '<dt>% Net Weight</dt><dd>' + esc(it.net_weight || '–') + '</dd><dt>ขนาด (Size)</dt><dd>' + esc(it.size || '–') + '</dd>' +
        '<dt>แพคย่อย (Packing Size)</dt><dd>' + esc(it.packing_size || '–') + '</dd>' +
        '<dt>ปริมาณต่อเดือน</dt><dd><b>' + fmtNum(it.qty) + ' ' + esc(it.uom) + '</b></dd>' +
        '<dt>ราคาที่ลูกค้าคาดหวัง</dt><dd>' + (it.target_price ? fmtMoney(it.target_price) + ' บาท/' + esc(it.uom) : 'ลูกค้ายังไม่ระบุ') + '</dd></dl>' +
        picturesHtml(d, it) +
        (it.spec ? '<div class="small">Spec: ' + esc(it.spec) + '</div>' : '') +
        (it.description ? '<div class="small muted" style="white-space:pre-wrap">' + esc(it.description) + '</div>' : '');
      if (it.quote_status) {
        html += itemStatusHtml(it);
      } else if (showQ && it.quotations.length) {
        html += '<div class="tbl-wrap" style="margin-top:8px"><table class="tbl stack"><thead><tr><th>Vendor</th><th class="num">ราคา/หน่วย</th>' +
          '<th>VAT</th><th class="num">ต้นทุนสินค้า/หน่วย (฿)</th><th class="num">ค่าเคลียร์ของ/หน่วย (฿)</th><th class="num">ต้นทุนถึงคลัง/หน่วย (฿)</th><th>เงื่อนไข</th></tr></thead><tbody>' +
          it.quotations.slice().sort(function (a, b) { return a.cost_rank - b.cost_rank; }).map(function (q) {
            return '<tr' + (q.is_selected ? ' style="background:#EEF7F3"' : '') + '><td class="main">' + esc(q.vendor_name) + ' ' +
              (q.is_selected ? '<span class="badge tag-win">✔ ผู้ชนะ</span> ' : '') + (q.is_cheapest ? '<span class="badge tag-cheap">ถูกที่สุด</span>' : '') +
              (q.supplier_warnings || []).map(function (w) { return ' <span class="sla ' + (w.level === 'expired' ? 'breach' : 'warning') + '">⚠ ' + esc(w.name) + (w.level === 'expired' ? ' หมดอายุ' : ' ใกล้หมดอายุ') + '</span>'; }).join('') +
              (q.is_selected && q.selection_reason ? '<div class="small muted">เหตุผล: ' + esc(q.selection_reason) + '</div>' : '') + '</td>' +
              '<td class="num" data-label="ราคา/หน่วย">' + fmtNum(q.unit_price) + ' ' + esc(q.currency) + (q.currency !== 'THB' ? '<div class="small muted">@' + fmtNum(q.fx_rate) + '</div>' : '') + '</td>' +
              '<td data-label="VAT">' + esc(vatLabel(q.vat_term)) + '</td>' +
              '<td class="num" data-label="ต้นทุนสินค้า/หน่วย">' + fmtMoney(q.net_unit_cost_thb) + '</td>' +
              '<td class="num" data-label="ค่าเคลียร์ของ/หน่วย">' + fmtMoney(q.clearance_thb || 0) + bdHtml(q) + '</td>' +
              '<td class="num" data-label="ต้นทุนถึงคลัง/หน่วย"><b>' + fmtMoney(q.landed_unit_cost_thb) + '</b></td>' +
              '<td data-label="เงื่อนไข" class="small">' + [q.brand, q.origin_country ? 'Origin ' + q.origin_country : '', incoLabel(q.incoterm), q.packing,
                q.shelf_life ? 'อายุ ' + q.shelf_life : '', q.moq != null ? 'MOQ ' + fmtNum(q.moq) : '', q.lead_time_days != null ? 'Lead ' + q.lead_time_days + ' วัน' : '',
                q.payment_term, q.valid_until ? 'ยืนราคาถึง ' + fmtDate(q.valid_until) : ''].filter(Boolean).map(esc).join(' · ') + '</td></tr>';
          }).join('') + '</tbody></table></div>' +
          (it.supplier_shortfall_reason ? '<div class="notice warn small">มี Supplier ไม่ถึงขั้นต่ำ — เหตุผล: ' + esc(it.supplier_shortfall_reason) + '</div>' : '') +
          photoReviewHtml(d, it) + sellHtml(it);
      } else if (!showQ && it.sales_pricing) {
        html += salesSellHtml(it);
      } else if (!showQ && ['on_process'].indexOf(d.ticket.status) !== -1) {
        html += '<div class="small muted" style="margin-top:6px">ราคาขายจะแสดงเมื่อ GM อนุมัติราคาแล้ว</div>';
      }
      return html + '</div>';
    }).join('') + '</div>';
  }

  /** Landed-cost breakdown of one quotation (freight · insurance · duty · fees · cold storage · inland · other). */
  function bdHtml(q) {
    const b = q.cost_breakdown;
    if (!b) return '';
    const parts = [['ขนส่ง', b.freight], ['ประกัน', b.insurance], ['อากร ' + fmtNum(b.duty_pct) + '%', b.duty_thb], ['ธรรมเนียม', b.fees],
      ['ห้องเย็น', b.cold], ['ขนส่งในประเทศ', b.inland], ['อื่นๆ', b.other]].filter(function (x) { return Number(x[1]) > 0; });
    return '<div class="small muted">' + parts.map(function (x) { return esc(x[0]) + ' ' + fmtMoney(x[1]); }).join(' · ') +
      (q.fx_date ? '<br>FX ณ ' + esc(fmtDate(q.fx_date)) : '') + '</div>';
  }

  /** Selling price per unit (server-computed in it.pricing): product cost + clearance = landed; + GP = selling price. */
  function sellHtml(it) {
    const p = it.pricing;
    if (!p || p.sell_price_thb == null) return '';
    const u = 'บาท/' + esc(it.uom);
    const diff = p.target_diff_pct == null ? u : (p.target_diff_pct > 0 ? '<span class="sla breach">▲ สูงกว่าเป้า ' + fmtNum(p.target_diff_pct) + '%</span>' :
      '<span class="sla ok">✓ ' + (p.target_diff_pct < 0 ? 'ต่ำกว่าเป้า ' + fmtNum(-p.target_diff_pct) + '%' : 'เท่าราคาเป้า') + '</span>');
    return '<div class="sell"><h4>ราคาขาย (ต่อหน่วย) · ' + esc(p.vendor_name) + '</h4><table class="tbl costtbl"><tbody>' +
      '<tr><td>ต้นทุนสินค้า</td><td class="num">' + fmtMoney(p.product_cost_thb) + '</td><td class="u">' + u + '</td></tr>' +
      '<tr><td>+ ค่าเคลียร์ของ</td><td class="num">' + fmtMoney(p.clearance_thb) + '</td><td class="u">' + u + '</td></tr>' +
      '<tr class="sub"><td>= ต้นทุนถึงคลัง</td><td class="num">' + fmtMoney(p.landed_cost_thb) + '</td><td class="u">' + u + '</td></tr>' +
      '<tr' + (p.gp_below_min ? ' class="gp-low"' : '') + '><td>+ กำไร GP ' + fmtNum(p.gp_percent) + '%' + (p.gp_is_default ? ' <span class="small muted">(ค่าเริ่มต้น)</span>' : '') +
        (p.gp_below_min ? ' <span class="sla breach">⚠ ต่ำกว่าขั้นต่ำ ' + fmtNum(p.min_gp_percent) + '%</span>' : '') + '</td><td class="num">' + fmtMoney(p.profit_thb) + '</td><td class="u">' + u + '</td></tr>' +
      '<tr class="total"><td>= ราคาขาย</td><td class="num">' + fmtMoney(p.sell_price_thb) + '</td><td class="u">' + u + '</td></tr>' +
      '<tr class="ref"><td>ราคาที่ลูกค้าคาดหวัง</td><td class="num">' + (p.target_price ? fmtMoney(p.target_price) : 'ไม่มี') + '</td><td class="u">' + diff + '</td></tr>' +
      '</tbody></table></div>';
  }

  /** Item the SR answered without a price: not offered (reason) or sent later as its own ticket. */
  function itemStatusHtml(it) {
    if (it.quote_status === 'follow_up') {
      return '<div class="istat follow"><b>📌 ส่งราคาตามหลัง</b>' + (it.follow_up ? ' — แยกเป็นใบ <a href="#" data-goto="' + esc(it.follow_up.ticket_id) + '">' +
        esc(it.follow_up.ticket_no) + '</a> <span class="small muted">(' + esc(it.follow_up.stage_label) + ')</span>' : '') +
        (it.quote_status_reason ? '<div class="small">เหตุผล: ' + esc(it.quote_status_reason) + '</div>' : '') + '</div>';
    }
    return '<div class="istat no"><b>✕ ไม่เสนอราคา</b>' + (it.quote_status_reason ? '<div class="small">เหตุผล: ' + esc(it.quote_status_reason) + '</div>' : '') + '</div>';
  }

  /** Sales side: selling price per unit + offer terms only (the server sends no cost / vendor / GP). */
  function salesSellHtml(it) {
    const p = it.sales_pricing;
    const u = 'บาท/' + esc(it.uom);
    const diff = p.target_diff_pct == null ? '' : (p.target_diff_pct > 0 ? '<span class="sla breach">▲ สูงกว่าเป้า ' + fmtNum(p.target_diff_pct) + '%</span>' :
      '<span class="sla ok">✓ ' + (p.target_diff_pct < 0 ? 'ต่ำกว่าเป้า ' + fmtNum(-p.target_diff_pct) + '%' : 'เท่าราคาเป้า') + '</span>');
    const terms = [p.brand ? 'แบรนด์ ' + p.brand : '', p.origin_country ? 'Origin ' + p.origin_country : '', p.packing,
      p.shelf_life ? 'อายุ ' + p.shelf_life : '', p.moq != null ? 'MOQ ' + fmtNum(p.moq) : '', p.lead_time_days != null ? 'Lead ' + p.lead_time_days + ' วัน' : '']
      .filter(Boolean).map(esc).join(' · ');
    return '<div class="sell sales-sell"><div class="sell-price"><span class="lbl">ราคาขาย</span><b>' + fmtMoney(p.sell_price_thb) + '</b> <span class="u">' + u + '</span></div>' +
      '<dl class="kv small"><dt>ราคาที่ลูกค้าคาดหวัง</dt><dd>' + (p.target_price ? fmtMoney(p.target_price) + ' ' + u + ' ' + diff : 'ไม่มี') + '</dd>' +
      (p.valid_until ? '<dt>ยืนราคาถึง</dt><dd>' + esc(fmtDate(p.valid_until)) + '</dd>' : '') +
      (terms ? '<dt>รายละเอียดสินค้า</dt><dd>' + terms + '</dd>' : '') + '</dl></div>';
  }

  function incoLabel(k) {
    if (!k) return '';
    const v = (state.ref.incoterms || []).filter(function (x) { return x.key === k; })[0];
    return v ? v.label : k;
  }

  /** Supplier product photos per offer (winner first) — what SR Manager / GM look at before approving. */
  function photoReviewHtml(d, it) {
    const rows = it.quotations.slice().sort(function (a, b) { return (b.is_selected - a.is_selected) || (a.cost_rank - b.cost_rank); })
      .map(function (q) { return { q: q, list: Photos.of(d.attachments, q.quote_id) }; })
      .filter(function (r) { return r.list.length; });
    if (!rows.length) return '<div class="small muted" style="margin-top:6px">📷 ยังไม่มีรูปสินค้าจาก Supplier</div>';
    return '<div class="prev-photos"><h4>📷 รูปสินค้าจาก Supplier</h4>' + rows.map(function (r) {
      return '<div class="prev-row' + (r.q.is_selected ? ' win' : '') + '"><div class="small"><b>' + esc(r.q.vendor_name) + '</b>' +
        (r.q.is_selected ? ' <span class="badge tag-win">✔ ผู้ชนะ</span>' : '') + '</div>' +
        Photos.html(r.list, { quoteId: r.q.quote_id, editable: false, compact: true }) + '</div>';
    }).join('') + '</div>';
  }

  function picturesHtml(d, it) {
    const pics = d.attachments.filter(function (a) { return a.item_id === it.item_id && a.category !== 'quote_photo'; });
    if (!pics.length) return '';
    return '<div class="small" style="margin-top:4px">รูปภาพสินค้า: ' + pics.map(function (a) {
      return '<a href="#" data-open="' + esc(a.attachment_id) + '">' + (/^image\//.test(a.mime_type) ? '🖼️ ' : '📄 ') + esc(a.file_name) + '</a>';
    }).join(' · ') + '</div>';
  }

  function vatLabel(k) {
    const v = (state.ref.vat_terms || []).filter(function (x) { return x.key === k; })[0];
    return v ? v.label : k;
  }

  function checklistHtml(d) {
    if (!d.checklist.length) return '';
    const done = d.checklist.filter(function (c) { return c.is_checked; }).length;
    return '<div class="card"><h3>ตรวจเอกสาร (' + done + '/' + d.checklist.length + ')</h3><ul style="margin:0;padding-left:0;list-style:none">' +
      d.checklist.map(function (c) {
        return '<li style="padding:4px 0">' + (c.is_checked ? '✅' : '⬜') + ' ' + esc(c.label) + (c.is_required ? '' : ' <span class="muted small">(ไม่บังคับ)</span>') +
          (c.note ? '<div class="small muted" style="margin-left:26px">' + esc(c.note) + '</div>' : '') + '</li>';
      }).join('') + '</ul></div>';
  }

  function attachmentsHtml(d) {
    const p = d.permissions;
    const files = d.attachments.filter(function (a) { return a.category !== 'quote_photo'; });   // supplier photos: gallery per offer above
    const nPhotos = d.attachments.length - files.length;
    let html = '<div class="card"><h3>ไฟล์แนบ (' + files.length + ')</h3>';
    if (!files.length) html += '<div class="muted small">ยังไม่มีไฟล์แนบ</div>';
    if (nPhotos) html += '<div class="small muted" style="margin-bottom:6px">📷 รูปสินค้าจาก Supplier ' + nPhotos + ' รูป แสดงใต้ตารางเทียบราคาของแต่ละรายการ</div>';
    html += files.map(function (a) {
      const mine = a.uploaded_by === state.me.email;
      return '<div class="actions" style="align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">' +
        '<span>📎 <a href="#" data-open="' + esc(a.attachment_id) + '">' + esc(a.file_name) + '</a> <span class="small muted">' +
        fileSize(a.size_bytes) + ' · ' + esc(CATEGORY_LABEL[a.category] || a.category) + ' · ' + esc(fmtDateTime(a.uploaded_at)) + '</span></span><span class="sep"></span>' +
        (mine && p.can_upload ? '<button class="btn sm danger" data-del="' + esc(a.attachment_id) + '">ลบ</button>' : '') + '</div>';
    }).join('');
    if (p.can_upload) {
      const cat = d.ticket.stage === 'need_info' ? 'info_response' : (state.me.role === 'sr' ? 'quotation' : 'request');
      html += '<div style="margin-top:12px"><label class="btn"><input type="file" id="att-input" multiple hidden ' +
        'accept=".pdf,.jpg,.jpeg,.png,.webp,.heic,.xls,.xlsx,.csv">➕ แนบไฟล์ (PDF/รูป/Excel ≤ ' + state.ref.max_upload_mb + ' MB)</label>' +
        '<input type="hidden" id="att-cat" value="' + cat + '"><div id="att-progress"></div></div>';
    }
    return html + '</div>';
  }

  const FIELD_LABEL = {
    title: 'ชื่อเรื่อง', description: 'รายละเอียด', customer_name: 'ลูกค้า', priority: 'ความเร่งด่วน', due_date: 'วันที่ต้องการ',
    product_group_code: 'กลุ่มสินค้า', product_name: 'ชื่อสินค้า', spec: 'Spec', qty: 'จำนวน', uom: 'หน่วย', target_price: 'ราคาที่ลูกค้าคาดหวัง',
    target_currency: 'สกุลเงินเป้าหมาย', vendor_id: 'รหัส vendor', vendor_name: 'Vendor', unit_price: 'ราคาต่อหน่วย', currency: 'สกุลเงิน',
    fx_rate: 'อัตราแลกเปลี่ยน', vat_term: 'VAT', vat_rate: 'อัตรา VAT', moq: 'MOQ', lead_time_days: 'Lead time (วัน)', payment_term: 'เงื่อนไขชำระเงิน',
    valid_until: 'ยืนราคาถึง', remark: 'หมายเหตุ', clearance_thb: 'ค่าเคลียร์ของ (บาท/หน่วย)', gp_percent: 'GP %', attachment_file_id: 'ไฟล์ใบเสนอราคา', is_checked: 'ติ๊กแล้ว', note: 'หมายเหตุ'
  };
  function showVal(k, v) {
    if (v === true) return 'ใช่';
    if (v === false) return 'ไม่';
    if (v === '' || v == null) return '(ว่าง)';
    if (k === 'vat_term') return vatLabel(v);
    if (k === 'product_group_code') return groupName(v);
    return String(v);
  }

  function timelineHtml(d) {
    const dataCount = d.timeline.filter(function (l) { return l.log_type !== 'transition'; }).length;
    return '<div class="card"><h3>Timeline (ประวัติการทำรายการ)</h3>' +
      (dataCount ? '<label class="small" style="display:flex;gap:8px;align-items:center;min-height:36px;margin-bottom:8px">' +
        '<input type="checkbox" id="tl-data"> แสดงการแก้ไขข้อมูลด้วย (' + dataCount + ' รายการ)</label>' : '') +
      '<ul class="timeline" id="tl">' + d.timeline.slice().reverse().map(function (l) {
        const isTransition = l.log_type === 'transition';
        const m = l.metadata || {};
        let detail = '';
        if (isTransition) {
          detail = esc(l.from_stage ? stageText(l.from_stage) + ' → ' + stageText(l.to_stage) : '→ ' + stageText(l.to_stage));
          if (m.from_sr !== undefined && m.to_sr) detail += '<div>มอบหมายให้ ' + esc(m.to_sr) + '</div>';
        } else {
          const added = m.quote && m.quote.vendor_name ? m.quote.vendor_name['new'] || m.quote.vendor_name : '';
          const itemName = m.item && m.item.product_name ? ' ' + m.item.product_name : '';
          const subject = m.label || m.vendor_name || added || m.file_name || (m.line_no ? 'รายการที่ ' + m.line_no + itemName : '');
          if (subject) detail += '<div>' + esc(subject) + '</div>';
          if (m.diff) {
            detail += Object.keys(m.diff).map(function (k) {
              return '<div>' + esc(FIELD_LABEL[k] || k) + ': ' + esc(showVal(k, m.diff[k].old)) + ' → <b>' + esc(showVal(k, m.diff[k]['new'])) + '</b></div>';
            }).join('');
          }
          if (m.reason) detail += '<div>เหตุผล: ' + esc(m.reason) + '</div>';
        }
        return '<li class="' + (isTransition ? '' : 'data') + '"' + (isTransition ? '' : ' data-kind="data" hidden') + '><div><b>' + esc(l.action_label) + '</b> · ' + esc(l.actor_name) +
          (l.on_behalf_name ? ' <span class="small muted">(แทน ' + esc(l.on_behalf_name) + ')</span>' : '') +
          ' <span class="muted small">(' + esc(l.actor_role) + ')</span></div><div class="meta">' + esc(l.ts_bkk) +
          (l.stage_duration_sec != null && isTransition && l.from_stage ? ' · อยู่ในขั้นตอนก่อนหน้า ' + esc(fmtHours(l.stage_duration_sec / 3600)) : '') + '</div>' +
          (detail ? '<div class="small">' + detail + '</div>' : '') +
          (l.comment ? '<div class="cmt">' + esc(l.comment) + '</div>' : '') + '</li>';
      }).join('') + '</ul></div>';
  }

  function runAction(view, d, action) {
    const t = d.ticket;
    const ui = ACTION_UI[action];
    let html = '';
    const pickSr = ui.select === 'sr' || (ui.select === 'sr_gm' && state.ref.gm_assigns_sr) || (action === 'claim' && d.me.role === 'admin');
    if (pickSr) {
      html = '<label class="field"><span>' + (ui.select === 'sr_gm' ? 'Sourcing ผู้ทำราคา' : 'มอบหมายให้ SR') + ' <span class="req">*</span></span><select id="dlg-sr"><option value="">— เลือก SR —</option>' +
        state.ref.sr_users.filter(function (u) { return u.email !== t.sr_email; })
          .map(function (u) { return '<option value="' + esc(u.email) + '">' + esc(u.full_name) + '</option>'; }).join('') + '</select></label>';
    }
    if (ui.fields) {
      const auto = completeness(d).filter(function (r) { return !r.ok; }).map(function (r) { return r.key; });
      const REQ_FIELDS = ['รูปภาพสินค้า', 'สเปก / Grade / ขนาด', '% Net Weight', 'Packing', 'ปริมาณ', 'ราคาที่ลูกค้าคาดหวัง', 'เอกสารที่ต้องการ',
        'ประเทศปลายทาง / กลุ่มลูกค้า', 'วันที่ต้องการ (เร็วเกินไป)', 'อื่นๆ (ระบุในเหตุผล)'];
      html = '<p class="small">เลือกข้อมูลที่ยังขาด (ระบบติ๊กให้ตามที่ตรวจพบ)</p><div class="miss-grid">' + REQ_FIELDS.map(function (f) {
        return '<label class="chk-inline"><input type="checkbox" class="dlg-miss" value="' + esc(f) + '"' + (auto.indexOf(f) !== -1 ? ' checked' : '') + '> ' + esc(f) + '</label>';
      }).join('') + '</div>';
    }
    if (ui.checklist && d.checklist.length) {
      html = '<p class="small">เลือกเอกสารที่ยังขาด (ถ้ามี)</p>' + d.checklist.map(function (c) {
        return '<label style="display:flex;gap:8px;align-items:center;min-height:36px"><input type="checkbox" class="dlg-miss" value="' + esc(c.item_key) + '"' +
          (c.is_checked ? '' : ' checked') + '> ' + esc(c.label) + '</label>';
      }).join('');
    }
    dialog({
      title: ui.label, message: (ui.confirm || '').replace('{no}', t.ticket_no), html: html,
      comment: ui.comment, commentLabel: ui.commentLabel, danger: ui.cls === 'danger', confirmText: ui.label,
      validate: function (root) { if (pickSr && !$('#dlg-sr', root).value) return 'กรุณาเลือก SR'; return null; }
    }).then(function (res) {
      if (!res) return;
      const payload = { expected_version: t.version };
      if (pickSr) payload.sr_email = $('#dlg-sr', res.root).value;
      if (ui.checklist || ui.fields) payload.missing_items = $all('.dlg-miss', res.root).filter(function (x) { return x.checked; }).map(function (x) { return x.value; });
      toast('กำลังบันทึก...');
      api('transitionTicket', t.ticket_id, action, res.comment, payload).then(function (r) {
        toast(ui.label + ' สำเร็จ — ' + r.ticket.ticket_no + ' : ' + r.ticket.stage_label, 'ok');
        refreshPoll();
        load(view, t.ticket_id);
      }).catch(function (e) {
        toast(e.error, 'err');
        if (e.code === 'VERSION_CONFLICT') load(view, t.ticket_id);
      });
    });
  }

  function bind(view, d) {
    const t = d.ticket;
    Photos.bind(view, { attachments: function () { return d.attachments; } });
    $all('[data-action]', view).forEach(function (b) { b.onclick = function () { runAction(view, d, b.getAttribute('data-action')); }; });
    const reload = function () { load(view, t.ticket_id); };
    ItemAssign.bindPanel(view, d, reload);
    $all('[data-transfer]', view).forEach(function (b) {
      b.onclick = function () { ItemAssign.transfer(d, d.items.filter(function (x) { return x.item_id === b.getAttribute('data-transfer'); })[0], reload); };
    });
    $all('[data-nav]', view).forEach(function (b) { b.onclick = function () { go({ page: b.getAttribute('data-nav'), id: t.ticket_id }); }; });
    $all('[data-copy]', view).forEach(function (b) { b.onclick = function () { go({ page: 'new', copy: t.ticket_id }); }; });
    $all('[data-goto]', view).forEach(function (a) { a.onclick = function (e) { e.preventDefault(); go({ page: 'ticket', id: a.getAttribute('data-goto') }); }; });
    $all('[data-open]', view).forEach(function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        const w = window.open('about:blank', '_blank');   // open synchronously so pop-up blockers allow it
        api('openAttachment', a.getAttribute('data-open')).then(function (r) {
          if (w) w.location = r.url; else window.open(r.url, '_blank');
        }).catch(function (err) { if (w) w.close(); toast(err.error, 'err'); });
      };
    });
    $all('[data-del]', view).forEach(function (b) {
      b.onclick = function () {
        dialog({ title: 'ลบไฟล์แนบ', message: 'ยืนยันลบไฟล์นี้?', danger: true, confirmText: 'ลบ' }).then(function (res) {
          if (!res) return;
          api('deleteAttachment', b.getAttribute('data-del')).then(function () { toast('ลบไฟล์แล้ว', 'ok'); load(view, t.ticket_id); })
            .catch(function (e) { toast(e.error, 'err'); });
        });
      };
    });
    const tl = $('#tl-data', view);
    if (tl) tl.onchange = function () { $all('[data-kind="data"]', view).forEach(function (li) { li.hidden = !tl.checked; }); };
    const input = $('#att-input', view);
    if (input) {
      input.onchange = function () {
        const files = Array.prototype.slice.call(input.files || []);
        input.value = '';
        const box = $('#att-progress', view);
        let chain = Promise.resolve();
        files.forEach(function (f) {
          chain = chain.then(function () {
            const row = document.createElement('div');
            row.innerHTML = '<div class="small">' + esc(f.name) + '</div><div class="progress"><div></div></div>';
            box.appendChild(row);
            return uploadFile(f, { ticket_id: t.ticket_id, category: $('#att-cat', view).value }, function (p) {
              row.querySelector('.progress > div').style.width = Math.round(p * 100) + '%';
            }).then(function () { toast('แนบไฟล์ ' + f.name + ' แล้ว', 'ok'); })
              .catch(function (e) { toast(f.name + ': ' + e.error, 'err'); row.remove(); });
          });
        });
        chain.then(function () { load(view, t.ticket_id); });
      };
    }
  }

  function load(view, id, isCurrent) {
    api('getTicket', id).then(function (d) {
      if (isCurrent && !isCurrent()) return;
      view.innerHTML = header(d) + notices(d) + actionBar(d) + ItemAssign.panelHtml(d) + itemsHtml(d) + checklistHtml(d) + attachmentsHtml(d) + timelineHtml(d);
      bind(view, d);
    }).catch(function (e) {
      if (isCurrent && !isCurrent()) return;
      view.innerHTML = errorHtml(e, 'App.reload()') + '<p style="text-align:center"><button class="btn" onclick="App.go({page:\'tickets\'})">กลับไปหน้ารายการ</button></p>';
    });
  }

  return {
    render: function (view, route, isCurrent) {
      if (!route.id) { go({ page: 'tickets' }, true); return; }
      load(view, route.id, isCurrent);
    }
  };
})();
</script>

  <!-- ===== PageForm.html ===== -->
<!--
  File: PageForm.html
  แบบฟอร์มขอราคาสินค้า (Price Request – Food): create (page=new) or edit while pending_manager / returned (page=edit).
  Field order follows the original Lark form. Every rule is re-checked on the server (createTicket / saveItem).
  - client_key generated once per form → double click / retry after timeout creates ONE request
  - item_id generated in the browser → product pictures are attached to the right product after saving
-->
<script>
Pages.new = Pages.edit = (function () {
  function blankItem() {
    return { item_id: uuid(), product_group_code: '', product_name: '', net_weight: '', size: '', packing_size: '', qty: '', uom: 'กก.',
      target_price: '', pictures: [] };
  }
  /** Today + n working days (Mon–Fri), Bangkok date. */
  function workingDaysFromToday(n) {
    let d = new Date(todayYmd(0) + 'T00:00:00Z');
    let left = n;
    while (left > 0) {
      d = new Date(d.getTime() + 86400000);
      const wd = d.getUTCDay();
      if (wd !== 0 && wd !== 6) left--;
    }
    return d.toISOString().slice(0, 10);
  }
  function newDraft() {
    return { client_key: uuid(), customer_name: '', customer_group: '', destination_country: 'ไทย', documents_needed: '', due_date: workingDaysFromToday(state.ref.default_due_working_days || 3),
      description: '', items: [blankItem()], _dueDefault: true };
  }
  function historyLists() {
    const h = state.salesHistory || { customers: [], products: [] };
    return '<datalist id="cust-list">' + h.customers.map(function (c) { return '<option value="' + esc(c.name) + '">'; }).join('') + '</datalist>' +
      '<datalist id="dest-list">' + ['ไทย', 'ญี่ปุ่น', 'จีน', 'เกาหลีใต้', 'สิงคโปร์', 'มาเลเซีย', 'เวียดนาม', 'กัมพูชา', 'ลาว', 'เมียนมา', 'ฮ่องกง', 'ไต้หวัน', 'สหรัฐอเมริกา', 'ออสเตรเลีย', 'สหภาพยุโรป', 'ตะวันออกกลาง']
        .map(function (c) { return '<option value="' + c + '">'; }).join('') + '</datalist>' +
      '<datalist id="prod-list">' + h.products.map(function (p) { return '<option value="' + esc(p.name) + '">'; }).join('') + '</datalist>';
  }
  function docChips(d) {
    const cur = String(d.documents_needed || '').split(/\s*,\s*/).map(function (x) { return x.toLowerCase(); });
    return '<div class="doc-chips">' + (state.ref.document_options || []).map(function (o) {
      const on = cur.indexOf(o.toLowerCase()) !== -1;
      return '<button type="button" class="doc-chip' + (on ? ' on' : '') + '" data-doc="' + esc(o) + '" aria-pressed="' + on + '">' + (on ? '✓ ' : '+ ') + esc(o) + '</button>';
    }).join('') + '</div>';
  }

  function subGroupOptions(selected) {
    const groups = state.ref.product_groups.filter(function (g) { return g.parent_code; });
    return '<option value="">— เลือกกลุ่มสินค้า —</option>' + groups.map(function (g) {
      return '<option value="' + esc(g.code) + '"' + (selected === g.code ? ' selected' : '') + '>' + esc(g.name) + '</option>';
    }).join('');
  }

  /** One form field: Thai label + English sub-label on one line, input, then hint UNDER the input (keeps columns aligned). */
  function field(label, en, input, opts) {
    const o = opts || {};
    return '<label class="field' + (o.span ? ' span-' + o.span : '') + '"><span>' + esc(label) + (o.req ? ' <span class="req">*</span>' : '') +
      (en ? ' <em>' + esc(en) + '</em>' : '') + '</span>' + input + (o.hint ? '<small class="hint">' + esc(o.hint) + '</small>' : '') + '</label>';
  }

  function itemHtml(it, i, count) {
    const units = (state.ref.units || []).map(function (u) { return '<option' + (it.uom === u ? ' selected' : '') + '>' + esc(u) + '</option>'; }).join('');
    return '<div class="item-row" data-i="' + i + '"><div class="head"><span class="no">' + (i + 1) + '</span><span>สินค้ารายการที่ ' + (i + 1) + '</span><span class="sep"></span>' +
      (count > 1 ? '<button type="button" class="btn sm danger" data-remove="' + i + '">ลบสินค้านี้</button>' : '') + '</div>' +
      '<div class="fgrid">' +
      field('ชื่อสินค้า', 'Product', '<input type="text" data-k="product_name" list="prod-list" maxlength="300" placeholder="เช่น กุ้งขาว Vannamei HLSO — หรือเลือกสินค้าที่เคยขอ" value="' + esc(it.product_name) + '">', { req: true, span: 2, hint: 'เลือกสินค้าที่เคยขอ ระบบเติม NW / Size / Packing ให้ (แก้ได้)' }) +
      field('กลุ่มสินค้า', 'Product Group', '<select data-k="product_group_code">' + subGroupOptions(it.product_group_code) + '</select>', { req: true, hint: 'ใช้ส่งงานให้ SR ประจำกลุ่ม — ไม่แน่ใจเลือก “อื่นๆ (Others)”' }) +
      field('น้ำหนักสุทธิ', '% Net Weight', '<input type="text" data-k="net_weight" maxlength="100" placeholder="เช่น 80% หรือ NW 90%" value="' + esc(it.net_weight) + '">', { req: true, hint: 'ไม่รวมน้ำแข็ง' }) +
      field('ขนาด', 'Size', '<input type="text" data-k="size" maxlength="100" placeholder="เช่น 31/40 หรือ 1.0–1.5 kg/pc" value="' + esc(it.size) + '">', { req: true }) +
      field('แพคย่อย', 'Packing Size', '<input type="text" data-k="packing_size" maxlength="100" placeholder="เช่น 1 Kg/Pack หรือ 500 g" value="' + esc(it.packing_size) + '">', { req: true }) +
      field('ปริมาณต่อเดือน', 'Qty / month', '<input type="number" inputmode="decimal" min="0" step="any" data-k="qty" placeholder="0" value="' + esc(it.qty) + '">', { req: true }) +
      field('หน่วย', 'Unit', '<select data-k="uom"><option value="">— เลือก —</option>' + units + '</select>', { req: true }) +
      field('ราคาที่ลูกค้าคาดหวัง (บาท/หน่วย)', 'Expected Price', '<input type="number" inputmode="decimal" min="0" step="any" data-k="target_price" placeholder="0.00" value="' +
        esc(it.no_target ? '' : it.target_price) + '"' + (it.no_target ? ' disabled' : '') + '>' +
        '<label class="chk-inline no-target"><input type="checkbox" data-notarget="' + i + '"' + (it.no_target ? ' checked' : '') + '> ลูกค้ายังไม่บอกราคา</label>',
        { req: true, hint: 'ราคาที่ลูกค้าพร้อมซื้อ — ใช้ติดตามการขายหลังได้ราคา' }) +
      '<div class="field span-3"><span>รูปภาพสินค้า <em>Picture</em></span><div class="drop" data-drop="' + i + '">' +
      '<label class="btn sm"><input type="file" data-pic="' + i + '" multiple hidden accept="image/*,.pdf">＋ เลือกรูป / ไฟล์</label>' +
      '<span class="small muted">หรือลากไฟล์มาวางที่นี่ · รูปหรือ PDF ไม่เกิน ' + state.ref.max_upload_mb + ' MB</span>' +
      '<div class="pics">' + it.pictures.map(function (f, k) {
        return '<span class="pic">' + (f.type.indexOf('image/') === 0 ? '🖼️ ' : '📄 ') + esc(f.name) + ' <button type="button" class="btn sm ghost" data-rmpic="' + i + ':' + k + '" aria-label="เอาออก">✕</button></span>';
      }).join('') + '</div></div></div>' +
      '</div></div>';
  }

  function routeSteps() {
    // approval route as steps; the text comes from the server (it knows whether the Sales Manager step is skipped)
    const parts = String(state.approvalRoute || '').split('→').map(function (x) { return x.trim(); }).filter(Boolean);
    if (!parts.length) return '';
    return '<ol class="route-steps" aria-label="เส้นทางอนุมัติ">' + parts.map(function (x, k) {
      return '<li><span class="n">' + (k + 1) + '</span>' + esc(x) + '</li>';
    }).join('') + '</ol>';
  }

  function formHtml(d, mode, ticket) {
    return '<div class="form-wrap">' +
      '<div class="page-head form-title"><div><h1>' + (mode === 'edit' ? 'แก้ไขใบขอราคา ' + esc(ticket.ticket_no) : 'สร้างใบขอราคา') + '</h1>' +
      '<div class="small muted">แบบฟอร์มขอราคาสินค้า FOOD · M Global Sourcing Ltd.</div></div></div>' +
      (state.approvalRoute ? '<div class="card route-card"><div class="sec-label">เส้นทางอนุมัติ</div>' + routeSteps() + '</div>' : '') +
      (mode === 'edit' && ticket.stage === 'returned' ? '<div class="notice warn">Sales Manager ส่งกลับให้แก้ไข — แก้แล้วกด “บันทึกและส่งอีกครั้ง”</div>' : '') +
      '<form id="pr-form" novalidate>' +
      '<section class="card fsec"><h2><span class="sn">1</span>ข้อมูลลูกค้า</h2><div class="fgrid">' +
      (mode !== 'edit' && state.me.role === 'admin' ? field('Sales ผู้ขอราคา', 'Requester (Admin สร้างแทน)', '<select id="f-req"><option value="">— เลือก Sales —</option>' +
        (state.ref.sales_users || []).map(function (u) { return '<option value="' + esc(u.email) + '"' + (d.requestor_email === u.email ? ' selected' : '') + '>' + esc(u.full_name) + '</option>'; }).join('') +
        '</select>', { req: true }) : '') +
      field('ชื่อลูกค้า', 'Customer', '<input type="text" id="f-customer" list="cust-list" maxlength="200" placeholder="พิมพ์หรือเลือกลูกค้าที่เคยขอ" value="' + esc(d.customer_name) + '">', { req: true }) +
      field('กลุ่มลูกค้า', 'Customer Group', '<select id="f-cgroup"><option value="">— เลือก —</option>' + (state.ref.customer_groups || []).map(function (g) {
        return '<option' + (d.customer_group === g ? ' selected' : '') + '>' + esc(g) + '</option>'; }).join('') + '</select>', { req: true }) +
      field('ประเทศปลายทาง', 'Destination', '<input type="text" id="f-dest" list="dest-list" maxlength="60" value="' + esc(d.destination_country || 'ไทย') + '">',
        { hint: 'ขายในประเทศ = ไทย · ส่งออกให้ระบุประเทศ' }) +
      field('วันที่ต้องการให้ตอบกลับราคา', 'Expected Date', '<input type="date" id="f-due" min="' + todayYmd(0) + '" value="' + esc(d.due_date) + '"' + (d._dueDefault ? ' class="auto"' : '') + '>' +
        '<div class="due-quick"><button type="button" class="btn sm ghost" data-due="3">+3 วันทำการ</button><button type="button" class="btn sm ghost" data-due="5">+5 วันทำการ</button><button type="button" class="btn sm ghost" data-due="10">+2 สัปดาห์</button></div>', { req: true }) +
      field('ผู้ร้องขอ', 'Requester', '<input type="text" id="f-requester" disabled value="' + esc(state.me.full_name) + '">', { hint: 'ใช้บัญชีที่เข้าสู่ระบบ' }) +
      '</div></section>' +
      '<section class="card fsec"><h2><span class="sn">2</span>รายการสินค้า</h2>' +
      '<div id="items">' + d.items.map(function (it, i) { return itemHtml(it, i, d.items.length); }).join('') + '</div>' +
      '<button type="button" class="btn" id="add-item">＋ เพิ่มสินค้าอีกรายการ</button></section>' +
      '<section class="card fsec"><h2><span class="sn">3</span>เอกสารและหมายเหตุ</h2><div class="fgrid two">' +
      field('เอกสารที่ต้องการประกอบ', 'Documents Needed', docChips(d) + '<textarea id="f-docs" maxlength="2000" rows="2" placeholder="กดเลือกด้านบน หรือพิมพ์เพิ่ม คั่นด้วย ,">' + esc(d.documents_needed) + '</textarea>',
        { hint: 'ไม่ระบุ = ไม่ต้องการเอกสารประกอบ' }) +
      field('หมายเหตุ', 'Remark', '<textarea id="f-remark" maxlength="2000" rows="3" placeholder="ข้อมูลที่ต้องการแจ้งเพิ่มเติม">' + esc(d.description) + '</textarea>') +
      '</div></section>' +
      '<div class="form-actions"><div class="err-text" id="form-err"></div><span class="sep"></span>' +
      '<button type="button" class="btn" id="cancel-btn">ยกเลิก</button>' +
      (mode === 'edit' ? '<button type="button" class="btn" id="save-btn">บันทึก</button>' +
        (ticket.stage === 'returned' ? '<button type="button" class="btn primary" id="save-resubmit">บันทึกและส่งอีกครั้ง</button>' : '')
        : '<button type="button" class="btn primary submit" id="save-btn">ส่งใบขอราคา</button>') +
      '</div><div id="upload-progress" style="margin-top:12px"></div></form>' + historyLists() + '</div>';
  }

  function collect(view, d) {
    if ($('#f-req', view)) d.requestor_email = $('#f-req', view).value;
    d.customer_name = $('#f-customer', view).value;
    d.customer_group = $('#f-cgroup', view).value;
    d.destination_country = $('#f-dest', view).value;
    d.documents_needed = $('#f-docs', view).value;
    d.due_date = $('#f-due', view).value;
    d.description = $('#f-remark', view).value;
    $all('.item-row', view).forEach(function (row) {
      const it = d.items[Number(row.getAttribute('data-i'))];
      $all('[data-k]', row).forEach(function (el) { it[el.getAttribute('data-k')] = el.value; });
      const nt = $('[data-notarget]', row);
      it.no_target = !!(nt && nt.checked);
      if (it.no_target) it.target_price = '0';
    });
  }

  function validate(view, d) {
    $all('.invalid', view).forEach(function (el) { el.classList.remove('invalid'); });
    $all('.field .err-text', view).forEach(function (el) { el.remove(); });
    let errors = 0;
    const mark = function (el, msg) {
      errors++;
      el.classList.add('invalid');
      const m = document.createElement('div');
      m.className = 'err-text';
      m.textContent = msg;
      el.parentNode.appendChild(m);
    };
    if ($('#f-req', view) && !d.requestor_email) mark($('#f-req', view), 'กรุณาเลือก Sales ผู้ขอราคา');
    if (!d.customer_name.trim()) mark($('#f-customer', view), 'กรุณากรอกชื่อลูกค้า');
    if (!d.customer_group) mark($('#f-cgroup', view), 'กรุณาเลือกกลุ่มลูกค้า');
    else if (/ส่งออก/.test(d.customer_group) && /^(ไทย|thailand|th)?$/i.test(String(d.destination_country || '').trim())) mark($('#f-dest', view), 'ส่งออก — ระบุประเทศปลายทาง');
    if (!d.due_date) mark($('#f-due', view), 'กรุณาเลือกวันที่ต้องการให้ตอบกลับราคา');
    else if (d.due_date < todayYmd(0)) mark($('#f-due', view), 'วันที่ต้องไม่เป็นวันที่ผ่านมาแล้ว');
    $all('.item-row', view).forEach(function (row) {
      const get = function (k) { return $('[data-k="' + k + '"]', row); };
      if (!get('product_name').value.trim()) mark(get('product_name'), 'กรอกชื่อสินค้า');
      if (!get('product_group_code').value) mark(get('product_group_code'), 'เลือกกลุ่มสินค้า');
      if (!get('net_weight').value.trim()) mark(get('net_weight'), 'กรอก % Net Weight');
      if (!get('size').value.trim()) mark(get('size'), 'กรอกขนาด');
      if (!get('packing_size').value.trim()) mark(get('packing_size'), 'กรอกขนาดแพคย่อย');
      if (!get('qty').value || !(Number(get('qty').value) > 0)) mark(get('qty'), 'ปริมาณต้องมากกว่า 0');
      if (!get('uom').value) mark(get('uom'), 'เลือกหน่วย');
      const tp = $('[data-notarget]', row) && $('[data-notarget]', row).checked ? '0' : get('target_price').value;
      if (tp === '') mark(get('target_price'), 'กรอกราคาที่ลูกค้าคาดหวัง หรือติ๊ก “ลูกค้ายังไม่บอกราคา”');
      else if (Number(tp) < 0) mark(get('target_price'), 'ต้องไม่ติดลบ');
    });
    $('#form-err', view).textContent = errors ? 'ยังกรอกไม่ครบ ' + errors + ' ช่อง (ไฮไลต์สีแดง)' : '';
    if (errors) { const first = $('.invalid', view); if (first) first.focus(); }
    return errors;
  }

  function payloadItem(it) {
    return { item_id: it.item_id, product_group_code: it.product_group_code, product_name: it.product_name.trim(), net_weight: it.net_weight.trim(),
      size: it.size.trim(), packing_size: it.packing_size.trim(), qty: it.qty, uom: it.uom, target_price: it.target_price };
  }
  function autoTitle(d) {
    const first = d.items[0] ? d.items[0].product_name.trim() : '';
    return (d.customer_name.trim() + ' — ' + first + (d.items.length > 1 ? ' และอีก ' + (d.items.length - 1) + ' รายการ' : '')).slice(0, 200);
  }

  function setBusy(view, busy, text) {
    $all('#pr-form button', view).forEach(function (b) { b.disabled = busy; });
    const btn = $('#save-btn', view);
    if (btn && text) btn.textContent = text;
  }

  /** Upload product pictures one by one, each linked to its product (item_id). */
  function uploadPictures(view, ticketId, d) {
    const box = $('#upload-progress', view);
    let chain = Promise.resolve();
    let failed = 0;
    d.items.forEach(function (it) {
      it.pictures.forEach(function (f) {
        chain = chain.then(function () {
          const row = document.createElement('div');
          row.innerHTML = '<div class="small">' + esc(it.product_name) + ': ' + esc(f.name) + '</div><div class="progress"><div></div></div>';
          box.appendChild(row);
          return uploadFile(f, { ticket_id: ticketId, item_id: it.item_id, category: 'request' }, function (p) {
            row.querySelector('.progress > div').style.width = Math.round(p * 100) + '%';
          }).catch(function (e) { failed++; toast(f.name + ': ' + e.error, 'err'); });
        });
      });
    });
    return chain.then(function () { return failed; });
  }

  function submitNew(view, d) {
    collect(view, d);
    if (validate(view, d)) return;
    setBusy(view, true, 'กำลังส่ง...');
    api('createTicket', {
      client_key: d.client_key, title: autoTitle(d), customer_name: d.customer_name.trim(), documents_needed: d.documents_needed,
      customer_group: d.customer_group, destination_country: d.destination_country, requestor_email: d.requestor_email || '',
      due_date: d.due_date, description: d.description, items: d.items.map(payloadItem)
    }).then(function (res) {
      const t = res.ticket;
      return uploadPictures(view, t.ticket_id, d).then(function (failed) {
        delete state.drafts['new'];
        toast('ส่งคำขอราคา ' + t.ticket_no + ' แล้ว → ' + t.stage_label + (failed ? ' (รูปแนบไม่สำเร็จ ' + failed + ' ไฟล์ — แนบใหม่ได้ในหน้ารายละเอียด)' : ''), failed ? 'err' : 'ok', 7000);
        refreshPoll();
        go({ page: 'ticket', id: t.ticket_id }, true);
      });
    }).catch(function (e) {
      setBusy(view, false, 'Submit');
      $('#form-err', view).textContent = e.error;
      toast(e.error, 'err');
    });
  }

  function submitEdit(view, d, original, resubmit) {
    collect(view, d);
    if (validate(view, d)) return;
    setBusy(view, true);
    const t = original.ticket;
    let version = t.version;
    const steps = [];
    steps.push(function () {
      return api('updateTicketRequest', t.ticket_id, { title: autoTitle(d), customer_name: d.customer_name.trim(), documents_needed: d.documents_needed,
        customer_group: d.customer_group, destination_country: d.destination_country,
        due_date: d.due_date, description: d.description }, version).then(function (r) { version = r.ticket.version; });
    });
    const keep = {};
    d.items.forEach(function (it) {
      keep[it.item_id] = true;
      steps.push(function () { return api('saveItem', t.ticket_id, payloadItem(it), version).then(function (r) { version = r.version; }); });
    });
    original.items.forEach(function (it) {
      if (!keep[it.item_id]) steps.push(function () { return api('deleteItem', t.ticket_id, it.item_id, version).then(function (r) { version = r.version; }); });
    });
    steps.push(function () { return uploadPictures(view, t.ticket_id, d); });
    if (resubmit) steps.push(function () { return api('transitionTicket', t.ticket_id, 'resubmit', '', { expected_version: version }); });
    steps.reduce(function (p, step) { return p.then(step); }, Promise.resolve()).then(function () {
      delete state.drafts['edit:' + t.ticket_id];
      toast(resubmit ? 'บันทึกและส่งอีกครั้งแล้ว' : 'บันทึกการแก้ไขแล้ว', 'ok');
      refreshPoll();
      go({ page: 'ticket', id: t.ticket_id }, true);
    }).catch(function (e) {
      setBusy(view, false);
      $('#form-err', view).textContent = e.error;
      toast(e.error, 'err');
    });
  }

  function addPictures(d, i, files) {
    const max = state.ref.max_upload_mb * 1048576;
    Array.prototype.slice.call(files || []).forEach(function (f) {
      if (f.size > max) toast(f.name + ': ไฟล์ใหญ่เกิน ' + state.ref.max_upload_mb + ' MB', 'err');
      else if (!/^image\//.test(f.type) && f.type !== 'application/pdf') toast(f.name + ': รับเฉพาะรูปภาพหรือ PDF', 'err');
      else d.items[i].pictures.push(f);
    });
  }

  function refreshDocChips(view, d) {
    const cur = String(d.documents_needed || '').split(/\s*,\s*/).map(function (x) { return x.toLowerCase(); });
    $all('[data-doc]', view).forEach(function (b) {
      const on = cur.indexOf(b.getAttribute('data-doc').toLowerCase()) !== -1;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
      b.textContent = (on ? '✓ ' : '+ ') + b.getAttribute('data-doc');
    });
  }
  function loadHistory(view, d, mode, original) {
    if (state.salesHistory || state.me.role !== 'sales') return;
    api('getSalesHistory').then(function (h) {
      state.salesHistory = h;
      const host = $('.form-wrap', view);
      if (!host) return;
      $all('#cust-list, #prod-list', view).forEach(function (x) { x.remove(); });
      host.insertAdjacentHTML('beforeend', historyLists());
    }).catch(function () { /* suggestions are optional */ });
  }

  function mount(view, d, mode, original) {
    loadHistory(view, d, mode, original);
    view.innerHTML = formHtml(d, mode, original && original.ticket);
    const rerender = function () { collect(view, d); mount(view, d, mode, original); };
    $('#add-item', view).onclick = function () {
      collect(view, d);
      if (d.items.length >= 100) { toast('ใบขอราคา 1 ใบมีได้ไม่เกิน 100 รายการ', 'err'); return; }
      d.items.push(blankItem());
      mount(view, d, mode, original);
      const rows = $all('.item-row', view);
      rows[rows.length - 1].scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    $all('[data-remove]', view).forEach(function (b) {
      b.onclick = function () { collect(view, d); d.items.splice(Number(b.getAttribute('data-remove')), 1); rerender(); };
    });
    $all('[data-pic]', view).forEach(function (input) {
      input.onchange = function () { collect(view, d); addPictures(d, Number(input.getAttribute('data-pic')), input.files); rerender(); };
    });
    $all('[data-drop]', view).forEach(function (zone) {
      zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.classList.add('over'); });
      zone.addEventListener('dragleave', function () { zone.classList.remove('over'); });
      zone.addEventListener('drop', function (e) {
        e.preventDefault();
        collect(view, d);
        addPictures(d, Number(zone.getAttribute('data-drop')), e.dataTransfer && e.dataTransfer.files);
        rerender();
      });
    });
    $all('[data-rmpic]', view).forEach(function (b) {
      b.onclick = function () {
        const parts = b.getAttribute('data-rmpic').split(':');
        collect(view, d);
        d.items[Number(parts[0])].pictures.splice(Number(parts[1]), 1);
        rerender();
      };
    });
    $('#pr-form', view).addEventListener('input', function (e) {
      collect(view, d);
      const el = e.target;
      if (el.id === 'f-due') { d._dueDefault = false; el.classList.remove('auto'); }
      if (el.id === 'f-docs') refreshDocChips(view, d);
    });
    // customer picked from history → documents asked last time (only when still empty)
    $('#f-customer', view).addEventListener('change', function () {
      const c = ((state.salesHistory || {}).customers || []).filter(function (x) { return x.name.toLowerCase() === this.value.trim().toLowerCase(); }, this)[0];
      if (c && c.customer_group && !$('#f-cgroup', view).value) {
        $('#f-cgroup', view).value = c.customer_group; $('#f-cgroup', view).classList.add('auto');
        if (c.destination_country) { $('#f-dest', view).value = c.destination_country; $('#f-dest', view).classList.add('auto'); }
        collect(view, d);
      }
      if (c && c.documents_needed && !$('#f-docs', view).value.trim()) {
        $('#f-docs', view).value = c.documents_needed;
        $('#f-docs', view).classList.add('auto');
        collect(view, d); refreshDocChips(view, d);
        toast('เติมเอกสารที่ลูกค้านี้ขอครั้งล่าสุดให้แล้ว (แก้ได้)', 'ok');
      }
    });
    // product picked from history → specs used last time (fills empty boxes only)
    $all('[data-k="product_name"]', view).forEach(function (inpEl) {
      inpEl.addEventListener('change', function () {
        const p = ((state.salesHistory || {}).products || []).filter(function (x) { return x.name.toLowerCase() === inpEl.value.trim().toLowerCase(); })[0];
        if (!p || inpEl.dataset.filledFor === p.name) return;
        inpEl.dataset.filledFor = p.name;
        const row = inpEl.closest('.item-row');
        let filled = 0;
        ['product_group_code', 'net_weight', 'size', 'packing_size', 'uom'].forEach(function (k) {
          const el = $('[data-k="' + k + '"]', row);
          if (!el || !p[k] || (el.value && !(k === 'uom' && el.value === 'กก.'))) return;
          if (k === 'product_group_code' && p[k] === 'FOOD') return;
          el.value = p[k]; el.classList.add('auto'); filled++;
        });
        collect(view, d);
        if (filled) toast('เติมสเปกจากครั้งก่อนให้ ' + filled + ' ช่อง (แก้ได้)', 'ok');
      });
    });
    $all('[data-notarget]', view).forEach(function (cb) {
      cb.onchange = function () {
        const row = cb.closest('.item-row');
        const tp = $('[data-k="target_price"]', row);
        tp.disabled = cb.checked;
        if (cb.checked) tp.value = '';
        collect(view, d);
      };
    });
    $all('[data-due]', view).forEach(function (b) {
      b.onclick = function () { $('#f-due', view).value = workingDaysFromToday(Number(b.getAttribute('data-due'))); d._dueDefault = false; $('#f-due', view).classList.remove('auto'); collect(view, d); };
    });
    $all('[data-doc]', view).forEach(function (b) {
      b.onclick = function () {
        const name = b.getAttribute('data-doc');
        const ta = $('#f-docs', view);
        const parts = ta.value.split(/\s*,\s*/).filter(String);
        const at = parts.map(function (x) { return x.toLowerCase(); }).indexOf(name.toLowerCase());
        if (at === -1) parts.push(name); else parts.splice(at, 1);
        ta.value = parts.join(', ');
        collect(view, d); refreshDocChips(view, d);
      };
    });
    $('#cancel-btn', view).onclick = function () {
      if (mode === 'edit') go({ page: 'ticket', id: original.ticket.ticket_id });
      else { delete state.drafts['new']; go({ page: 'tickets', scope: 'mine' }); }
    };
    if (mode === 'new') $('#save-btn', view).onclick = function () { submitNew(view, d); };
    else {
      $('#save-btn', view).onclick = function () { submitEdit(view, d, original, false); };
      if ($('#save-resubmit', view)) $('#save-resubmit', view).onclick = function () { submitEdit(view, d, original, true); };
    }
  }

  return {
    render: function (view, route, isCurrent) {
      if (route.page === 'new') {
        if (state.me.role !== 'sales' && state.me.role !== 'admin') { view.innerHTML = errorHtml({ error: 'เฉพาะ Sales (หรือ Admin สร้างแทน) เท่านั้นที่สร้างใบขอราคาได้' }); return; }
        if (route.copy) {
          // "สร้างใบใหม่จากใบนี้": customer + documents + remark + products (no pictures, new dates)
          view.innerHTML = loadingHtml('กำลังคัดลอกจากใบเดิม...');
          api('getTicket', route.copy).then(function (o) {
            if (!isCurrent()) return;
            const d = newDraft();
            d.customer_name = o.ticket.customer_name || '';
            d.customer_group = o.ticket.customer_group || '';
            d.destination_country = o.ticket.destination_country || 'ไทย';
            d.documents_needed = o.ticket.documents_needed || '';
            d.description = '';
            d.items = o.items.map(function (it) {
              return Object.assign(blankItem(), { product_group_code: it.product_group_code === 'FOOD' ? '' : it.product_group_code, product_name: it.product_name,
                net_weight: it.net_weight, size: it.size, packing_size: it.packing_size, qty: it.qty, uom: it.uom,
                target_price: it.target_price == null ? '' : it.target_price });
            });
            state.drafts['new'] = d;
            google.script.history.replace({ page: 'new' }, { page: 'new' });
            mount(view, d, 'new', null);
            toast('คัดลอกจาก ' + o.ticket.ticket_no + ' แล้ว — ตรวจปริมาณและราคาที่ลูกค้าคาดหวังก่อนส่ง', 'ok', 7000);
          }).catch(function (e) { if (isCurrent()) view.innerHTML = errorHtml(e, 'App.reload()'); });
          return;
        }
        const d = state.drafts['new'] = state.drafts['new'] || newDraft();
        mount(view, d, 'new', null);
        return;
      }
      if (!route.id) { go({ page: 'tickets' }, true); return; }
      api('getTicket', route.id).then(function (o) {
        if (!isCurrent()) return;
        if (!o.permissions.can_edit_request) {
          view.innerHTML = errorHtml({ error: 'ใบนี้แก้ไขไม่ได้แล้ว (แก้ได้เฉพาะ Sales เจ้าของใบ ก่อนอนุมัติ)' }) +
            '<p style="text-align:center"><button class="btn" onclick="App.go({page:\'ticket\',id:\'' + esc(route.id) + '\'})">กลับไปหน้าใบขอราคา</button></p>';
          return;
        }
        const key = 'edit:' + route.id;
        const t = o.ticket;
        const d = state.drafts[key] = state.drafts[key] || {
          customer_name: t.customer_name || '', customer_group: t.customer_group || '', destination_country: t.destination_country || 'ไทย',
          documents_needed: t.documents_needed || '', due_date: t.due_date || '', description: t.description || '',
          items: o.items.map(function (it) {
            return { item_id: it.item_id, product_group_code: it.product_group_code === 'FOOD' ? '' : it.product_group_code, product_name: it.product_name,
              net_weight: it.net_weight, size: it.size, packing_size: it.packing_size, qty: it.qty, uom: it.uom,
              target_price: it.target_price == null ? '' : it.target_price, pictures: [] };
          })
        };
        mount(view, d, 'edit', o);
      }).catch(function (e) { if (isCurrent()) view.innerHTML = errorHtml(e, 'App.reload()'); });
    }
  };
})();

        field('ชื่อเรียก / คำค้น', '<input type="text" id="s-short" maxlength="200" value="' + esc(s.short_name) + '">', { hint: 'เช่น ชื่อย่อ ชื่อภาษาไทย/อังกฤษ' }) +
        field('เลขผู้เสียภาษี', '<input type="text" id="s-tax" maxlength="30" inputmode="numeric" value="' + esc(s.tax_id) + '">', { hint: 'ระบบไม่ให้ซ้ำกับ Supplier อื่น' }) +
        '</div><div class="sec-label">เงื่อนไขการค้า (ใช้เติมใบเสนอราคาอัตโนมัติ)</div><div class="fgrid two">' +

        field('Incoterm', '<select id="s-inco">' + inco.map(function (x) { return opt(x.key, x.label, s.incoterm); }).join('') + '</select>') +
        field('Lead time (วัน)', '<input type="number" id="s-lead" min="0" value="' + esc(s.lead_time_days == null ? '' : s.lead_time_days) + '">') +
        field('MOQ', '<input type="number" id="s-moq" min="0" step="any" value="' + esc(s.moq == null ? '' : s.moq) + '">') +

        field('ค่าเคลียร์ประมาณการ (บาท/กก.)', '<input type="number" id="s-clr" min="0" step="any" value="' + esc(s.clearance_per_kg == null ? '' : s.clearance_per_kg) + '">', { hint: 'ใช้กับ Supplier นำเข้า' }) +
        field('แบรนด์', '<input type="text" id="s-brands" maxlength="300" value="' + esc(s.brands) + '">', { span: 2 }) +

        '<div class="sec-label">ผู้ติดต่อ</div><div class="fgrid two">' +

        (s.certs || []).map(certRow).join('') + '</div><button type="button" class="btn sm" id="s-cert-add">+ เพิ่มใบรับรอง</button></div>' +
        field('หมายเหตุคุณภาพ', '<textarea id="s-qnote" maxlength="1000" rows="2">' + esc(s.quality_note) + '</textarea>') +
        field('หมายเหตุ', '<textarea id="s-note" maxlength="1000" rows="2">' + esc(s.note) + '</textarea>')) +
        '</fieldset><div class="err-text" id="s-err"></div></div>' +

        '<button class="btn" data-close>' + (ro ? 'ปิด' : 'ยกเลิก') + '</button>' + (ro ? '' : '<button class="btn primary" id="s-save">' + (quick ? 'บันทึกและใช้ในใบนี้' : 'บันทึก') + '</button>') +
        '</footer></aside>';
      $('#modal-root').appendChild(root);
      const close = function (val) { root.remove(); document.removeEventListener('keydown', onKey); resolve(val || null); };
      const onKey = function (e) { if (e.key === 'Escape') close(null); };
      document.addEventListener('keydown', onKey);
      $all('[data-close]', root).forEach(function (b) { b.onclick = function () { close(null); }; });
      const v = function (id) { const el = $('#' + id, root); return el ? el.value : undefined; };
      if ($('#s-cert-add', root)) $('#s-cert-add', root).onclick = function () { $('#s-certs', root).insertAdjacentHTML('beforeend', certRow({})); };
      root.addEventListener('click', function (e) { const d = e.target.closest('[data-cert-del]'); if (d) d.closest('.cert-row').remove(); });
      if ($('#s-log', root)) $('#s-log', root).onclick = function () { showLog(s); };

        const p = { vendor_id: s.vendor_id || '', expected_version: s.version, name: v('s-name'), supplier_type: v('s-type'), country: v('s-country'),

            }).catch(function (e) { toast(e.error, 'err'); });
          });
        };
      }
    }
  }

  function draw(view) {
    const list = data.suppliers.filter(matches);
    $('#s-results', view).innerHTML = table(list);
  }
  function load(view) {
    return api('listSuppliers').then(function (d) {
      data = d;
      // keep the pricing-page search list fresh too
      state.ref.vendors = d.suppliers.filter(function (s) { return s.is_active; });
      if ($('#s-results', view)) draw(view);
    }).catch(function (e) { const r = $('#s-results', view); if (r) r.innerHTML = errorHtml(e, 'App.reload()'); });
  }

  return {
    render: function (view) {
      if (['sr', 'sr_manager', 'gm', 'admin'].indexOf(state.me.role) === -1) { go({ page: 'home' }, true); return; }
      view.innerHTML = '<div class="sup-page"><div class="page-head"><h1>Supplier</h1><span class="small muted">ฐานข้อมูลผู้ขาย · ใช้เติมข้อมูลในใบเสนอราคาอัตโนมัติ</span><span class="sep"></span>' +
        (['sr', 'sr_manager', 'admin'].indexOf(state.me.role) !== -1 ? '<button class="btn primary" data-add>+ เพิ่ม Supplier</button>' : '') + '</div>' +
        '<div class="card list-bar"><div class="list-tools"><input type="search" id="s-q" placeholder="ค้นหา ชื่อ / ชื่อเรียก / รหัส / เลขผู้เสียภาษี / แบรนด์" value="' + esc(f.q) + '">' +
        '<select id="s-ftype" aria-label="ประเภท"><option value="">ทุกประเภท</option>' + state.ref.supplier_types.map(function (t) { return '<option value="' + t.key + '"' + (f.type === t.key ? ' selected' : '') + '>' + esc(t.label) + '</option>'; }).join('') + '</select>' +
        '<select id="s-fgroup" aria-label="กลุ่มสินค้า">' + groupOptions(f.group, true) + '</select>' +
        '<label class="chk-inline"><input type="checkbox" id="s-finactive"' + (f.inactive ? ' checked' : '') + '> แสดงที่ปิดใช้งาน</label></div></div>' +
        '<div id="s-results">' + loadingHtml() + '</div>' +
        '<datalist id="origin-list"><option value="ไทย"><option value="นอร์เวย์"><option value="ชิลี"><option value="เวียดนาม"><option value="อินเดีย"><option value="จีน"><option value="ญี่ปุ่น"><option value="ออสเตรเลีย"></datalist>' +
        '<datalist id="pay-list"><option value="เงินสด"><option value="Credit 30 วัน"><option value="Credit 60 วัน"><option value="T/T 30% deposit"><option value="L/C at sight"></datalist></div>';
      const pg = view.firstChild;
      pg.addEventListener('click', function (e) {
        const add = e.target.closest('[data-add]');
        if (add) { SupplierForm.open({}).then(function (s) { if (s) load(view); }); return; }
        const tr = e.target.closest('tr.click');
        if (tr) openOne(view, data.suppliers.filter(function (x) { return x.vendor_id === tr.getAttribute('data-vid'); })[0]);
      });
      pg.addEventListener('keydown', function (e) { const tr = e.target.closest('tr.click'); if (tr && e.key === 'Enter') tr.click(); });
      $('#s-q', pg).addEventListener('input', debounce(function () { f.q = $('#s-q', pg).value.trim(); if (data) draw(view); }, 120));
      $('#s-ftype', pg).onchange = function () { f.type = this.value; if (data) draw(view); };
      $('#s-fgroup', pg).onchange = function () { f.group = this.value; if (data) draw(view); };
      $('#s-finactive', pg).onchange = function () { f.inactive = this.checked; if (data) draw(view); };
      load(view);
    }
  };
})();
