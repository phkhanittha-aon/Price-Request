  File: PageHome.html
  Homepage = "what do I have to do today", per role. Three numbers (รอฉัน · กำลังดำเนินการ · เกินกำหนด),
  the task list sorted by urgency, and 1–3 shortcuts. Statistics moved to รายงาน (managers only).
  Uses the same listTicketBoard data as the list page (server-cached), so it adds no extra sheet reads.
-->
<script>
Pages.home = (function () {
  let lastRows = null, lastUser = '';   // last board, only ever shown to the same user

  function scoped(rows) {
    // Sales and SR follow their own work; managers / GM / Admin follow everything they can see
    return state.me.role === 'sales' || state.me.role === 'sr' ? rows.filter(function (r) { return r.is_mine || r.is_inbox; }) : rows;
  }
  const URGENCY = { breach: 0, warning: 1, ok: 2, none: 3, done: 4 };
  function byUrgency(a, b) {
    return (URGENCY[a.sla_status] - URGENCY[b.sla_status]) || ((a.due_date || '9999') < (b.due_date || '9999') ? -1 : 1) || (b.stage_age_hours - a.stage_age_hours);
  }

  function shortcuts(rows) {
    const role = state.me.role;
    const n = function (test) { return rows.filter(test).length; };
    const out = [];
    if (role === 'sales') {
      out.push({ label: '➕ สร้างใบขอราคา', route: { page: 'new' }, primary: true });
      out.push({ label: '📄 ใบขอราคาของฉัน', route: { page: 'tickets', scope: 'mine' } });
      out.push({ label: '🎯 ติดตามการขาย', count: state.poll.deals_due || 0, route: { page: 'deals' } });
    }
    if (role === 'sr') {
      out.push({ label: '🧾 คิวรอรับงาน', count: n(function (r) { return r.stage === 'pending_assign'; }), route: { page: 'tickets', scope: 'queue' }, primary: true });
      out.push({ label: '🏭 Supplier', route: { page: 'suppliers' } });
    }
    if (role === 'sr_manager') {
      out.push({ label: '✅ รอตรวจราคา', count: n(function (r) { return r.stage === 'pending_sr_manager'; }), route: { page: 'tickets', scope: 'inbox', stage: 'pending_sr_manager' }, primary: true });
      out.push({ label: '🧾 งานยังไม่มี SR รับ', count: n(function (r) { return r.stage === 'pending_assign'; }), route: { page: 'tickets', scope: 'queue' } });
      out.push({ label: '🏭 Supplier', route: { page: 'suppliers' } });
    }
    if (role === 'gm') {
      out.push({ label: '🛒 อนุมัติฝั่งขาย', count: n(function (r) { return r.stage === 'pending_gm' && r.is_inbox; }), route: { page: 'tickets', scope: 'inbox', stage: 'pending_gm' }, primary: true });
      out.push({ label: '📦 อนุมัติฝั่งซื้อ', count: n(function (r) { return r.stage === 'pending_gm_price'; }), route: { page: 'tickets', scope: 'inbox', stage: 'pending_gm_price' }, primary: true });
      out.push({ label: '💹 สรุป GP', route: { page: 'gp' } });
    }
    if (role === 'manager') {
      out.push({ label: '✅ รออนุมัติ', count: n(function (r) { return r.stage === 'pending_manager' && r.is_inbox; }), route: { page: 'tickets', scope: 'inbox', stage: 'pending_manager' }, primary: true });
      out.push({ label: '🎯 ติดตามการขาย', count: state.poll.deals_due || 0, route: { page: 'deals' } });
      out.push({ label: '📊 รายงาน', route: { page: 'dashboard' } });
    }
    if (role === 'sr_manager') out.push({ label: '💹 สรุป GP', route: { page: 'gp' } });
    if (role === 'admin') {
      out.push({ label: '🏭 Supplier', route: { page: 'suppliers' } });
      out.push({ label: '📊 รายงาน', route: { page: 'dashboard' } });
    }
    return out;
  }

  function draw(view, rows) {
    const mine = scoped(rows);
    const open = mine.filter(function (r) { return r.outcome === 'open'; });
    const inbox = rows.filter(function (r) { return r.is_inbox && r.outcome === 'open'; }).sort(byUrgency);
    const late = open.filter(function (r) { return r.sla_status === 'breach'; });
    const follow = open.filter(function (r) { return r.is_follow_up; });
    const sc = shortcuts(rows);
    const tile = function (cls, n, label, sub, route) {
      return '<button class="tile ' + cls + '" data-go=\'' + esc(JSON.stringify(route)) + '\'><span class="v">' + fmtInt(n) + '</span><span class="l">' + esc(label) + '</span>' +
        '<span class="p">' + sub + '</span></button>';
    };
    const listScope = state.me.role === 'sales' || state.me.role === 'sr' ? 'mine' : 'all';
    let html = '<div class="home"><div class="page-head"><div><h1>สวัสดี ' + esc(state.me.full_name) + '</h1>' +
      '<div class="small muted">' + esc(new Intl.DateTimeFormat('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Bangkok' }).format(new Date())) +
      ' · ' + esc(state.me.role_label) + '</div></div></div>';
    html += '<div class="tiles home-tiles">' +
      tile('t-me', inbox.length, 'รอฉัน', inbox.length ? 'งานที่คุณต้องทำตอนนี้' : 'ไม่มีงานค้างที่คุณ 🎉', { page: 'tickets', scope: 'inbox' }) +
      tile('t-open', open.length, 'กำลังดำเนินการ', listScope === 'mine' ? 'ใบของคุณที่ยังไม่จบ' : 'ทุกใบที่ยังไม่จบ', { page: 'tickets', scope: listScope === 'mine' ? 'mine' : 'all', outcome: 'open' }) +
      tile('t-late' + (late.length ? ' bad' : ''), late.length, 'เกินกำหนด (SLA)', late.length ? 'ค้างในขั้นตอนนานเกินกำหนด' : 'ไม่มีงานเกินกำหนด', { page: 'tickets', scope: listScope === 'mine' ? 'mine' : 'all', sla: 'breach' }) +
      '</div>';
    if (sc.length) {
      html += '<div class="quick">' + sc.map(function (x) {
        return '<button class="btn' + (x.primary ? ' primary' : '') + '" data-go=\'' + esc(JSON.stringify(x.route)) + '\'>' + esc(x.label) +
          (x.count != null ? ' <span class="qn">' + fmtInt(x.count) + '</span>' : '') + '</button>';
      }).join('') + '</div>';
    }
    html += '<div class="card"><div class="card-head"><h3>งานที่ต้องทำ</h3>' + (inbox.length > 10 ? '<button class="btn sm ghost" data-go=\'' + esc(JSON.stringify({ page: 'tickets', scope: 'inbox' })) + '\'>ดูทั้งหมด ' + inbox.length + ' ใบ ›</button>' : '') + '</div>' +
      (inbox.length ? '<ul class="tasks">' + inbox.slice(0, 10).map(function (r) {
        return '<li><a href="#" data-ticket="' + esc(r.ticket_id) + '"><span class="tdot ' + esc(r.sla_status) + '" aria-hidden="true"></span><div class="tmain"><b>' + esc(r.ticket_no) + '</b> ' +
          (r.priority !== 'normal' ? prioText(r.priority) + ' ' : '') + (r.is_follow_up ? '<span class="badge tag-follow">📌 ส่งตามหลัง</span> ' : '') +
          '<span class="small">' + esc(r.stage_label) + '</span><div class="small muted">' + esc(r.customer_name || r.title) + ' · ' + esc(r.item_names).slice(0, 80) + '</div></div>' +
          '<div class="tside small">' + slaBadge(r.sla_status) + (r.due_date ? '<div class="muted">ต้องการ ' + esc(fmtDate(r.due_date)) + '</div>' : '') + '</div></a></li>';
      }).join('') + '</ul>' : '<p class="empty small">ไม่มีงานรอคุณตอนนี้</p>') + '</div>';
    if (follow.length) {
      html += '<div class="card"><div class="card-head"><h3>📌 รายการส่งตามหลังที่ยังค้าง</h3><button class="btn sm ghost" data-go=\'' + esc(JSON.stringify({ page: 'tickets', scope: 'follow' })) + '\'>ดูทั้งหมด ›</button></div>' +
        '<ul class="tasks">' + follow.slice(0, 5).map(function (r) {
          return '<li><a href="#" data-ticket="' + esc(r.ticket_id) + '"><span class="tdot ' + esc(r.sla_status) + '" aria-hidden="true"></span><div class="tmain"><b>' + esc(r.ticket_no) + '</b> <span class="small muted">จาก ' + esc(r.parent_ticket_no) + '</span>' +
            '<div class="small muted">' + esc(r.item_names) + ' · ' + esc(r.stage_label) + '</div></div><div class="tside small muted">ค้าง ' + r.age_days + ' วัน</div></a></li>';
        }).join('') + '</ul></div>';
    }
    if (state.me.role === 'admin') html += '<div class="card" id="admin-health"><h3>สถานะระบบ</h3>' + loadingHtml() + '</div>';
    html += '</div>';
    view.innerHTML = html;
    $all('[data-go]', view).forEach(function (b) { b.onclick = function () { go(JSON.parse(b.getAttribute('data-go'))); }; });
    $all('[data-ticket]', view).forEach(function (a) { a.onclick = function (e) { e.preventDefault(); go({ page: 'ticket', id: a.getAttribute('data-ticket') }); }; });
    if (state.me.role === 'admin') {
      api('getAdminHealth').then(function (h) {
        const box = $('#admin-health', view);
        if (!box) return;
        const line = function (bad, text) { return '<li class="' + (bad ? 'bad' : 'ok') + '">' + (bad ? '⚠ ' : '✓ ') + text + '</li>'; };
        box.innerHTML = '<h3>สถานะระบบ (24 ชม.)</h3><ul class="health">' +
          line(!h.lark_configured, h.lark_configured ? 'เชื่อมต่อ Lark แล้ว' : 'ยังไม่ได้ตั้งค่า Lark (LARK_APP_ID / SECRET)') +
          line(h.lark_failed > 0, 'แจ้งเตือน Lark ส่งไม่สำเร็จ ' + h.lark_failed + ' รายการ') +
          line(h.lark_no_user > 0, 'ผู้ใช้ที่ไม่พบบัญชี Lark ' + h.lark_no_user + ' รายการ') +
          line(h.lark_no_group > 0, 'ข้อความกลุ่มที่ยังไม่ได้ตั้งกลุ่ม ' + h.lark_no_group + ' รายการ') +
          '</ul><p class="small muted">ตรวจละเอียด: เปิด Apps Script แล้ว Run <code>runSelfTest</code></p>';
      }).catch(function (e) { const box = $('#admin-health', view); if (box) box.innerHTML = '<h3>สถานะระบบ</h3>' + errorHtml(e); });
    }
  }

  return {
    render: function (view, route, isCurrent) {
      if (lastRows && lastUser === state.me.email) draw(view, lastRows);
      else view.innerHTML = loadingHtml();
      const who = state.me.email;
      api('listTicketBoard').then(function (d) {
        lastRows = d.rows; lastUser = who;
        if (isCurrent()) draw(view, d.rows);
      }).catch(function (e) { if (isCurrent() && lastUser !== state.me.email) view.innerHTML = errorHtml(e, 'App.reload()'); });
    }
  };
})();
</script>

  <!-- ===== PageDashboard.html ===== -->
<!--
  File: PageDashboard.html
  Simple dashboard: how many requests were quoted (done), are still open, or were rejected;
  list of statuses; per-person table. Every number is clickable → the matching ticket list.
  Scope (server-side): Sales = own requests · SR = own jobs · Sales Manager, SR Manager, GM, Admin = everyone.
-->
<script>
Pages.dashboard = (function () {
  let range = { key: 'all', from: '', to: '' };
  const PRESETS = [['all', 'ทั้งหมด'], ['30', '30 วัน'], ['90', '90 วัน'], ['year', 'ปีนี้']];
  const OUT = {
    done: { icon: '✓', label: 'เสนอราคาจบแล้ว', cls: 'out-done' },
    open: { icon: '⏳', label: 'ยังไม่จบ', cls: 'out-open' },
    rejected: { icon: '✕', label: 'ไม่อนุมัติ / ยกเลิก', cls: 'out-rej' }
  };

  function presetRange(key) {
    if (key === 'all') return { key: key, from: '', to: '' };
    if (key === 'year') return { key: key, from: todayYmd(0).slice(0, 4) + '-01-01', to: todayYmd(0) };
    return { key: key, from: todayYmd(-(Number(key) - 1)), to: todayYmd(0) };
  }

  function tile(kind, n, pct, extra) {
    const o = OUT[kind];
    return '<button class="tile ' + o.cls + '" data-outcome="' + kind + '"><span class="ic" aria-hidden="true">' + o.icon + '</span>' +
      '<span class="v">' + fmtInt(n) + '</span><span class="l">' + esc(o.label) + '</span>' +
      '<span class="p">' + pct + '% ของทั้งหมด' + (extra || '') + '</span></button>';
  }

  function splitBar(done, open, rej, total) {
    if (!total) return '<div class="split empty-bar"></div>';
    const seg = function (n, cls, label) {
      return n ? '<div class="' + cls + '" style="width:' + (n / total * 100) + '%" data-tip="' + esc(label + ': ' + n + ' ใบ') + '"></div>' : '';
    };
    return '<div class="split">' + seg(done, 'out-done', OUT.done.label) + seg(open, 'out-open', OUT.open.label) + seg(rej, 'out-rej', OUT.rejected.label) + '</div>';
  }

  function peopleTable(title, rows, key, isSr) {
    if (!rows.length) return '';
    return '<div class="card"><h3>' + esc(title) + '</h3><div class="tbl-wrap"><table class="tbl stack people"><thead><tr>' +
      '<th>' + (isSr ? 'SR' : 'Sales') + '</th><th class="num">ทั้งหมด</th><th class="num">✓ จบแล้ว</th><th class="num">⏳ ยังไม่จบ</th><th class="num">✕ ไม่อนุมัติ</th><th style="min-width:140px">สัดส่วน</th></tr></thead><tbody>' +
      rows.map(function (r) {
        const q = function (outcome) { return ' data-' + key + '="' + esc(r.email) + '"' + (outcome ? ' data-o="' + outcome + '"' : ''); };
        return '<tr><td class="main"><a href="#"' + q('') + '>' + esc(r.name) + '</a></td>' +
          '<td class="num" data-label="ทั้งหมด"><a href="#"' + q('') + '>' + r.total + '</a></td>' +
          '<td class="num" data-label="✓ จบแล้ว"><a href="#"' + q('done') + '>' + r.done + '</a></td>' +
          '<td class="num" data-label="⏳ ยังไม่จบ"><a href="#"' + q('open') + '>' + r.open + '</a></td>' +
          '<td class="num" data-label="✕ ไม่อนุมัติ"><a href="#"' + q('rejected') + '>' + r.rejected + '</a></td>' +
          '<td data-label="สัดส่วน">' + splitBar(r.done, r.open, r.rejected, r.total) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }

  function draw(view, d) {
    const k = d.kpi;
    const listScope = state.me.role === 'sales' || state.me.role === 'sr' ? 'mine' : 'all';
    let html = reportTabs('dashboard') + '<div class="page-head"><h1>ภาพรวมใบขอราคา</h1><div class="actions">' +
      PRESETS.map(function (p) { return '<button class="btn sm' + (range.key === p[0] ? ' primary' : '') + '" data-range="' + p[0] + '">' + p[1] + '</button>'; }).join('') +
      '</div></div><p class="muted small" style="margin-top:-6px">แสดง: <b>' + esc(d.scope_note) + '</b>' +
      (d.range.from ? ' · สร้างระหว่าง ' + esc(fmtDate(d.range.from)) + ' – ' + esc(fmtDate(d.range.to)) : ' · ทุกช่วงเวลา') + ' · แตะตัวเลขเพื่อดูรายการ</p>';

    html += '<div class="tiles"><button class="tile out-all" data-outcome=""><span class="ic" aria-hidden="true">Σ</span><span class="v">' + fmtInt(k.total) +
      '</span><span class="l">ใบขอราคาทั้งหมด</span><span class="p">&nbsp;</span></button>' +
      tile('done', k.done, k.done_pct) +
      tile('open', k.open, k.open_pct, k.breach ? ' · <b class="sla breach">⛔ เกิน SLA ' + k.breach + '</b>' : '') +
      tile('rejected', k.rejected, k.rejected_pct) + '</div>';
    html += '<div class="card">' + splitBar(k.done, k.open, k.rejected, k.total) +
      '<div class="legend" style="margin-top:8px">' + ['done', 'open', 'rejected'].map(function (o) {
        return '<span><i class="' + OUT[o].cls + '"></i>' + OUT[o].icon + ' ' + esc(OUT[o].label) + '</span>';
      }).join('') + '</div></div>';

    if (!k.total) {
      html += '<div class="card empty">ยังไม่มีใบขอราคาในช่วงนี้' +
        (state.me.role === 'sales' ? '<p><button class="btn primary" onclick="App.go({page:\'new\'})">＋ สร้างใบขอราคา</button></p>' : '') + '</div>';
      view.innerHTML = html;
      bind(view, listScope);
      return;
    }

    html += '<div class="grid-2"><div class="card"><h3>สถานะงาน</h3><ul class="status-list">' + d.by_stage.map(function (s) {
      const o = OUT[s.outcome];
      return '<li><a href="#" data-stage="' + esc(s.stage) + '"><span class="dotc ' + o.cls + '" aria-hidden="true"></span>' +
        '<span class="sl">' + esc(s.label) + '</span><span class="badge st-' + esc(s.status) + '">' + esc(state.ref.status_labels[s.status]) + '</span>' +
        '<b class="sc">' + s.count + '</b></a></li>';
    }).join('') + '</ul></div>';

    html += '<div class="card"><h3>อัปเดตล่าสุด</h3><ul class="recent">' + d.recent.map(function (r) {
      return '<li><a href="#" data-ticket="' + esc(r.ticket_id) + '"><div><b>' + esc(r.ticket_no) + '</b> ' + statusBadge(r.status, r.status_label) +
        '<div class="small">' + esc(r.title) + '</div><div class="small muted">' + esc(r.stage_label) + ' · ' + esc(r.requestor_name) +
        (r.sr_name ? ' · SR ' + esc(r.sr_name) : '') + '</div></div><span class="small muted">' + esc(fmtDateTime(r.updated_at)) + '</span></a></li>';
    }).join('') + '</ul></div></div>';

    if (d.follow_ups && d.follow_ups.length) {
      html += '<div class="card follow-card"><h3>📌 รายการส่งตามหลังที่ยังค้าง <span class="badge tag-follow">' + d.follow_ups.length + '</span></h3><ul class="recent">' +
        d.follow_ups.map(function (r) {
          return '<li><a href="#" data-ticket="' + esc(r.ticket_id) + '"><div><b>' + esc(r.ticket_no) + '</b> <span class="small muted">จาก ' + esc(r.parent_ticket_no) + '</span>' +
            '<div class="small">' + esc(r.item_names) + ' · ' + esc(r.customer_name) + '</div><div class="small muted">' + esc(r.stage_label) + ' · ' + esc(r.requestor_name) +
            (r.sr_name ? ' · SR ' + esc(r.sr_name) : '') + '</div></div><span class="small muted">ค้าง ' + r.age_days + ' วัน</span></a></li>';
        }).join('') + '</ul></div>';
    }
    html += peopleTable(d.can_see_everyone ? 'แยกตาม Sales (ทุกคน)' : 'ของฉัน', d.by_sales, 'requestor', false);
    if (d.by_sr.length && state.me.role !== 'sales') html += peopleTable(d.can_see_everyone ? 'แยกตาม SR ผู้หาราคา' : 'งาน SR ของฉัน', d.by_sr, 'sr', true);

    view.innerHTML = html;
    bind(view, listScope);
  }

  function bind(view, listScope) {
    bindReportTabs(view);
    const open = function (extra) { go(Object.assign({ page: 'tickets', scope: listScope }, extra)); };
    $all('[data-range]', view).forEach(function (b) {
      b.onclick = function () { range = presetRange(b.getAttribute('data-range')); Pages.dashboard.render(view, state.route, function () { return true; }); };
    });
    $all('[data-outcome]', view).forEach(function (b) {
      b.onclick = function () { open(b.getAttribute('data-outcome') ? { outcome: b.getAttribute('data-outcome') } : {}); };
    });
    $all('[data-stage]', view).forEach(function (a) { a.onclick = function (e) { e.preventDefault(); open({ stage: a.getAttribute('data-stage') }); }; });
    $all('[data-ticket]', view).forEach(function (a) { a.onclick = function (e) { e.preventDefault(); go({ page: 'ticket', id: a.getAttribute('data-ticket') }); }; });
    $all('[data-requestor]', view).forEach(function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        const x = { requestor: a.getAttribute('data-requestor') };
        if (a.getAttribute('data-o')) x.outcome = a.getAttribute('data-o');
        open(x);
      };
    });
    $all('[data-sr]', view).forEach(function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        const x = { sr: a.getAttribute('data-sr') };
        if (a.getAttribute('data-o')) x.outcome = a.getAttribute('data-o');
        open(x);
      };
    });
  }

  return {
    render: function (view, route, isCurrent) {
      // statistics are for managers; everyone else works from the homepage
      if (['manager', 'sr_manager', 'gm', 'admin'].indexOf(state.me.role) === -1) { go({ page: 'home' }, true); return; }
      view.innerHTML = loadingHtml('กำลังสรุปรายงาน...');
      api('getDashboard', { from: range.from, to: range.to }).then(function (d) {
        if (isCurrent()) draw(view, d);
      }).catch(function (e) { if (isCurrent()) view.innerHTML = errorHtml(e, 'App.reload()'); });
    }
  };
})();
</script>

  <!-- ===== PageDeals.html ===== -->
<!--
  File: PageDeals.html
  ติดตามการขาย (New Item follow-up) — same structure as the MGS Sales app (Mech), inside this web app:
    • KPI boxes that filter: งานที่เปิดอยู่ · ต้องอัปเดต · รอลูกค้าตัดสินใจ (฿/เดือน) · ปิดการขายได้ · ไม่ได้งาน
    • job cards: product the customer is interested in, volume / month, expected vs quoted price,
      status + customer stage, last update, next follow-up date, actions
    • 📝 อัปเดตความคืบหน้า: ผลการขาย · สถานะกับลูกค้า · สิ่งที่คุย · ขั้นตอนถัดไป · วันนัดติดตาม
    • ทีมขาย (Sales Manager / GM / Admin / SR Manager): one card per Sales → open that person's jobs
  An open deal "needs an update" when the follow-up date has come or nobody updated it for deal_follow_days (7).
  No cost data here (the server never sends it) — GP is on PageGp for GM / SR Manager / Admin.
-->
<script>
Pages.deals = (function () {
  let data = null, user = '';
  const f = { filter: 'open', q: '', sales: '', sr: '', group: '', view: 'jobs', dueOnly: false };
  const ST = {
    '': { cls: 'grey', label: 'รอติดตาม' }, follow: { cls: 'blue', label: 'กำลังติดตาม' }, sample: { cls: 'purple', label: 'ส่งตัวอย่าง / ทดลองสินค้า' },
    won: { cls: 'green', label: 'ปิดการขายได้ 🎉' }, lost: { cls: 'red', label: 'ไม่ได้งาน' }
  };
  const FILTERS = [['open', 'งานที่เปิดอยู่'], ['update', 'ต้องอัปเดต'], ['won', 'ปิดการขายได้'], ['lost', 'ไม่ได้งาน'], ['all', 'ทั้งหมด']];

  /** Avatar letter: skip the Thai title “คุณ” so every card does not show ค */
  const initial = function (name) { return String(name || '?').replace(/^คุณ\s*/, '').charAt(0) || '?'; };
  const agoTH = function (d) { return d == null ? '—' : d <= 0 ? 'วันนี้' : d === 1 ? 'เมื่อวาน' : d + ' วันที่แล้ว'; };
  const baht0 = function (v) { return '฿' + fmtInt(Math.round(v || 0)); };
  function inFilter(r, k) {
    if (k === 'open') return r.is_open;
    if (k === 'update') return r.is_due;
    if (k === 'won' || k === 'lost') return r.deal_status === k;
    return true;
  }
  function base() {
    const q = f.q.toLowerCase();
    return data.rows.filter(function (r) {
      if (f.sales && r.requestor_email !== f.sales) return false;
      if (f.sr && r.sr_email !== f.sr) return false;
      if (f.group && r.customer_group !== f.group) return false;
      if (q && (r.ticket_no + ' ' + r.customer_name + ' ' + r.product_name + ' ' + r.size + ' ' + r.requestor_name).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }
  function teamMode() { return data.can_see_everyone; }

  /* ---------- job card ---------- */
  function diffTag(r) {
    if (r.target_diff_pct == null) return '<span class="tag grey">ลูกค้ายังไม่บอกราคา</span>';
    if (r.target_diff_pct > 0) return '<span class="tag red">▲ สูงกว่าที่ลูกค้าคาด ' + fmtNum(r.target_diff_pct) + '%</span>';
    return '<span class="tag green">✓ ' + (r.target_diff_pct < 0 ? 'ต่ำกว่าที่ลูกค้าคาด ' + fmtNum(-r.target_diff_pct) + '%' : 'เท่าที่ลูกค้าคาด') + '</span>';
  }
  function jobCard(r) {
    const st = ST[r.deal_status] || ST[''];
    const late = r.deal_next_date && r.deal_next_date < todayYmd(0) && r.is_open;
    const acts = [];
    if (r.can_edit && r.is_open) acts.push('<button class="btn sm' + (r.is_due ? ' danger-solid' : '') + '" data-upd="' + esc(r.item_id) + '">📝 อัปเดตความคืบหน้า</button>');
    else if (r.can_edit) acts.push('<button class="btn sm ghost" data-upd="' + esc(r.item_id) + '">✏️ แก้ผลการขาย</button>');
    acts.push('<button class="btn sm ghost" data-copy="' + esc(r.item_id) + '">📋 คัดลอกราคา</button>');
    return '<article class="job' + (r.is_due ? ' alert' : '') + '">' +
      '<div class="job-top"><div style="min-width:0"><div class="job-t">' + esc(r.product_name) + '</div>' +
        '<div class="job-c">' + esc(r.customer_name) + (r.customer_group ? ' · ' + esc(r.customer_group) : '') +
          (r.destination_country && r.destination_country !== 'ไทย' ? ' · → ' + esc(r.destination_country) : '') + '</div></div>' +
        '<a href="#" class="job-no" data-ticket="' + esc(r.ticket_id) + '" title="เปิดใบขอราคา">' + esc(r.ticket_no) + ' #' + r.line_no + ' ↗</a></div>' +
      '<div class="job-mid"><span class="tag ' + st.cls + '">' + esc(st.label) + '</span>' +
        (r.deal_stage ? '<span class="tag outline">' + esc(r.deal_stage) + '</span>' : '') +
        (r.is_due ? '<span class="tag red">⏰ ต้องอัปเดต</span>' : '') + '</div>' +
      '<div class="job-price"><div><span class="job-val">' + fmtMoney(r.sell_price_thb) + '</span> <span class="hint">บาท/' + esc(r.uom) + '</span>' +
          '<div class="hint">' + fmtNum(r.qty) + ' ' + esc(r.uom) + '/เดือน · ≈ <b class="mono">' + baht0(r.monthly_value_thb) + '</b>/เดือน</div></div>' +
        '<div class="job-exp">' + (r.target_price ? '<div class="hint">ลูกค้าคาดหวัง <b class="mono">' + fmtMoney(r.target_price) + '</b></div>' : '') + diffTag(r) + '</div></div>' +
      '<div class="job-spec hint">' + esc([r.size, r.packing_size, r.net_weight ? 'NW ' + r.net_weight : ''].filter(Boolean).join(' · ')) + '</div>' +
      (r.deal_note || r.deal_reason ? '<div class="job-note">' + (r.deal_reason ? '<b>เหตุผล:</b> ' + esc(r.deal_reason) + (r.deal_note ? ' — ' : '') : '') + esc(r.deal_note) + '</div>' : '') +
      '<div class="job-meta">' +
        (teamMode() ? '<span>👤 ' + esc(r.requestor_name) + '</span>' + (r.sr_name ? '<span>🏭 SR ' + esc(r.sr_name) + '</span>' : '') : '') +
        '<span>💰 ได้ราคา ' + esc(fmtDate(r.quoted_ymd)) + '</span>' +
        (r.deal_updated_at ? '<span>📝 อัปเดต ' + esc(agoTH(r.days_since_update)) + (r.deal_updated_by ? ' · ' + esc(r.deal_updated_by) : '') + '</span>' : '<span>📝 ยังไม่เคยอัปเดต</span>') +
        (r.deal_next_step && r.is_open ? '<span>➡ ' + esc(r.deal_next_step) + '</span>' : '') +
        (r.deal_next_date && r.is_open ? '<span class="' + (late || r.is_due ? 'late' : '') + '">📅 นัด ' + esc(fmtDate(r.deal_next_date)) + '</span>' : '') +
        (!r.is_open && r.deal_closed_at ? '<span>🏁 ' + esc(fmtDate(r.deal_closed_at)) + '</span>' : '') +
      '</div><div class="job-acts">' + acts.join('') + '</div></article>';
  }

  /* ---------- team cards ---------- */
  function teamHtml(rows) {
    const people = {};
    (data.people || []).forEach(function (p) { people[p.email] = { email: p.email, name: p.full_name, rows: [] }; });
    rows.forEach(function (r) { (people[r.requestor_email] = people[r.requestor_email] || { email: r.requestor_email, name: r.requestor_name, rows: [] }).rows.push(r); });
    const list = Object.keys(people).map(function (k) {
      const p = people[k], rs = p.rows;
      const open = rs.filter(function (r) { return r.is_open; });
      return { email: p.email, name: p.name, open: open.length, upd: rs.filter(function (r) { return r.is_due; }).length,
        won: rs.filter(function (r) { return r.deal_status === 'won'; }).length, lost: rs.filter(function (r) { return r.deal_status === 'lost'; }).length,
        pipe: open.reduce(function (s, r) { return s + r.monthly_value_thb; }, 0) };
    }).sort(function (a, b) { return b.upd - a.upd || b.open - a.open; });
    if (!list.length) return '<div class="empty"><div class="big">👥</div>ยังไม่มี Sales ในระบบ</div>';
    return '<div class="team">' + list.map(function (p) {
      return '<button type="button" class="tcard" data-person="' + esc(p.email) + '"><div class="row-i"><span class="avatar">' + esc(initial(p.name)) + '</span>' +
        '<span class="tn"><b>' + esc(p.name) + '</b><span class="hint">' + esc(p.email) + '</span></span>' + (p.upd ? '<span class="tag red">ค้างอัปเดต ' + p.upd + '</span>' : '') + '</div>' +
        '<div class="tstats"><div><b>' + p.open + '</b><span>งานเปิด</span></div><div><b>' + p.upd + '</b><span>ต้องอัปเดต</span></div><div><b>' + p.won + '</b><span>ปิดได้</span></div><div><b>' + p.lost + '</b><span>ไม่ได้</span></div></div>' +
        '<div class="hint">รอลูกค้าตัดสินใจ <b class="mono" style="color:var(--text)">' + baht0(p.pipe) + '</b>/เดือน</div></button>';
    }).join('') + '</div>';
  }

  /* ---------- Sourcing view: one card per SR who made the prices (weekly meeting with Sales) ---------- */
  function updatedThisWeek(r) { return !!r.deal_updated_at && r.days_since_update <= 6; }
  function sourcingHtml(rows) {
    const people = {};
    (data.sourcing || []).forEach(function (p) { people[p.email] = { email: p.email, name: p.full_name, rows: [] }; });
    rows.forEach(function (r) { if (!r.sr_email) return; (people[r.sr_email] = people[r.sr_email] || { email: r.sr_email, name: r.sr_name, rows: [] }).rows.push(r); });
    const list = Object.keys(people).map(function (k) {
      const p = people[k], rs = p.rows;
      const won = rs.filter(function (r) { return r.deal_status === 'won'; }).length, lost = rs.filter(function (r) { return r.deal_status === 'lost'; }).length;
      const open = rs.filter(function (r) { return r.is_open; });
      return { email: p.email, name: p.name, total: rs.length, open: open.length, upd: rs.filter(function (r) { return r.is_due; }).length, won: won, lost: lost,
        week: rs.filter(updatedThisWeek).length, rate: rs.length ? Math.round(won / rs.length * 100) : null,
        pipe: open.reduce(function (s, r) { return s + r.monthly_value_thb; }, 0) };
    }).sort(function (a, b) { return b.total - a.total; });
    if (!list.length) return '<div class="empty"><div class="big">🏭</div>ยังไม่มี SR ในระบบ</div>';
    return '<p class="hint" style="margin:-4px 0 10px">แต่ละ SR ใช้ติดตามกับ Sales ใน weekly meeting ว่าราคาที่ตัวเองทำไปแล้ว ลูกค้าตอบอย่างไร · ข้อมูลเดียวกับที่ Sales เห็น (ไม่มีต้นทุน / GP)</p>' +
      '<div class="team">' + list.map(function (p) {
        return '<button type="button" class="tcard" data-srperson="' + esc(p.email) + '"><div class="row-i"><span class="avatar">' + esc(initial(p.name)) + '</span>' +
          '<span class="tn"><b>' + esc(p.name) + '</b><span class="hint">ทำราคาแล้ว ' + p.total + ' รายการ · อัตราปิด ' + (p.rate == null ? '–' : p.rate + '%') + '</span></span>' +
          (p.upd ? '<span class="tag red">Sales ค้างอัปเดต ' + p.upd + '</span>' : '') + '</div>' +
          '<div class="tstats"><div><b>' + p.open + '</b><span>รอลูกค้า</span></div><div><b>' + p.week + '</b><span>อัปเดตสัปดาห์นี้</span></div><div><b>' + p.won + '</b><span>ปิดได้</span></div><div><b>' + p.lost + '</b><span>ไม่ได้</span></div></div>' +
          '<div class="hint">รอลูกค้าตัดสินใจ <b class="mono" style="color:var(--text)">' + baht0(p.pipe) + '</b>/เดือน</div></button>';
      }).join('') + '</div>';
  }

  /** Text for the weekly meeting: the SR's prices grouped by Sales — status, last update, next step (no cost / GP). */
  function weeklyText(rows) {
    const srName = f.sr ? ((data.sourcing || []).filter(function (p) { return p.email === f.sr; })[0] || {}).full_name || (rows[0] || {}).sr_name || f.sr : 'ทุก SR';
    const keep = rows.filter(function (r) { return r.is_open || (r.deal_closed_at && (Date.now() - new Date(r.deal_closed_at).getTime()) < 8 * 86400000); });
    const bySales = {};
    keep.forEach(function (r) { (bySales[r.requestor_name] = bySales[r.requestor_name] || []).push(r); });
    const n = function (k) { return keep.filter(function (r) { return k(r); }).length; };
    const lines = ['📋 ติดตามงานขาย — SR ' + srName + ' · ' + fmtDate(todayYmd(0)),
      'เปิดอยู่ ' + n(function (r) { return r.is_open; }) + ' · ต้องอัปเดต ' + n(function (r) { return r.is_due; }) + ' · ปิดได้สัปดาห์นี้ ' + n(function (r) { return r.deal_status === 'won'; }) +
        ' · ไม่ได้งานสัปดาห์นี้ ' + n(function (r) { return r.deal_status === 'lost'; }), ''];
    Object.keys(bySales).sort().forEach(function (s) {
      lines.push('👤 ' + s);
      bySales[s].sort(function (a, b) { return (b.is_due - a.is_due) || (a.quoted_at < b.quoted_at ? -1 : 1); }).forEach(function (r) {
        const st = r.is_open ? PENDING.filter(function (b) { return b[0] === bucketOf(r); })[0][1].replace(/^\S+\s/, '') : (ST[r.deal_status] || ST['']).label.replace(' 🎉', '');
        lines.push((r.is_due ? '  ⏰ ' : '  • ') + r.ticket_no + ' ' + r.product_name + ' — ' + r.customer_name + ' · ' + fmtNum(r.qty) + ' ' + r.uom + '/เดือน · ' +
          fmtMoney(r.sell_price_thb) + ' บาท/' + r.uom + ' · ' + st + (r.deal_stage ? ' (' + r.deal_stage + ')' : '') +
          (r.deal_reason ? ' · เหตุผล: ' + r.deal_reason : '') +
          ' · ' + (r.deal_updated_at ? 'อัปเดต ' + agoTH(r.days_since_update) : 'ยังไม่เคยอัปเดต') +
          (r.is_open && r.deal_next_step ? ' · ถัดไป: ' + r.deal_next_step + (r.deal_next_date ? ' ' + fmtDate(r.deal_next_date) : '') : ''));
      });
      lines.push('');
    });
    if (!keep.length) lines.push('ไม่มีงานที่ต้องติดตาม');
    return lines.join('\n').trim();
  }

  /* ---------- งานค้าง: open lines only, grouped by what they are waiting for ---------- */
  const PENDING = [
    ['new', '🆕 ยังไม่เคยอัปเดต', 'ได้ราคาแล้ว แต่ Sales ยังไม่ได้บอกผลกับลูกค้า'],
    ['sample', '🧪 ตัวอย่างสินค้า', 'รอส่ง / ลูกค้ากำลังทดลองตัวอย่าง'],
    ['price', '💬 เรื่องราคา', 'ลูกค้าเทียบราคา / ต่อรอง / ขอปรับราคาจาก SR'],
    ['customer', '⏳ รอลูกค้าตัดสินใจ', 'เพิ่งส่งราคา / รออนุมัติภายในของลูกค้า / ลูกค้าเลื่อน'],
    ['closing', '🤝 ใกล้ปิด / รอ PO', 'ใกล้ปิดการขาย หรือรอใบสั่งซื้อ'],
    ['other', '📌 กำลังติดตาม', 'ยังไม่ระบุสถานะกับลูกค้า']
  ];
  /** Which pending bucket an open line belongs to (from status, customer stage and next step). */
  function bucketOf(r) {
    const st = r.deal_stage || '', nx = r.deal_next_step || '';
    if (!r.deal_status) return 'new';
    if (r.deal_status === 'sample' || /ตัวอย่าง|ทดลอง/.test(st + ' ' + nx)) return 'sample';
    if (/ราคา/.test(st.replace('เพิ่งส่งราคาให้ลูกค้า', '')) || /ปรับราคา/.test(nx)) return 'price';
    if (/ใกล้ปิด/.test(st) || /PO|ปิดการขาย/.test(nx)) return 'closing';
    if (st) return 'customer';
    return 'other';
  }
  function pendingHtml(rows) {
    const open = rows.filter(function (r) { return r.is_open && (!f.dueOnly || r.is_due); });
    const by = {};
    open.forEach(function (r) { (by[bucketOf(r)] = by[bucketOf(r)] || []).push(r); });
    const allOpen = rows.filter(function (r) { return r.is_open; });
    let html = '<div class="pend-bar"><span class="hint">แสดงเฉพาะรายการที่ยังไม่ปิด (' + allOpen.length + ') แยกตามเรื่องที่ค้าง · เรียงจากที่ไม่ได้อัปเดตนานที่สุด</span>' +
      '<label class="chk-inline"><input type="checkbox" id="dl-dueonly"' + (f.dueOnly ? ' checked' : '') + '> เฉพาะที่ต้องอัปเดต (' + allOpen.filter(function (r) { return r.is_due; }).length + ')</label>' +
      '<div class="pend-chips">' + PENDING.map(function (b) {
        const n = (by[b[0]] || []).length;
        return n ? '<a href="#pend-' + b[0] + '" class="tag outline" data-jump="' + b[0] + '">' + esc(b[1]) + ' <b>' + n + '</b></a>' : '';
      }).join('') + '</div></div>';
    if (!open.length) return html + '<div class="card empty"><div class="big">🎉</div>' + (f.dueOnly ? 'ไม่มีรายการที่ต้องอัปเดต' : 'ไม่มีงานค้าง — ทุกรายการปิดแล้ว') + '</div>';
    html += '<div class="pend-groups">' + PENDING.filter(function (b) { return (by[b[0]] || []).length; }).map(function (b) {
      const list = by[b[0]].sort(function (a, c) { return (c.is_due - a.is_due) || (c.days_since_update - a.days_since_update); });
      return '<section class="card pend" id="pend-' + b[0] + '"><div class="pend-h"><h3>' + esc(b[1]) + ' <span class="tag grey">' + list.length + '</span></h3><span class="hint">' + esc(b[2]) + '</span></div>' +
        '<ul class="pend-list">' + list.map(function (r) {
          const late = r.deal_next_date && r.deal_next_date < todayYmd(0);
          return '<li class="' + (r.is_due ? 'due' : '') + '"><div class="pl-main"><b>' + esc(r.product_name) + '</b> <span class="hint">' + fmtNum(r.qty) + ' ' + esc(r.uom) + '/เดือน · ' +
              fmtMoney(r.sell_price_thb) + ' บาท/' + esc(r.uom) + '</span>' +
            '<div class="hint">' + esc(r.customer_name) + (teamMode() ? ' · 👤 ' + esc(r.requestor_name) + (r.sr_name ? ' · 🏭 ' + esc(r.sr_name) : '') : '') +
              ' · <a href="#" data-ticket="' + esc(r.ticket_id) + '">' + esc(r.ticket_no) + '</a></div>' +
            ((r.deal_stage || r.deal_next_step || r.deal_note) ? '<div class="pl-note">' + esc([r.deal_stage, r.deal_next_step ? '➡ ' + r.deal_next_step : ''].filter(Boolean).join(' · ')) +
              (r.deal_note ? ' — ' + esc(r.deal_note.length > 90 ? r.deal_note.slice(0, 90) + '…' : r.deal_note) : '') + '</div>' : '') + '</div>' +
            '<div class="pl-side"><span class="' + (r.is_due ? 'tag red' : 'tag grey') + '">' + (r.deal_updated_at ? 'อัปเดต ' + agoTH(r.days_since_update) : 'ได้ราคา ' + agoTH(r.days_since_update)) + '</span>' +
              (r.deal_next_date ? '<span class="hint' + (late ? ' late' : '') + '">📅 ' + esc(fmtDate(r.deal_next_date)) + '</span>' : '') +
              (r.can_edit ? '<button class="btn sm' + (r.is_due ? ' danger-solid' : '') + '" data-upd="' + esc(r.item_id) + '">📝 อัปเดต</button>' : '') + '</div></li>';
        }).join('') + '</ul></section>';
    }).join('') + '</div>';
    return html;
  }

  function draw(view) {
    const all = base();
    const by = function (k) { return all.filter(function (r) { return inFilter(r, k); }); };
    const open = by('open'), won = by('won'), lost = by('lost'), upd = by('update');
    const rows = by(f.filter).sort(function (a, b) { return (b.is_due - a.is_due) || (a.quoted_at < b.quoted_at ? 1 : -1); });
    const who = f.sales ? (data.rows.filter(function (r) { return r.requestor_email === f.sales; })[0] || {}).requestor_name ||
      ((data.people || []).filter(function (p) { return p.email === f.sales; })[0] || {}).full_name : '';
    const groups = data.rows.map(function (r) { return r.customer_group; }).filter(function (g, i, a) { return g && a.indexOf(g) === i; });
    const kpi = function (k, l, v, s, color) {
      return '<button type="button" class="kpi' + (f.filter === k && f.view === 'jobs' ? ' on' : '') + '" data-filter="' + k + '"><span class="l">' + l + '</span>' +
        '<span class="v"' + (color ? ' style="color:var(--' + color + ')"' : '') + '>' + v + '</span><span class="s">' + s + '</span></button>';
    };
    const srWho = f.sr ? ((data.sourcing || []).filter(function (p) { return p.email === f.sr; })[0] || {}).full_name || (data.rows.filter(function (r) { return r.sr_email === f.sr; })[0] || {}).sr_name || f.sr : '';
    let html = (state.me.role === 'sr' ? '' : reportTabs('deals')) +
      '<div class="person"><span class="avatar lg">' + esc(initial(srWho || who || state.me.full_name)) + '</span><div style="flex:1;min-width:200px"><h1>' +
        (f.sr ? 'ราคาที่ ' + (f.sr === state.me.email ? 'ฉัน' : esc(srWho)) + ' ทำ — ติดตามกับ Sales' + (f.sales ? ' · ' + esc(who) : '') : f.sales ? 'งานของ ' + esc(who) :
          f.view === 'sourcing' ? 'ติดตามการขาย — แยกตาม Sourcing' : teamMode() ? 'ติดตามการขาย — ทีมขาย' : 'ติดตามการขายของฉัน') + '</h1>' +
        '<div class="hint">ทุกรายการที่ GM อนุมัติราคาแล้ว · อัปเดตความคืบหน้ากับลูกค้าอย่างน้อยทุก ' + data.follow_days + ' วัน</div></div>' +
        '<div class="seg" role="tablist"><button type="button" class="' + (f.view === 'jobs' ? 'on' : '') + '" data-view="jobs">📋 รายการ</button>' +
          '<button type="button" class="' + (f.view === 'pending' ? 'on' : '') + '" data-view="pending">⏳ งานค้าง</button>' +
          (teamMode() ? '<button type="button" class="' + (f.view === 'team' ? 'on' : '') + '" data-view="team">👥 ทีมขาย</button>' +
            ((data.sourcing || []).length ? '<button type="button" class="' + (f.view === 'sourcing' ? 'on' : '') + '" data-view="sourcing">🏭 Sourcing</button>' : '') : '') + '</div>' +
        (f.sr && (f.view === 'jobs' || f.view === 'pending') ? '<button class="btn sm" data-weekly>📋 สรุปสำหรับประชุมประจำสัปดาห์</button>' : '') +
        (f.sales || f.sr ? '<button class="btn sm ghost" data-clear-person>✕ ดูทุกคน</button>' : '') + '</div>';
    html += '<div class="kpis5">' +
      kpi('open', 'งานที่เปิดอยู่', fmtInt(open.length), 'รอลูกค้าตัดสินใจ ' + baht0(open.reduce(function (s, r) { return s + r.monthly_value_thb; }, 0)) + '/เดือน') +
      kpi('update', 'ต้องอัปเดต', fmtInt(upd.length), 'ถึงวันนัด / เกิน ' + data.follow_days + ' วัน', upd.length ? 'danger' : '') +
      kpi('won', 'ปิดการขายได้', fmtInt(won.length), baht0(won.reduce(function (s, r) { return s + r.monthly_value_thb; }, 0)) + '/เดือน', 'ok') +
      kpi('lost', 'ไม่ได้งาน', fmtInt(lost.length), 'ดูเหตุผลเพื่อปรับราคา / สินค้า') +
      kpi('all', 'อัตราปิดการขาย', all.length ? Math.round(won.length / all.length * 100) + '%' : '–', (won.length + lost.length ? 'ชนะ ' + Math.round(won.length / (won.length + lost.length) * 100) + '% ของที่ตัดสินแล้ว · ' : '') + all.length + ' รายการ') +
      '</div>';
    if (f.view === 'team' && teamMode()) {
      html += teamHtml(all);
    } else if (f.view === 'sourcing' && teamMode()) {
      html += sourcingHtml(all);
    } else if (f.view === 'pending') {
      html += pendingHtml(all);
    } else {
      html += '<div class="toolbar"><input type="search" class="search" id="dl-q" placeholder="🔍 ค้นหา ลูกค้า / สินค้า / เลขที่ใบ" value="' + esc(f.q) + '">' +
        '<select id="dl-filter">' + FILTERS.map(function (x) { return '<option value="' + x[0] + '"' + (f.filter === x[0] ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') + '</select>' +
        (groups.length > 1 ? '<select id="dl-group"><option value="">ทุกกลุ่มลูกค้า</option>' + groups.map(function (g) { return '<option' + (f.group === g ? ' selected' : '') + '>' + esc(g) + '</option>'; }).join('') + '</select>' : '') +
        '<span class="hint">' + rows.length + ' รายการ</span></div>';
      html += rows.length ? '<div class="jobs">' + rows.map(jobCard).join('') + '</div>' :
        '<div class="card empty"><div class="big">📭</div>' + (data.rows.length ? 'ไม่มีงานในหมวดนี้' : 'ยังไม่มีรายการที่ได้ราคาจาก GM — เมื่อราคาส่งถึง Sales แล้ว รายการจะมาอยู่ที่นี่') + '</div>';
    }
    view.innerHTML = html;
    bind(view);
  }

  function bind(view) {
    bindReportTabs(view);
    $all('[data-filter]', view).forEach(function (b) { b.onclick = function () { f.filter = b.getAttribute('data-filter'); f.view = 'jobs'; draw(view); }; });
    $all('[data-view]', view).forEach(function (b) { b.onclick = function () { f.view = b.getAttribute('data-view'); draw(view); }; });
    if ($('#dl-dueonly', view)) $('#dl-dueonly', view).onchange = function (e) { f.dueOnly = e.target.checked; draw(view); };
    $all('[data-jump]', view).forEach(function (a) {
      a.onclick = function (e) { e.preventDefault(); const t = $('#pend-' + a.getAttribute('data-jump'), view); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    });
    $all('[data-person]', view).forEach(function (b) { b.onclick = function () { f.sales = b.getAttribute('data-person'); f.view = 'jobs'; f.filter = 'open'; draw(view); }; });
    $all('[data-clear-person]', view).forEach(function (b) { b.onclick = function () { f.sales = ''; f.sr = ''; draw(view); }; });
    $all('[data-srperson]', view).forEach(function (b) { b.onclick = function () { f.sr = b.getAttribute('data-srperson'); f.view = 'jobs'; f.filter = 'open'; draw(view); }; });
    $all('[data-weekly]', view).forEach(function (b) { b.onclick = function () { copyText(weeklyText(base()), 'คัดลอกสรุปแล้ว — วางในแชท / เอกสารประชุมได้เลย'); }; });
    const q = $('#dl-q', view);
    if (q) q.oninput = debounce(function () {
      f.q = q.value.trim(); draw(view);
      const n = $('#dl-q', view); n.focus(); n.setSelectionRange(n.value.length, n.value.length);
    }, 250);
    if ($('#dl-filter', view)) $('#dl-filter', view).onchange = function (e) { f.filter = e.target.value; draw(view); };
    if ($('#dl-group', view)) $('#dl-group', view).onchange = function (e) { f.group = e.target.value; draw(view); };
    $all('[data-ticket]', view).forEach(function (a) { a.onclick = function (e) { e.preventDefault(); go({ page: 'ticket', id: a.getAttribute('data-ticket') }); }; });
    $all('[data-upd]', view).forEach(function (b) { b.onclick = function () { edit(view, rowOf(b.getAttribute('data-upd'))); }; });
    $all('[data-copy]', view).forEach(function (b) { b.onclick = function () { copyOffer(rowOf(b.getAttribute('data-copy'))); }; });
  }
  function rowOf(id) { return data.rows.filter(function (r) { return r.item_id === id; })[0]; }

  /** Price text for the customer (selling price + offer terms only — never cost). */
  function copyOffer(r) {
    const o = r.offer || {};
    const txt = ['ใบเสนอราคา ' + r.ticket_no + ' — ' + r.customer_name, '',
      r.product_name + ([r.size, r.packing_size].filter(Boolean).length ? ' (' + [r.size, r.packing_size].filter(Boolean).join(' · ') + ')' : ''),
      'ราคา ' + fmtMoney(r.sell_price_thb) + ' บาท/' + r.uom,
      [o.brand ? 'แบรนด์ ' + o.brand : '', o.origin_country ? 'ประเทศต้นทาง ' + o.origin_country : '', o.packing ? 'Packing ' + o.packing : '',
        o.shelf_life ? 'อายุสินค้า ' + o.shelf_life : ''].filter(Boolean).join(' · '),
      [o.moq != null ? 'MOQ ' + fmtNum(o.moq) + ' ' + r.uom : '', o.lead_time_days != null ? 'ส่งของภายใน ' + o.lead_time_days + ' วัน' : '',
        o.valid_until ? 'ยืนราคาถึง ' + fmtDate(o.valid_until) : ''].filter(Boolean).join(' · ')].filter(function (x, i) { return i < 2 || x; }).join('\n');
    copyText(txt, 'คัดลอกราคาแล้ว — วางในแชทลูกค้าได้เลย');
  }
  function copyText(txt, msg) {
    const done = function () { toast(msg, 'ok'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { fallback(txt, done); });
    else fallback(txt, done);
  }
  function fallback(t, done) {
    const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); done(); } catch (e) { window.prompt('คัดลอกข้อความนี้', t); }
    a.remove();
  }

  /** 📝 อัปเดตความคืบหน้า: ผลการขาย → (เปิดอยู่: สถานะกับลูกค้า + ขั้นตอนถัดไป + วันนัด) / (ไม่ได้งาน: เหตุผล) + สิ่งที่คุย */
  function edit(view, r) {
    const cur = r.deal_status || 'follow';
    const opt = function (list, v) { return list.map(function (x) { return '<option' + (v === x ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join(''); };
    const html = '<div class="hint" style="margin:-4px 0 12px">' + esc(r.ticket_no) + ' · ' + esc(r.customer_name) + ' · ' + fmtNum(r.qty) + ' ' + esc(r.uom) + '/เดือน · เสนอ ' +
        fmtMoney(r.sell_price_thb) + ' บาท/' + esc(r.uom) + (r.deal_updated_at ? ' · อัปเดตล่าสุด ' + esc(agoTH(r.days_since_update)) : '') + '</div>' +
      '<div class="flbl">ผลการขาย</div><div class="deal-st" role="radiogroup" aria-label="ผลการขาย">' + ['follow', 'sample', 'won', 'lost'].map(function (k) {
        return '<label class="dchip-opt d-' + k + '"><input type="radio" name="dst" value="' + k + '"' + (k === cur ? ' checked' : '') + '><span>' + esc(ST[k].label) + '</span></label>';
      }).join('') + '</div>' +
      '<label class="field" data-show="follow sample"><span>สถานะกับลูกค้าตอนนี้</span><select id="d-stage"><option value="">— เลือก —</option>' + opt(data.customer_stages, r.deal_stage) + '</select></label>' +
      '<label class="field" data-show="lost"><span>เหตุผลที่ไม่ได้งาน <span class="req">*</span></span><select id="d-reason"><option value="">— เลือก —</option>' + opt(data.lost_reasons, r.deal_reason) + '</select></label>' +
      '<label class="field"><span>รายละเอียด / สิ่งที่คุยกับลูกค้า</span><textarea id="d-note" maxlength="2000" rows="3" placeholder="เช่น ลูกค้าขอทดลอง 1 ลัง / เทียบอยู่กับอีก 2 เจ้า / คู่แข่งเสนอ …">' + esc(r.deal_note) + '</textarea></label>' +
      '<div class="fgrid two" data-show="follow sample"><label class="field"><span>ขั้นตอนถัดไป</span><select id="d-step"><option value="">— เลือก —</option>' + opt(data.next_steps, r.deal_next_step) + '</select></label>' +
        '<label class="field"><span>วันที่นัดติดตาม</span><input type="date" id="d-next" min="' + todayYmd(0) + '" value="' + esc(r.deal_next_date && r.deal_next_date >= todayYmd(0) ? r.deal_next_date : todayYmd(data.follow_days)) + '"></label></div>';
    const sync = function (root) {
      const st = ($('input[name="dst"]:checked', root) || {}).value;
      $all('[data-show]', root).forEach(function (el) { el.hidden = el.getAttribute('data-show').split(' ').indexOf(st) === -1; });
      if (st === 'sample' && !$('#d-stage', root).value) $('#d-stage', root).value = data.customer_stages.filter(function (x) { return /ตัวอย่าง/.test(x); })[0] || '';
    };
    dialog({
      title: '📝 อัปเดตความคืบหน้า — ' + r.product_name, html: html, confirmText: 'บันทึกการอัปเดต',
      onOpen: function (root) { sync(root); $all('input[name="dst"]', root).forEach(function (x) { x.onchange = function () { sync(root); }; }); },
      validate: function (root) {
        const st = ($('input[name="dst"]:checked', root) || {}).value;
        if (!st) return 'กรุณาเลือกผลการขาย';
        if (st === 'lost' && !$('#d-reason', root).value) return 'กรุณาเลือกเหตุผลที่ไม่ได้งาน';
        if (st === 'lost' && $('#d-reason', root).value === 'อื่นๆ' && !$('#d-note', root).value.trim()) return 'เลือก “อื่นๆ” กรุณาระบุรายละเอียด';
        if ((st === 'follow' || st === 'sample') && $('#d-next', root).value && $('#d-next', root).value < todayYmd(0)) return 'วันนัดต้องไม่เป็นวันที่ผ่านมาแล้ว';
        return null;
      }
    }).then(function (res) {
      if (!res) return;
      const root = res.root;
      const st = $('input[name="dst"]:checked', root).value;
      const open = st === 'follow' || st === 'sample';
      api('updateDeal', r.item_id, { status: st, reason: st === 'lost' ? $('#d-reason', root).value : '', note: $('#d-note', root).value.trim(),
        stage: open ? $('#d-stage', root).value : '', next_step: open ? $('#d-step', root).value : '', next_date: open ? $('#d-next', root).value : '' })
        .then(function (out) {
          data.rows = data.rows.map(function (x) { return x.item_id === r.item_id && out.deal ? out.deal : x; });
          toast(st === 'won' ? '🎉 บันทึกว่าปิดการขายได้ — แจ้ง SR และกลุ่มแล้ว' : 'บันทึกความคืบหน้าแล้ว', 'ok');
          draw(view);
          refreshPoll();
        }).catch(function (e) { toast(e.error, 'err', 8000); });
    });
  }

  return {
    render: function (view, route, isCurrent) {
      if (data && user === state.me.email) draw(view); else view.innerHTML = loadingHtml('กำลังโหลดงานติดตามการขาย...');
      const who = state.me.email;
      api('listDeals').then(function (d) {
        if (!data || user !== who) {
          f.sales = ''; f.q = ''; f.group = '';
          f.sr = d.default_sr || '';      // SR opens on the prices they made
          f.view = 'jobs';
          f.filter = d.rows.some(function (r) { return r.is_due && r.can_edit; }) ? 'update' : 'open';
        }
        data = d; user = who;
        if (isCurrent()) draw(view);
      }).catch(function (e) { if (isCurrent()) view.innerHTML = errorHtml(e, 'App.reload()'); });
    }
  };
})();
</script>

  <!-- ===== PageGp.html ===== -->
<!--
  File: PageGp.html
  สรุป GP & การปิดการขาย (GM / SR Manager / Admin — cost data, never Sales / Sales Manager).
  Every item with a GM-approved selling price = one quoted line: landed cost, GP %, profit per unit,
  volume per month and the deal status Sales recorded (ติดตามการขาย).
    อัตราปิดการขาย = ปิดได้ ÷ รายการที่เสนอ        Win rate = ปิดได้ ÷ (ปิดได้ + ไม่ได้งาน)
    GP % (ถ่วงน้ำหนัก) = Σ(กำไร/หน่วย × ปริมาณ/เดือน) ÷ Σ(ราคาขาย × ปริมาณ/เดือน)
  Data: getGpSummary() once; period / group / Sales filters run in the browser.
-->
<script>
Pages.gp = (function () {
  let data = null, user = '';
  const f = { period: '6', group: '', sales: '' };
  const PERIODS = [['3', '3 เดือน'], ['6', '6 เดือน'], ['12', '12 เดือน'], ['year', 'ปีนี้'], ['all', 'ทั้งหมด']];

  function monthsBack(n) {
    const t = todayYmd(0);
    let y = Number(t.slice(0, 4)), m = Number(t.slice(5, 7));
    const out = [];
    for (let i = 0; i < n; i++) {
      out.unshift(y + '-' + ('0' + m).slice(-2));
      m--; if (!m) { m = 12; y--; }
    }
    return out;
  }
  function months(rows) {
    if (f.period === 'all') {
      const ms = rows.map(function (r) { return r.quoted_month; }).sort();
      if (!ms.length) return monthsBack(6);
      const first = ms[0];
      const all = monthsBack(240);
      return all.slice(all.indexOf(first) === -1 ? 0 : all.indexOf(first));
    }
    if (f.period === 'year') return monthsBack(Number(todayYmd(0).slice(5, 7)));
    return monthsBack(Number(f.period));
  }
  function stats(rows) {
    const s = { n: rows.length, won: 0, lost: 0, open: 0, sell: 0, profit: 0, wonSell: 0, wonProfit: 0, openProfit: 0, lostSell: 0 };
    rows.forEach(function (r) {
      const sell = r.sell_price_thb * r.qty, profit = r.profit_thb * r.qty;
      s.sell += sell; s.profit += profit;
      if (r.deal_status === 'won') { s.won++; s.wonSell += sell; s.wonProfit += profit; }
      else if (r.deal_status === 'lost') { s.lost++; s.lostSell += sell; }
      else { s.open++; s.openProfit += profit; }
    });
    s.close = s.n ? s.won / s.n * 100 : null;
    s.win = s.won + s.lost ? s.won / (s.won + s.lost) * 100 : null;
    s.gp = s.sell ? s.profit / s.sell * 100 : null;
    s.wonGp = s.wonSell ? s.wonProfit / s.wonSell * 100 : null;
    return s;
  }
  const pct = function (v) { return v == null ? '–' : (Math.round(v * 10) / 10).toFixed(1) + '%'; };
  const baht = function (v) { return fmtInt(Math.round(v)); };

  function scoped() {
    const ms = months(data.rows);
    const from = ms[0];
    return {
      months: ms,
      rows: data.rows.filter(function (r) {
        return r.quoted_month >= from && (!f.group || r.customer_group === f.group) && (!f.sales || r.requestor_email === f.sales);
      })
    };
  }

  function trend(ms, rows) {
    const by = {};
    ms.forEach(function (m) { by[m] = []; });
    rows.forEach(function (r) { if (by[r.quoted_month]) by[r.quoted_month].push(r); });
    const st = ms.map(function (m) { return { m: m, s: stats(by[m]) }; });
    const max = Math.max.apply(null, st.map(function (x) { return x.s.n; }).concat([1]));
    const bars = st.map(function (x) {
      const h = function (n) { return (n / max * 100) + '%'; };
      return '<div class="tcol"><div class="tval small">' + (x.s.n ? pct(x.s.close) : '') + '</div><div class="tbar" data-tip="' +
        esc(fmtMonth(x.m) + ' · เสนอ ' + x.s.n + ' · ปิดได้ ' + x.s.won + ' · ไม่ได้ ' + x.s.lost + ' · รอ ' + x.s.open + ' · GP ' + pct(x.s.gp)) + '">' +
        '<i class="b-open" style="height:' + h(x.s.open) + '"></i><i class="b-lost" style="height:' + h(x.s.lost) + '"></i><i class="b-won" style="height:' + h(x.s.won) + '"></i></div>' +
        '<div class="tlab small">' + esc(fmtMonth(x.m)) + '</div><div class="tgp small muted">' + (x.s.n ? 'GP ' + pct(x.s.gp) : '') + '</div></div>';
    }).join('');
    return '<div class="card"><div class="card-head"><h3>แนวโน้มรายเดือน</h3><div class="legend small"><span><i class="b-won"></i>ปิดได้</span><span><i class="b-lost"></i>ไม่ได้งาน</span>' +
      '<span><i class="b-open"></i>ยังไม่จบ</span></div></div><p class="small muted" style="margin-top:-4px">ความสูง = จำนวนรายการที่เสนอราคา · ตัวเลขบน = อัตราปิดการขาย · ล่าง = GP % ที่เสนอ</p>' +
      '<div class="trend" style="--n:' + ms.length + '">' + bars + '</div>' +
      groupTable('รายเดือน', st.slice().reverse().filter(function (x) { return x.s.n; }).map(function (x) { return { label: fmtMonth(x.m), s: x.s }; })) + '</div>';
  }

  function groupTable(title, list) {
    if (!list.length) return '';
    return '<div class="tbl-wrap"><table class="tbl stack gpt"><thead><tr><th>' + esc(title) + '</th><th class="num">เสนอ</th><th class="num">ปิดได้</th><th class="num">ไม่ได้</th>' +
      '<th class="num">ยังไม่จบ</th><th class="num">อัตราปิด</th><th class="num">Win rate</th><th class="num">GP % เสนอ</th><th class="num">GP % ปิดได้</th><th class="num">กำไร/เดือน ที่ปิดได้ (฿)</th></tr></thead><tbody>' +
      list.map(function (x) {
        const s = x.s;
        return '<tr><td class="main">' + esc(x.label) + '</td><td class="num" data-label="เสนอ">' + s.n + '</td><td class="num" data-label="ปิดได้"><b>' + s.won + '</b></td>' +
          '<td class="num" data-label="ไม่ได้">' + s.lost + '</td><td class="num" data-label="ยังไม่จบ">' + s.open + '</td>' +
          '<td class="num" data-label="อัตราปิด">' + pct(s.close) + '</td><td class="num" data-label="Win rate">' + pct(s.win) + '</td>' +
          '<td class="num" data-label="GP % เสนอ">' + pct(s.gp) + '</td><td class="num" data-label="GP % ปิดได้">' + pct(s.wonGp) + '</td>' +
          '<td class="num" data-label="กำไร/เดือน ที่ปิดได้">' + baht(s.wonProfit) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function breakdown(rows, key, labelOf) {
    const by = {};
    rows.forEach(function (r) { const k = r[key] || '–'; (by[k] = by[k] || []).push(r); });
    return Object.keys(by).map(function (k) { return { label: labelOf ? labelOf(by[k][0], k) : k, s: stats(by[k]) }; })
      .sort(function (a, b) { return b.s.n - a.s.n; });
  }

  function lostReasons(rows) {
    const lost = rows.filter(function (r) { return r.deal_status === 'lost'; });
    if (!lost.length) return '';
    const by = {};
    lost.forEach(function (r) { by[r.deal_reason || 'ไม่ระบุ'] = (by[r.deal_reason || 'ไม่ระบุ'] || 0) + 1; });
    const keys = Object.keys(by).sort(function (a, b) { return by[b] - by[a]; });
    return '<div class="card"><h3>เหตุผลที่ไม่ได้งาน (' + lost.length + ' รายการ)</h3><ul class="hbars">' + keys.map(function (k) {
      return '<li><span class="hl">' + esc(k) + '</span><span class="hb"><i style="width:' + (by[k] / lost.length * 100) + '%"></i></span><b>' + by[k] + '</b></li>';
    }).join('') + '</ul></div>';
  }

  function detail(rows) {
    const list = rows.slice(0, 200);
    return '<div class="card"><div class="card-head"><h3>รายการที่เสนอราคา (' + rows.length + ')</h3><button class="btn sm" id="gp-csv">⬇ ดาวน์โหลด CSV</button></div>' +
      '<div class="tbl-wrap"><table class="tbl stack gpd"><thead><tr><th>สินค้า</th><th>ลูกค้า</th><th class="num">ปริมาณ/เดือน</th><th class="num">ต้นทุนถึงคลัง</th>' +
      '<th class="num">ราคาขาย</th><th class="num">GP %</th><th class="num">กำไร/เดือน (฿)</th><th>สถานะการขาย</th></tr></thead><tbody>' +
      list.map(function (r) {
        return '<tr><td class="main"><b>' + esc(r.product_name) + '</b><div class="small muted">' + esc([r.size, r.packing_size].filter(Boolean).join(' · ')) + '</div>' +
          '<div class="small"><a href="#" data-ticket="' + esc(r.ticket_id) + '">' + esc(r.ticket_no) + '</a> · ' + esc(fmtDate(r.quoted_ymd)) + ' · ' + esc(r.vendor_name) + '</div></td>' +
          '<td data-label="ลูกค้า">' + esc(r.customer_name) + '<div class="small muted">' + esc(r.customer_group) + ' · ' + esc(r.requestor_name) + '</div></td>' +
          '<td class="num" data-label="ปริมาณ/เดือน">' + fmtNum(r.qty) + ' <span class="small muted">' + esc(r.uom) + '</span></td>' +
          '<td class="num" data-label="ต้นทุนถึงคลัง">' + fmtMoney(r.landed_cost_thb) + '</td>' +
          '<td class="num" data-label="ราคาขาย"><b>' + fmtMoney(r.sell_price_thb) + '</b>' + (r.target_price ? '<div class="small muted">คาด ' + fmtMoney(r.target_price) + '</div>' : '') + '</td>' +
          '<td class="num" data-label="GP %">' + pct(r.gp_percent) + '</td>' +
          '<td class="num" data-label="กำไร/เดือน">' + baht(r.profit_thb * r.qty) + '</td>' +
          '<td data-label="สถานะการขาย"><span class="dchip d-' + (r.deal_status || 'new') + '">' + esc(r.deal_status_label) + '</span>' +
            (r.deal_reason ? '<div class="small muted">' + esc(r.deal_reason) + '</div>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>' + (rows.length > list.length ? '<p class="small muted">แสดง 200 รายการล่าสุด · ดาวน์โหลด CSV เพื่อดูทั้งหมด</p>' : '') + '</div>';
  }

  function csv(rows) {
    const cols = [['quoted_ymd', 'วันที่ GM อนุมัติราคา'], ['ticket_no', 'เลขที่ใบ'], ['line_no', 'รายการ'], ['customer_name', 'ลูกค้า'], ['customer_group', 'กลุ่มลูกค้า'],
      ['destination_country', 'ปลายทาง'], ['requestor_name', 'Sales'], ['sr_name', 'SR'], ['product_name', 'สินค้า'], ['size', 'Size'], ['packing_size', 'Packing'],
      ['qty', 'ปริมาณ/เดือน'], ['uom', 'หน่วย'], ['target_price', 'ราคาที่ลูกค้าคาดหวัง'], ['vendor_name', 'Supplier'], ['landed_cost_thb', 'ต้นทุนถึงคลัง/หน่วย'],
      ['sell_price_thb', 'ราคาขาย/หน่วย'], ['gp_percent', 'GP %'], ['profit_thb', 'กำไร/หน่วย'], ['monthly_profit', 'กำไร/เดือน'],
      ['deal_status_label', 'สถานะการขาย'], ['deal_reason', 'เหตุผล'], ['deal_note', 'หมายเหตุ']];
    const cell = function (v) { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const lines = [cols.map(function (c) { return cell(c[1]); }).join(',')].concat(rows.map(function (r) {
      const x = Object.assign({ monthly_profit: Math.round(r.profit_thb * r.qty * 100) / 100 }, r);
      return cols.map(function (c) { return cell(x[c[0]]); }).join(',');
    }));
    const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'gp-summary-' + todayYmd(0) + '.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  function draw(view) {
    const sc = scoped();
    const rows = sc.rows;
    const s = stats(rows);
    const sales = data.rows.reduce(function (m, r) { m[r.requestor_email] = r.requestor_name; return m; }, {});
    const groups = data.rows.map(function (r) { return r.customer_group; }).filter(function (g, i, a) { return g && a.indexOf(g) === i; });
    let html = reportTabs('gp') + '<div class="page-head"><div><h1>สรุป GP & การปิดการขาย</h1><div class="small muted">รายการที่ GM อนุมัติราคาแล้ว · ผลการขายจากหน้า “ติดตามการขาย” ของ Sales · ข้อมูลต้นทุน — เห็นเฉพาะ GM / SR Manager / Admin</div></div>' +
      '<div class="actions">' + PERIODS.map(function (p) { return '<button class="btn sm' + (f.period === p[0] ? ' primary' : '') + '" data-period="' + p[0] + '">' + p[1] + '</button>'; }).join('') + '</div></div>';
    html += '<div class="row gp-filters">' +
      (groups.length ? '<select id="gp-group"><option value="">ทุกกลุ่มลูกค้า</option>' + groups.map(function (g) { return '<option' + (f.group === g ? ' selected' : '') + '>' + esc(g) + '</option>'; }).join('') + '</select>' : '') +
      (Object.keys(sales).length ? '<select id="gp-sales"><option value="">Sales ทุกคน</option>' + Object.keys(sales).map(function (e) {
        return '<option value="' + esc(e) + '"' + (f.sales === e ? ' selected' : '') + '>' + esc(sales[e]) + '</option>';
      }).join('') + '</select>' : '') + '<span class="small muted">' + esc(fmtMonth(sc.months[0])) + ' – ' + esc(fmtMonth(sc.months[sc.months.length - 1])) + '</span></div>';
    const kpi = function (v, l, p, cls) { return '<div class="tile kpi ' + (cls || '') + '"><span class="v">' + v + '</span><span class="l">' + l + '</span><span class="p">' + p + '</span></div>'; };
    html += '<div class="tiles gp-kpi">' +
      kpi(fmtInt(s.n), 'รายการที่เสนอราคา', 'มูลค่าขาย ' + baht(s.sell) + ' ฿/เดือน') +
      kpi(pct(s.gp), 'GP % ที่เสนอ', 'กำไรขั้นต้น ' + baht(s.profit) + ' ฿/เดือน (ถ้าปิดได้ทั้งหมด)') +
      kpi(fmtInt(s.won) + ' <small>(' + pct(s.close) + ')</small>', 'ปิดการขายได้', 'Win rate ' + pct(s.win) + ' ของที่ตัดสินแล้ว (' + (s.won + s.lost) + ')', 'k-won') +
      kpi(pct(s.wonGp), 'GP % ของที่ปิดได้', 'กำไรขั้นต้น <b>' + baht(s.wonProfit) + '</b> ฿/เดือน', 'k-won') +
      kpi(fmtInt(s.open), 'รอปิด (Pipeline)', 'กำไรที่รอปิด ' + baht(s.openProfit) + ' ฿/เดือน', 'k-open') +
      '</div>';
    if (!data.rows.length) {
      html += '<div class="card empty">ยังไม่มีรายการที่ GM อนุมัติราคา</div>';
    } else {
      html += trend(sc.months, rows);
      html += '<div class="card"><h3>แยกตามกลุ่มลูกค้า</h3>' + (groupTable('กลุ่มลูกค้า', breakdown(rows, 'customer_group')) || '<p class="small muted">ไม่มีข้อมูลในช่วงนี้</p>') + '</div>' +
        '<div class="card"><h3>แยกตาม Sales</h3>' + (groupTable('Sales', breakdown(rows, 'requestor_email', function (r) { return r.requestor_name; })) || '<p class="small muted">ไม่มีข้อมูลในช่วงนี้</p>') + '</div>';
      html += lostReasons(rows);
      html += rows.length ? detail(rows) : '<div class="card empty">ไม่มีรายการในช่วงที่เลือก</div>';
    }
    view.innerHTML = html;
    bindReportTabs(view);
    $all('[data-period]', view).forEach(function (b) { b.onclick = function () { f.period = b.getAttribute('data-period'); draw(view); }; });
    if ($('#gp-group', view)) $('#gp-group', view).onchange = function (e) { f.group = e.target.value; draw(view); };
    if ($('#gp-sales', view)) $('#gp-sales', view).onchange = function (e) { f.sales = e.target.value; draw(view); };
    if ($('#gp-csv', view)) $('#gp-csv', view).onclick = function () { csv(rows); };
    $all('[data-ticket]', view).forEach(function (a) { a.onclick = function (e) { e.preventDefault(); go({ page: 'ticket', id: a.getAttribute('data-ticket') }); }; });
  }

  return {
    render: function (view, route, isCurrent) {
      if (!state.ref.can_view_gp) { go({ page: 'home' }, true); return; }
      if (data && user === state.me.email) draw(view); else view.innerHTML = loadingHtml('กำลังสรุป GP...');
      const who = state.me.email;
      api('getGpSummary').then(function (d) {
        data = d; user = who;
        if (isCurrent()) draw(view);
      }).catch(function (e) { if (isCurrent()) view.innerHTML = errorHtml(e, 'App.reload()'); });
    }
  };
})();
</script>

  <!-- ===== PageTickets.html ===== -->
<!--
  File: PageTickets.html
  Ticket list = ONE server call (listTicketBoard: every ticket this user may see, no prices) +
  filtering, search, counts and paging in the browser. So tabs and search answer instantly,
  nothing races, and the table never disappears while new data loads.
  Default view = ALL tickets. Status tabs filter with one click; the advanced panel applies on "ใช้ตัวกรอง".
  The filter lives in the URL (?page=tickets&scope=<tab>&q=…&stage=…) so Back / refresh / links keep it.
-->
<script>
Pages.tickets = (function () {
  const PAGE_SIZE = 50;
  const board = { rows: null, at: 0, seq: 0, user: '' };   // last board, kept while the app is open (same user only)

  /* ---------- tabs (one click) ---------- */
  const TABS = [
    { id: 'all', label: 'ทั้งหมด', test: function (r) { return r.stage !== 'deleted'; } },
    { id: 'inbox', label: 'รอฉัน', test: function (r) { return r.is_inbox; } },
    { id: 'mine', label: 'ของฉัน', roles: ['sales', 'sr'], test: function (r) { return r.is_mine; } },
    { id: 'queue', label: 'คิวรอรับงาน', roles: ['sr', 'sr_manager', 'admin'], test: function (r) { return r.stage === 'pending_assign'; } },
    { id: 'req', label: 'รออนุมัติฝั่งขาย', test: function (r) { return ['pending_manager', 'returned', 'pending_gm'].indexOf(r.stage) !== -1; } },
    { id: 'src', label: 'SR กำลังหาราคา', test: function (r) { return ['pending_assign', 'doc_check', 'need_info', 'sourcing'].indexOf(r.stage) !== -1; } },
    { id: 'rev', label: 'รอตรวจราคา', test: function (r) { return ['pending_sr_manager', 'pending_gm_price'].indexOf(r.stage) !== -1; } },
    { id: 'ack', label: 'ส่งถึง Sales', test: function (r) { return r.stage === 'awaiting_sales_ack'; } },
    { id: 'follow', label: '📌 ส่งตามหลัง', test: function (r) { return r.is_follow_up && r.outcome === 'open'; } },
    { id: 'closed', label: 'ปิดงาน', test: function (r) { return r.stage === 'closed'; } },
    { id: 'rejected', label: 'ไม่อนุมัติ / ยกเลิก', test: function (r) { return r.outcome === 'rejected'; } },
    { id: 'deleted', label: '🗑 ถูกลบ', roles: ['admin'], test: function (r) { return r.stage === 'deleted'; } }
  ];
  function tabsFor() {
    return TABS.filter(function (t) { return !t.roles || t.roles.indexOf(state.me.role) !== -1; });
  }

  /* ---------- filter state <-> route ---------- */
  const ADV = ['stage', 'requestor', 'sr', 'outcome', 'sla', 'group', 'prio', 'from', 'to'];
  function fromRoute(route) {
    const f = { tab: route.scope || 'all', q: route.q || '', sort: route.sort || '' };
    if (route.follow) f.tab = 'follow';                       // old menu links
    if (!tabsFor().some(function (t) { return t.id === f.tab; })) f.tab = 'all';
    ADV.forEach(function (k) { f[k] = route[k] || ''; });
    return f;
  }
  function toRoute(f) {
    const r = { page: 'tickets' };
    if (f.tab && f.tab !== 'all') r.scope = f.tab;
    if (f.q) r.q = f.q;
    if (f.sort) r.sort = f.sort;
    ADV.forEach(function (k) { if (f[k]) r[k] = f[k]; });
    return r;
  }
  function saveRoute(f) {
    const r = toRoute(f);
    state.route = cleanRoute(r);
    google.script.history.replace(state.route, state.route);
    renderNav();
  }

  /* ---------- filtering (pure, in the browser) ---------- */
  function rootOf(code) {
    const g = state.ref.product_groups;
    let c = code;
    for (let i = 0; i < 10; i++) {
      const x = g.filter(function (y) { return y.code === c; })[0];
      if (!x || !x.parent_code) return c;
      c = x.parent_code;
    }
    return c;
  }
  function advMatch(r, f) {
    if (f.stage && r.stage !== f.stage) return false;
    if (f.requestor && r.requestor_email !== f.requestor) return false;
    if (f.sr && r.sr_email !== f.sr) return false;
    if (f.outcome && r.outcome !== f.outcome) return false;
    if (f.sla && r.sla_status !== f.sla) return false;
    if (f.prio && r.priority !== f.prio) return false;
    if (f.group && r.group_codes.indexOf(f.group) === -1 && r.root_codes.indexOf(f.group) === -1) return false;
    const day = String(r.created_at || '').slice(0, 10);
    if (f.from && day < f.from) return false;
    if (f.to && day > f.to) return false;
    return true;
  }
  function textMatch(r, q) {
    if (!q) return true;
    const hay = (r.ticket_no + ' ' + r.title + ' ' + r.customer_name + ' ' + (r.customer_group || '') + ' ' + (r.destination_country || '') + ' ' + r.item_names + ' ' + r.requestor_name + ' ' + (r.sr_name || '')).toLowerCase();
    return q.toLowerCase().split(/\s+/).filter(String).every(function (w) { return hay.indexOf(w) !== -1; });
  }
  const SORTS = {
    smart: function (a, b) {   // open work first, the most urgent on top; finished work last, newest first
      const openA = a.outcome === 'open' ? 0 : 1, openB = b.outcome === 'open' ? 0 : 1;
      if (openA !== openB) return openA - openB;
      if (!openA) {
        const rank = { breach: 0, warning: 1, ok: 2, none: 3, done: 4 };
        return (rank[a.sla_status] - rank[b.sla_status]) || (b.stage_age_hours - a.stage_age_hours);
      }
      return a.updated_at < b.updated_at ? 1 : -1;
    },
    updated_desc: function (a, b) { return a.updated_at < b.updated_at ? 1 : -1; },
    created_desc: function (a, b) { return a.created_at < b.created_at ? 1 : -1; },
    due_asc: function (a, b) { return (a.due_date || '9999') < (b.due_date || '9999') ? -1 : 1; }
  };
  const SORT_LABEL = { smart: 'งานค้างและเร่งด่วนก่อน', updated_desc: 'อัปเดตล่าสุด', created_desc: 'สร้างล่าสุด', due_asc: 'วันที่ต้องการราคา' };

  /* ---------- view ---------- */
  function shell(f) {
    return '<div class="page-head"><h1>ใบเสนอราคา</h1>' +
      (state.me.role === 'sales' ? '<button class="btn primary" data-new>+ สร้างใบขอราคา</button>' : '') + '</div>' +
      '<div class="card list-bar">' +
      '<div class="tabs" role="tablist" id="t-tabs"></div>' +
      '<div class="list-tools"><input type="search" id="f-q" placeholder="ค้นหา เลขที่ใบ / ลูกค้า / สินค้า / Sales / SR" value="' + esc(f.q) + '" aria-label="ค้นหา">' +
      '<button class="btn" id="f-adv" aria-expanded="false">⚙ ตัวกรองเพิ่มเติม <span class="count" id="f-adv-n" hidden></span></button></div>' +
      '<div class="chips" id="t-chips"></div></div>' +
      '<div id="t-results" class="t-results">' + loadingHtml() + '</div>';
  }

  function tabsHtml(rows, f) {
    return tabsFor().map(function (t) {
      const n = rows.filter(t.test).length;
      const on = f.tab === t.id;
      return '<button type="button" role="tab" class="tab' + (on ? ' on' : '') + '" aria-selected="' + on + '" data-tab="' + t.id + '">' +
        esc(t.label) + ' <span class="n">' + fmtInt(n) + '</span></button>';
    }).join('');
  }

  function nameOf(list, email) {
    const u = (list || []).filter(function (x) { return x.email === email; })[0];
    return u ? u.full_name : email;
  }
  function chipsHtml(f) {
    const sg = state.ref.stage_labels;
    const items = [];
    if (f.stage) items.push(['stage', 'ขั้นตอน: ' + (sg[f.stage] || f.stage)]);
    if (f.outcome) items.push(['outcome', 'ผล: ' + ({ done: 'เสนอราคาจบแล้ว', open: 'ยังไม่จบ', rejected: 'ไม่อนุมัติ / ยกเลิก' }[f.outcome] || f.outcome)]);
    if (f.sla) items.push(['sla', f.sla === 'breach' ? 'เกินกำหนด (SLA)' : 'ใกล้ครบกำหนด']);
    if (f.requestor) items.push(['requestor', 'Sales: ' + nameOf(state.ref.sales_users, f.requestor)]);
    if (f.sr) items.push(['sr', 'SR: ' + nameOf(state.ref.sr_users, f.sr)]);
    if (f.group) items.push(['group', 'กลุ่ม: ' + (groupName(f.group) || f.group)]);
    if (f.prio) items.push(['prio', 'ความเร่งด่วน: ' + ({ urgent: 'ด่วนมาก', high: 'สูง', normal: 'ปกติ', low: 'ต่ำ' }[f.prio] || f.prio)]);
    if (f.from || f.to) items.push(['date', 'สร้าง ' + (f.from ? fmtDate(f.from) : '…') + ' – ' + (f.to ? fmtDate(f.to) : '…')]);
    if (f.sort) items.push(['sort', 'เรียง: ' + SORT_LABEL[f.sort]]);
    if (f.q) items.unshift(['q', 'ค้นหา: “' + f.q + '”']);
    if (!items.length) return '';
    return items.map(function (c) {
      return '<span class="chip">' + esc(c[1]) + '<button type="button" data-unchip="' + c[0] + '" aria-label="เอาตัวกรองนี้ออก">✕</button></span>';
    }).join('') + '<button type="button" class="btn sm ghost" data-clear>ล้างทั้งหมด</button>';
  }

  function tableHtml(list, f, shown) {
    if (!list.length) {
      const filtered = f.q || ADV.some(function (k) { return f[k]; }) || f.tab !== 'all';
      return '<div class="card empty">' + (f.tab === 'inbox' && !filtered ? 'ไม่มีงานรอคุณอยู่ตอนนี้ 🎉' : 'ไม่พบใบเสนอราคาตามเงื่อนไขนี้') +
        (filtered ? '<p><button class="btn" data-clear>ล้างตัวกรองแล้วแสดงทั้งหมด</button></p>' : '') +
        (state.me.role === 'sales' ? '<p><button class="btn primary" data-new>+ สร้างใบขอราคา</button></p>' : '') + '</div>';
    }
    const breach = list.filter(function (r) { return r.sla_status === 'breach'; }).length;
    const warn = list.filter(function (r) { return r.sla_status === 'warning'; }).length;
    const rows = list.slice(0, shown);
    return '<p class="small list-sum"><b>' + fmtInt(list.length) + '</b> ใบ' +
      (breach ? ' · <span class="sla breach">⛔ เกิน SLA ' + breach + '</span>' : '') +
      (warn ? ' · <span class="sla warning">⚠ ใกล้ครบ ' + warn + '</span>' : '') + '</p>' +
      '<div class="card" style="padding:0"><div class="tbl-wrap"><table class="tbl stack tlist"><thead><tr>' +
      '<th class="c-main">ใบขอราคา</th><th class="c-st">สถานะ / ขั้นตอน</th><th class="c-p">ผู้ขอ</th><th class="c-p">SR</th><th class="num c-n">รายการ</th><th class="c-t">ค้างในขั้นตอน</th><th class="c-t">อายุ / ต้องการ</th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr class="click" data-id="' + esc(r.ticket_id) + '" tabindex="0">' +

  /* ---------- advanced filter panel (applies only on "ใช้ตัวกรอง") ---------- */
  function openAdvanced(f, apply) {
    const sg = state.ref.stage_labels;
    const opt = function (v, label, cur) { return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(label) + '</option>'; };
    const root = document.createElement('div');
    root.innerHTML = '<div class="overlay" data-close></div><aside class="drawer adv" role="dialog" aria-label="ตัวกรองเพิ่มเติม">' +
      '<header><h3>ตัวกรองเพิ่มเติม</h3><button class="btn sm ghost" data-close aria-label="ปิด">✕</button></header><div class="adv-body">' +
      '<label class="field"><span>ขั้นตอน</span><select id="a-stage">' + opt('', 'ทั้งหมด', f.stage) +
