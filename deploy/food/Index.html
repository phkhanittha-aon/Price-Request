<!DOCTYPE html>
<!--
  File: Index.html
  MGS Food Price Request — web app shell (layout + design tokens + styles).
  Page logic lives in App.html (core) and Page*.html (one file per screen), included below.
-->
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=Sora:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <style>
    /* ===== 1. Design tokens — MGS green (light base) · same look as the MGS Sales app ===== */
    :root {
      --brand: #0A7F6C; --brand-dark: #08695A; --brand-soft: #E2F4EE; --brand-2: #0B6377;
      --grad: linear-gradient(135deg, #13A889 0%, #0E8E8A 48%, #0B6377 100%);
      --bg: #F3F8F6; --card: #FFFFFF; --surface-2: #EEF5F2; --text: #10231F; --ink-2: #3D524C; --muted: #6B807A; --line: #DCE8E3; --line-2: #C9DAD3;
      --ok: #2e8a5b; --warn: #c98a12; --serious: #ec835a; --danger: #bb3b2f;
      --ok-ink: #1f6e46; --warn-ink: #7a5200; --danger-ink: #a12f25;
      --ok-soft: #E4F3EA; --warn-soft: #FBF1DA; --danger-soft: #FAE8E5; --blue: #2f6bb0; --blue-soft: #E7F0FA;
      --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
      --radius: 16px; --shadow: 0 1px 2px rgba(12,40,34,.05), 0 8px 28px rgba(12,40,34,.06);
      --tap: 42px;
      --font: "Inter", "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-head: "Sora", "Sarabun", "Inter", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "Sarabun", monospace;
      font-size: 15px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--font); font-weight: 400; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    h1, h2, h3, h4, .brand .name b { font-family: var(--font-head); letter-spacing: -.01em; }
    b, strong, h1, h2, h3, .btn, .badge, th { font-weight: 600; }
    a { color: var(--brand); }
    button, input, select, textarea { font: inherit; color: inherit; }

    /* ===== 2. Layout — app shell: top bar + module menu on the LEFT + content ===== */
    :root { --topbar-h: 60px; --side-w: 252px; --side-mini: 68px;
      --side-bg: #0C7A72; --side-ink: #FFFFFF; --side-muted: rgba(255,255,255,.72); --side-hover: rgba(255,255,255,.12); --side-active: rgba(255,255,255,.2); --side-accent: #B8F5E2; }
    .topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; min-height: var(--topbar-h); padding: 8px 16px;
      padding-top: calc(8px + env(safe-area-inset-top, 0px)); background: var(--brand-dark); color: #fff; box-shadow: 0 2px 6px rgba(16,38,46,.18); }
    .brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; cursor: pointer; }
    .brand .logo { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; background: #fff; color: var(--brand-dark); font-weight: 700; font-size: .85rem; letter-spacing: .02em; }
    .brand .name { display: flex; flex-direction: column; line-height: 1.15; }
    .brand .name b { font-size: 1rem; } .brand .name small { font-size: .74rem; opacity: .8; font-weight: 400; }
    .crumb { display: flex; align-items: center; gap: 6px; min-width: 0; padding-left: 14px; margin-left: 2px; border-left: 1px solid rgba(255,255,255,.25);
      font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crumb .mod { opacity: .75; } .crumb .cur { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
    .topbar .spacer { flex: 1; }
    .who { text-align: right; font-size: .85rem; line-height: 1.2; }
    .who small { opacity: .85; }
    .icon-btn { position: relative; min-width: var(--tap); min-height: var(--tap); border: 0; border-radius: 10px;
      background: rgba(255,255,255,.12); color: #fff; cursor: pointer; font-size: 1.2rem; }
    .icon-btn:focus-visible { outline: 3px solid #fff; }
    .dot { position: absolute; top: 4px; right: 4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
      background: var(--danger); color: #fff; font-size: .72rem; font-weight: 700; line-height: 20px; }
    #side-toggle { display: none; }

    .shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - var(--topbar-h)); transition: grid-template-columns .18s; }
    .shell.mini { grid-template-columns: var(--side-mini) minmax(0, 1fr); }
    /* the menu colour runs the full page height even when the page is taller than the screen */
    .shell { background: linear-gradient(to right, var(--side-bg) var(--side-w), transparent var(--side-w)); }
    .shell.mini { background: linear-gradient(to right, var(--side-bg) var(--side-mini), transparent var(--side-mini)); }
    .content { min-width: 0; display: flex; flex-direction: column; }
    main { width: 100%; max-width: 1200px; margin: 0 auto; padding: 16px; flex: 1; }
    footer { padding: 16px; text-align: center; color: var(--muted); font-size: .8rem; }

    .side { position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); display: flex; flex-direction: column;
      background: var(--side-bg); color: var(--side-ink); border-right: 1px solid #0A2027; overflow: hidden; }
    .side-head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 8px; }
    .side-head .ttl { flex: 1; font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--side-muted); }
    .side-btn { display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 8px; background: var(--side-hover); color: var(--side-ink); cursor: pointer; font-size: 1rem; }
    .side-btn:focus-visible { outline: 2px solid var(--side-accent); }
    .side-btn[hidden] { display: none; }
    nav.menu { flex: 1; overflow-y: auto; padding: 4px 10px 16px; }
    nav.menu .grp { margin: 14px 8px 6px; font-size: .74rem; font-weight: 600; color: var(--side-muted); letter-spacing: .04em; }
    nav.menu .grp:first-child { margin-top: 4px; }
    nav.menu button { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: var(--tap); padding: 8px 12px; margin: 2px 0;
      border: 0; border-radius: 10px; background: transparent; color: var(--side-ink); text-align: left; cursor: pointer; }
    nav.menu button:hover { background: var(--side-hover); }
    nav.menu button:focus-visible { outline: 2px solid var(--side-accent); outline-offset: -2px; }
    nav.menu button.active { background: var(--side-active); color: #fff; font-weight: 600; }
    nav.menu button.active::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--side-accent); }
    nav.menu button.primary { background: var(--brand); color: #fff; font-weight: 600; margin: 4px 0 6px; }
    nav.menu button.primary:hover { background: #08695A; }
    nav.menu .ico { flex: none; width: 24px; text-align: center; font-size: 1.1rem; }
    nav.menu .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    nav.menu .lbl small { display: block; font-size: .72rem; font-weight: 400; color: var(--side-muted); overflow: hidden; text-overflow: ellipsis; }
    nav.menu .count { flex: none; min-width: 22px; padding: 0 6px; border-radius: 11px; background: var(--danger); color: #fff; font-size: .75rem; font-weight: 700; text-align: center; line-height: 20px; }
    .side-foot { padding: 10px 16px 14px; border-top: 1px solid rgba(255,255,255,.08); font-size: .74rem; color: var(--side-muted); }
    .shell.mini .side-head .ttl, .shell.mini nav.menu .lbl, .shell.mini nav.menu .grp, .shell.mini .side-foot { display: none; }
    .shell.mini .side-head { justify-content: center; padding: 14px 0 8px; }
    .shell.mini nav.menu { padding: 4px 8px 16px; }
    .shell.mini nav.menu button { justify-content: center; padding: 8px 0; }
    .shell.mini nav.menu .count { position: absolute; top: 2px; right: 2px; min-width: 18px; line-height: 18px; font-size: .68rem; }
    .side-ov { display: none; }

    @media (max-width: 900px) {
      #side-toggle { display: inline-block; }
      #side-mini { display: none; }
      .crumb { display: none; }
      .shell, .shell.mini { grid-template-columns: minmax(0, 1fr); background: none; }
      .side { position: fixed; top: 0; left: 0; z-index: 40; width: min(300px, 86vw); height: 100%; padding-top: env(safe-area-inset-top, 0px);
        transform: translateX(-100%); transition: transform .2s ease-out; box-shadow: 8px 0 24px rgba(0,0,0,.25); }
      .side.open { transform: none; }
      .shell.mini .side-head .ttl, .shell.mini nav.menu .lbl, .shell.mini nav.menu .grp, .shell.mini .side-foot { display: revert; }
      .shell.mini nav.menu button { justify-content: flex-start; padding: 8px 12px; }
      .side-ov.open { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(8,20,24,.45); }
    }
    @media (max-width: 560px) { .brand .name small { display: none; } .brand .name b { font-size: .92rem; } .who { display: none; } }
    @media (prefers-reduced-motion: reduce) { .shell, .side { transition: none; } }

    /* ===== 3. Components ===== */
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
    .card h2, .card h3 { margin: 0 0 12px; font-size: 1.05rem; }
    .page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
    .page-head h1 { margin: 0; font-size: 1.3rem; flex: 1 1 auto; }
    .muted { color: var(--muted); }
    .small { font-size: .85rem; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; }
    .row > * { flex: 1 1 180px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); padding: 8px 16px;
      border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; font-weight: 600; text-decoration: none; color: var(--text); }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn.danger { background: #fff; border-color: var(--danger); color: var(--danger-ink); }
    .btn.ghost { border-color: transparent; background: transparent; color: var(--brand); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn.sm { min-height: 36px; padding: 4px 10px; font-size: .9rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .actions .sep { flex: 1; }
    label.field { display: block; margin-bottom: 12px; }
    label.field > span { display: block; margin-bottom: 4px; font-weight: 600; font-size: .92rem; }
    label.field > span .req { color: var(--danger-ink); }
    input[type=text], input[type=number], input[type=date], input[type=search], input[type=tel], input[type=email], select, textarea {
      width: 100%; min-height: var(--tap); padding: 8px 10px; border: 1px solid #C9DAD3; border-radius: 8px; background: #fff; }
    textarea { min-height: 88px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 3px solid var(--brand-soft); border-color: var(--brand); }
    .invalid { border-color: var(--danger) !important; }
    .err-text { color: var(--danger-ink); font-size: .85rem; margin-top: 2px; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600;
      border: 1px solid var(--line); background: #fff; white-space: nowrap; }
    .badge.st-requested { background: #EEF3FF; border-color: #C9D7FB; color: #1d3f8f; }
    .badge.st-on_process { background: #FFF5E6; border-color: #F5D7A6; color: #7a4a00; }
    .badge.st-completed { background: #E9F7F0; border-color: #B7E3CB; color: #0d5b35; }
    .badge.st-closed { background: #EEF0F1; border-color: #D3D9DC; color: #384850; }
    .badge.st-rejected { background: #FDEDED; border-color: #F3C3C3; color: var(--danger-ink); }
    .sla { font-weight: 700; }
    .sla.ok { color: var(--ok-ink); } .sla.warning { color: var(--warn-ink); } .sla.breach { color: var(--danger-ink); }
    .prio-urgent { color: var(--danger-ink); font-weight: 700; } .prio-high { color: var(--warn-ink); font-weight: 700; }
    .notice { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--brand-soft); margin-bottom: 12px; }
    .notice.warn { background: #FFF6E0; border-color: #F2D48A; }
    .notice.danger { background: #FDEDED; border-color: #F3C3C3; }
    .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
    .kv dt { color: var(--muted); } .kv dd { margin: 0; }
    .loading, .empty, .error-box { padding: 32px 16px; text-align: center; color: var(--muted); }
    .error-box { color: var(--danger-ink); }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%;
      animation: spin 0.9s linear infinite; vertical-align: -3px; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* tables → cards on phones */
    table.tbl { width: 100%; border-collapse: collapse; }
    table.tbl th, table.tbl td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    table.tbl th { position: sticky; top: 0; background: #EEF5F2; font-size: .82rem; color: var(--muted); font-weight: 600; }
    table.tbl td.num, table.tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
    table.tbl tr.click { cursor: pointer; }
    table.tbl tr.click:hover td { background: #F2F8F5; }
    .tbl-wrap { overflow-x: auto; }
    @media (max-width: 720px) {
      table.tbl.stack thead { display: none; }
      table.tbl.stack tr { display: block; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; background: #fff; }
      table.tbl.stack td { display: flex; justify-content: space-between; gap: 12px; border: 0; padding: 6px 12px; text-align: right; }
      table.tbl.stack td::before { content: attr(data-label); color: var(--muted); text-align: left; font-size: .85rem; }
      table.tbl.stack td.main { display: block; text-align: left; font-weight: 600; padding-top: 10px; }
      table.tbl.stack td.main::before { content: none; }
      .who .email { display: none; }
    }

    /* modal / drawer / toast */
    .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(10, 25, 30, .45); display: flex; align-items: flex-end; justify-content: center; }
    @media (min-width: 720px) { .overlay { align-items: center; } }
    .dialog { width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; background: #fff; border-radius: 16px 16px 0 0; padding: 20px; }
    @media (min-width: 720px) { .dialog { border-radius: 16px; } }
    .dialog h3 { margin: 0 0 8px; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 60; width: min(420px, 100%); background: #fff; box-shadow: -4px 0 16px rgba(0,0,0,.15);
      display: flex; flex-direction: column; }
    .drawer header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .drawer header h3 { margin: 0; flex: 1; }
    .drawer .list { overflow: auto; flex: 1; }
    .notif { display: block; width: 100%; text-align: left; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--line); background: #fff; cursor: pointer; }
    .notif.unread { background: #EEF7F3; border-left: 4px solid var(--brand); }
    .notif .t { font-weight: 600; }
    #toast-root { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; width: min(520px, calc(100% - 32px)); }
    .toast { padding: 12px 16px; border-radius: 10px; background: #10231F; color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
    .toast.ok { background: #0d5b35; } .toast.err { background: #8f2424; }

    /* timeline */
    .timeline { list-style: none; margin: 0; padding: 0; }
    .timeline li { position: relative; padding: 0 0 14px 22px; border-left: 2px solid var(--line); margin-left: 6px; }
    .timeline li::before { content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--brand); }
    .timeline li.data::before { background: #C9DAD3; }
    .timeline .meta { color: var(--muted); font-size: .82rem; }
    .timeline .cmt { margin-top: 4px; padding: 6px 10px; background: #F6F8F9; border-radius: 8px; white-space: pre-wrap; }

    /* charts (plain HTML bars) */
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .kpi { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
    .kpi .v { font-size: 1.9rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .kpi .l { color: var(--muted); font-size: .88rem; }
    .bars { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; gap: 8px 10px; align-items: center; }
    .bars .lbl { font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bars .track { position: relative; height: 18px; }
    .bars .fill { position: absolute; left: 0; top: 0; bottom: 0; display: flex; gap: 2px; }
    .bars .seg { height: 100%; min-width: 2px; }
    .bars .seg:last-child { border-radius: 0 4px 4px 0; }
    .bars .val { font-size: .88rem; font-variant-numeric: tabular-nums; color: var(--text); text-align: right; min-width: 48px; }
    .bars .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .55; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 10px; font-size: .85rem; color: var(--muted); }
    .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    #tip { position: fixed; z-index: 80; pointer-events: none; max-width: 260px; padding: 8px 10px; border-radius: 8px;
      background: #10231F; color: #fff; font-size: .82rem; display: none; white-space: pre-line; }
    details.tview summary { cursor: pointer; color: var(--brand); font-size: .85rem; margin-top: 10px; }

    /* quotation compare */
    .qcard { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 10px; }
    .tag-cheap { background: #E9F7F0; border-color: #B7E3CB; color: #0d5b35; }
    .tag-win { background: var(--brand); border-color: var(--brand); color: #fff; }
    .tag-sr { background: var(--blue-soft); border-color: transparent; color: var(--blue); }
    /* request form (Food) — document-style form: numbered sections, 3-column grid, hints under inputs */
    .form-wrap { max-width: 1080px; }
    .form-title { margin-bottom: 8px; }
    .route-card { padding: 12px 16px; }
    .sec-label { font-size: .78rem; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin-bottom: 8px; }
    .route-steps { display: flex; flex-wrap: wrap; gap: 6px 4px; margin: 0; padding: 0; list-style: none; font-size: .85rem; }
    .route-steps li { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-dark); }
    .route-steps li:not(:last-child)::after { content: "›"; margin-left: 6px; color: var(--muted); }
    .route-steps .n { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #fff; font-size: .75rem; font-weight: 600; }
    .fsec h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); font-size: 1.02rem; }
    .fsec .sn { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--brand); color: #fff; font-size: .85rem; }
    .fgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 16px; align-items: start; }
    .fgrid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .fgrid .span-2 { grid-column: span 2; } .fgrid .span-3 { grid-column: 1 / -1; }
    .fgrid label.field, .fgrid .field { margin-bottom: 14px; min-width: 0; }
    .fgrid label.field > span, .fgrid .field > span { display: block; margin-bottom: 6px; font-weight: 500; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fgrid .field > span em { font-style: normal; font-weight: 400; color: var(--muted); font-size: .8rem; }
    label.field .hint, .field .hint { display: block; margin: 4px 0 0; color: var(--muted); font-size: .8rem; font-weight: 400; }
    .fsec .item-row { padding: 14px 16px 2px; background: #FBFCFD; }
    .fsec .item-row .head { margin-bottom: 12px; }
    .fsec .item-row .head .no { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-dark); font-size: .8rem; }
    .drop { border: 1px dashed #B5CCC4; border-radius: 10px; padding: 12px 14px; background: #fff; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
    .drop.over { border-color: var(--brand); background: var(--brand-soft); }
    .pics { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
    .pics:empty { display: none; }
    .pic { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 10px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: .85rem; }

<!--
  File: App.html
  Core client code: server calls, router, shared UI helpers, notifications, uploads.
  Pages register themselves in `Pages` (see Page*.html).
-->
<script>
/* ===== 1. State ===== */
const state = {
  me: null, ref: null, menu: [], poll: { inbox: 0, unread: 0 },
  route: { page: 'home' }, renderSeq: 0, drafts: {}, views: {}
};
const Pages = {};

/* ===== 2. Server calls ===== */
/**
 * Promise wrapper over google.script.run. Resolves with `data`, rejects with { code, error }.
 * Every call has a failure handler and a timeout (Apps Script calls are slow on mobile networks).
 */
function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    let settled = false;
    const timer = setTimeout(function () {
      if (settled) return;
      settled = true;
      reject({ code: 'TIMEOUT', error: 'ยังไม่ทราบผลจากเซิร์ฟเวอร์ — กรุณาตรวจสอบสถานะก่อนกดซ้ำ' });
    }, 60000);
    const runner = google.script.run
      .withSuccessHandler(function (res) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (res && res.ok) resolve(res.data);
        else reject(res || { code: 'SYSTEM_ERROR', error: 'ระบบตอบกลับไม่ถูกต้อง' });
      })
      .withFailureHandler(function (e) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        reject({ code: 'NETWORK', error: 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาลองใหม่ (' + ((e && e.message) || e) + ')' });
      });
    runner[fn].apply(runner, args);
  });
}

/* ===== 3. Helpers ===== */
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function $(sel, root) { return (root || document).querySelector(sel); }
function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
    const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
const nf0 = new Intl.NumberFormat('th-TH', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf4 = new Intl.NumberFormat('th-TH', { maximumFractionDigits: 4 });
function fmtInt(n) { return n == null || n === '' ? '–' : nf0.format(Number(n)); }
function fmtMoney(n) { return n == null || n === '' || isNaN(n) ? '–' : nf2.format(Number(n)); }
function fmtNum(n) { return n == null || n === '' || isNaN(n) ? '–' : nf4.format(Number(n)); }
const dtf = new Intl.DateTimeFormat('th-TH', { timeZone: 'Asia/Bangkok', day: '2-digit', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' });
const df = new Intl.DateTimeFormat('th-TH', { timeZone: 'Asia/Bangkok', day: '2-digit', month: 'short', year: 'numeric' });
function fmtDateTime(iso) { return iso ? dtf.format(new Date(iso)) : '–'; }
function fmtDate(ymdOrIso) {
  if (!ymdOrIso) return '–';
  const d = /^\d{4}-\d{2}-\d{2}$/.test(ymdOrIso) ? new Date(ymdOrIso + 'T00:00:00+07:00') : new Date(ymdOrIso);
  return df.format(d);
}
function todayYmd(offsetDays) {
  const d = new Date(Date.now() + (offsetDays || 0) * 86400000 + 7 * 3600000);
  return d.toISOString().slice(0, 10);
}
function fmtHours(h) {
  if (h == null || h === '') return '–';
  if (h < 1) return Math.round(h * 60) + ' นาที';
  if (h < 48) return (Math.round(h * 10) / 10) + ' ชม.';
  return (Math.round(h / 24 * 10) / 10) + ' วัน';
}
function fileSize(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
function debounce(fn, ms) {
  let t; return function () { const a = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(null, a); }, ms); };
}
function statusBadge(status, label) { return '<span class="badge st-' + esc(status) + '">' + esc(label || status) + '</span>'; }
function stageText(stage) { return (state.ref && state.ref.stage_labels[stage]) || stage; }
/** SLA: colour + icon + words (never colour alone). */
function slaBadge(s) {
  const map = {
    ok: ['ok', '✓', 'ตามเวลา'], warning: ['warning', '⚠', 'ใกล้ครบ SLA'], breach: ['breach', '⛔', 'เกิน SLA'],
    none: ['', '', ''], done: ['', '', '']
  };
  const m = map[s] || map.none;
  return m[2] ? '<span class="sla ' + m[0] + '">' + m[1] + ' ' + m[2] + '</span>' : '';
}
function prioText(p) {
  const map = { low: 'ต่ำ', normal: 'ปกติ', high: 'สูง', urgent: 'ด่วนมาก' };
  return '<span class="prio-' + esc(p) + '">' + esc(map[p] || p) + '</span>';
}
function groupName(code) {
  const g = (state.ref.product_groups || []).filter(function (x) { return x.code === code; })[0];
  return g ? g.name : code;
}
function groupOptions(selected, includeAll) {
  const groups = state.ref.product_groups;
  const parents = groups.filter(function (g) { return !g.parent_code; });
  let html = includeAll ? '<option value="">ทุกกลุ่มสินค้า</option>' : '<option value="">— เลือกกลุ่มสินค้า —</option>';
  parents.forEach(function (p) {
    const kids = groups.filter(function (g) { return g.parent_code === p.code; });
    html += '<optgroup label="' + esc(p.name) + '">';
    if (includeAll || !kids.length) {
      html += '<option value="' + esc(p.code) + '"' + (selected === p.code ? ' selected' : '') + '>' + esc(p.name) + (includeAll ? ' (ทั้งหมด)' : '') + '</option>';
    }
    kids.forEach(function (k) {
      html += '<option value="' + esc(k.code) + '"' + (selected === k.code ? ' selected' : '') + '>' + esc(k.name) + '</option>';
    });
    html += '</optgroup>';
  });
  return html;
}
function loadingHtml(text) { return '<div class="loading"><span class="spinner"></span>' + esc(text || 'กำลังโหลดข้อมูล...') + '</div>'; }
function errorHtml(err, retryJs) {
  return '<div class="error-box"><p>' + esc((err && err.error) || 'เกิดข้อผิดพลาด') + '</p>' +
    (retryJs ? '<button class="btn" onclick="' + retryJs + '">ลองใหม่</button>' : '') + '</div>';
}

/* ===== 4. Toast, dialogs, tooltip ===== */
function toast(msg, type, ms) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(function () { el.remove(); }, ms || (type === 'err' ? 7000 : 4000));
}

/**
 * Generic dialog. opts: { title, message, html, confirmText, danger, comment: 'none'|'optional'|'required',
 *   commentLabel, validate(root) → string|null, onOpen(root) }
 * Resolves with { comment, root } or null when cancelled.
 */
function dialog(opts) {
  return new Promise(function (resolve) {
    const o = opts || {};
    const root = document.createElement('div');
    root.className = 'overlay';
    const needComment = o.comment && o.comment !== 'none';
    root.innerHTML = '<div class="dialog" role="dialog" aria-modal="true">' +
      '<h3>' + esc(o.title || 'ยืนยัน') + '</h3>' +
      (o.message ? '<p>' + esc(o.message) + '</p>' : '') + (o.html || '') +
      (needComment ? '<label class="field"><span>' + esc(o.commentLabel || 'หมายเหตุ') +
        (o.comment === 'required' ? ' <span class="req">*</span>' : ' <span class="muted">(ไม่บังคับ)</span>') +
        '</span><textarea id="dlg-comment" maxlength="2000"></textarea></label>' : '') +
      '<div class="err-text" id="dlg-err"></div>' +
      '<div class="actions" style="margin-top:12px"><span class="sep"></span>' +
      '<button class="btn" id="dlg-cancel">ยกเลิก</button>' +
      '<button class="btn ' + (o.danger ? 'danger' : 'primary') + '" id="dlg-ok">' + esc(o.confirmText || 'ยืนยัน') + '</button></div></div>';
    $('#modal-root').appendChild(root);
    const close = function (val) { root.remove(); document.removeEventListener('keydown', onKey); resolve(val); };
    const onKey = function (e) { if (e.key === 'Escape') close(null); };
    document.addEventListener('keydown', onKey);
    root.addEventListener('click', function (e) { if (e.target === root) close(null); });
    $('#dlg-cancel', root).onclick = function () { close(null); };
    $('#dlg-ok', root).onclick = function () {
      const comment = needComment ? $('#dlg-comment', root).value.trim() : '';
      let err = '';
      if (o.comment === 'required' && !comment) err = 'กรุณากรอก ' + (o.commentLabel || 'หมายเหตุ');
      if (!err && o.validate) err = o.validate(root) || '';
      if (err) { $('#dlg-err', root).textContent = err; return; }
      close({ comment: comment, root: root });
    };
    if (o.onOpen) o.onOpen(root);
    const first = $('textarea, select, input', root) || $('#dlg-ok', root);
    if (first) first.focus();
  });
}

/* Hover / tap tooltip for chart marks: any element with data-tip */
(function () {
  const show = function (e) {
    const t = e.target.closest && e.target.closest('[data-tip]');
    const tip = document.getElementById('tip');
    if (!t || !tip) { if (tip) tip.style.display = 'none'; return; }
    tip.textContent = t.getAttribute('data-tip');
    tip.style.display = 'block';
    const x = (e.touches ? e.touches[0].clientX : e.clientX) + 14;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) + 14;
    tip.style.left = Math.min(x, window.innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = Math.min(y, window.innerHeight - tip.offsetHeight - 8) + 'px';
  };
  document.addEventListener('mousemove', show);
  document.addEventListener('touchstart', show, { passive: true });
  document.addEventListener('scroll', function () { const tip = document.getElementById('tip'); if (tip) tip.style.display = 'none'; }, true);
})();

/* ===== 5. Router (google.script.history keeps the browser back button working) ===== */
const ROUTE_KEYS = ['page', 'id', 'scope', 'stage', 'requestor', 'sr', 'outcome', 'follow', 'q', 'sort', 'group', 'prio', 'from', 'to', 'copy', 'sla'];
function cleanRoute(p) {
  const r = {};
  ROUTE_KEYS.forEach(function (k) { if (p && p[k]) r[k] = String(p[k]); });
  if (!r.page || ['home', 'dashboard', 'gp', 'deals', 'tickets', 'ticket', 'new', 'edit', 'pricing', 'suppliers', 'admin'].indexOf(r.page) === -1) r.page = 'home';
  return r;
}
function go(route, replace) {
  const r = cleanRoute(route);
  if (replace) google.script.history.replace(r, r);
  else google.script.history.push(r, r);
  render(r);
}
function render(route) {
  state.route = cleanRoute(route);
  const seq = ++state.renderSeq;
  renderNav();
  window.scrollTo(0, 0);
  const view = $('#view');
  const page = Pages[state.route.page] || Pages.home;
  state.views[state.route.page] = (state.views[state.route.page] || 0) + 1;
  view.innerHTML = loadingHtml();
  try {
    page.render(view, state.route, function isCurrent() { return seq === state.renderSeq; });
  } catch (e) {

/* ===== 7. Chunked upload (≤ 20 MB, 2 MB per call, progress + one retry per chunk) ===== */
function readSliceBase64(file, start, end) {
  return new Promise(function (resolve, reject) {
    const r = new FileReader();
    r.onload = function () { const s = String(r.result); resolve(s.slice(s.indexOf(',') + 1)); };
    r.onerror = function () { reject({ code: 'FILE_READ', error: 'อ่านไฟล์ไม่สำเร็จ' }); };
    r.readAsDataURL(file.slice(start, end));
  });
}
function uploadFile(file, meta, onProgress) {
  const maxMb = state.ref.max_upload_mb || 20;
  if (file.size > maxMb * 1048576) return Promise.reject({ code: 'FILE_TOO_LARGE', error: file.name + ': ไฟล์ใหญ่เกิน ' + maxMb + ' MB' });
  return api('beginUpload', Object.assign({}, meta, { file_name: file.name, mime_type: file.type, size_bytes: file.size }))
    .then(function (s) {
      let index = 0;
      const next = function () {
        const start = index * s.chunk_bytes;
        const end = Math.min(start + s.chunk_bytes, file.size);
        return readSliceBase64(file, start, end).then(function (b64) {
          const send = function () { return api('uploadChunk', s.upload_id, index, b64); };
          return send().catch(function (e) { if (e.code === 'NETWORK' || e.code === 'TIMEOUT') return send(); throw e; });
        }).then(function (res) {
          index++;
          if (onProgress) onProgress(Math.min(1, end / file.size));
          if (res.done) return res.attachment;
          return next();
        });
      };
      return next();
    });
}

/* ===== 7b. Supplier product photos (gallery + viewer + upload, ≤ max per supplier) ===== */
/**
 * Photos.html(list, opts)   list = attachments of ONE supplier offer (category quote_photo)
 *   opts: { ticketId, itemId, quoteId, editable, max, compact }
 * Photos.bind(root, opts)    wires every gallery under root (once): viewer, delete, upload.
 *   opts: { attachments() → live array to update, onChange() → called after add / delete }
 * Images are loaded through getPhotoPreviews (permission-checked on the server) and kept in memory.
 */
const Photos = (function () {
  const cache = {};
  const pending = {};
  function maxPer() { return (state.ref && state.ref.max_photos_per_quote) || 10; }
  function of(attachments, quoteId) {
    return (attachments || []).filter(function (a) { return a.category === 'quote_photo' && a.quote_id === quoteId; });
  }
  function html(list, o) {
    const max = o.max || maxPer();
    const thumbs = list.map(function (a, i) {
      return '<figure class="pth"><button type="button" class="pimg" data-ph="' + esc(a.attachment_id) + '" data-i="' + i + '" aria-label="ดูรูป ' + esc(a.file_name) + '">' +
        '<img alt="" data-phid="' + esc(a.attachment_id) + '"' + (cache[a.attachment_id] ? ' src="' + cache[a.attachment_id] + '"' : '') + '></button>' +
        (o.editable && a.uploaded_by === state.me.email ? '<button type="button" class="pdel" data-phdel="' + esc(a.attachment_id) + '" aria-label="ลบรูป">✕</button>' : '') + '</figure>';
    }).join('');
    const add = o.editable && list.length < max
      ? '<label class="pth padd" title="แนบรูปสินค้า (สูงสุด ' + max + ' รูป)"><input type="file" accept="image/jpeg,image/png,image/webp,image/heic,.heic" multiple hidden data-phup>' +
        '<span class="plus">＋</span><small>รูป</small></label>' : '';
    if (!list.length && !o.editable) return o.compact ? '' : '<div class="pgal empty small muted">ไม่มีรูปสินค้า</div>';
    return '<div class="pgal' + (o.compact ? ' compact' : '') + '" data-pgal data-ticket="' + esc(o.ticketId || '') + '" data-item="' + esc(o.itemId || '') +
      '" data-quote="' + esc(o.quoteId || '') + '">' +
      '<div class="pgal-head small"><span>📷 รูปสินค้า</span><span class="muted" data-phcount>' + list.length + ' / ' + max + '</span></div>' +
      '<div class="pgal-grid">' + thumbs + add + '</div><div class="pgal-prog"></div></div>';
  }
  /** Load thumbnails of every <img data-phid> under root that has no src yet (12 per call). */
  function load(root) {
    const imgs = $all('img[data-phid]', root).filter(function (im) { return !im.getAttribute('src'); });
    imgs.forEach(function (im) { const id = im.getAttribute('data-phid'); if (cache[id]) im.src = cache[id]; });
    const ids = imgs.map(function (im) { return im.getAttribute('data-phid'); })
      .filter(function (id, i, a) { return !cache[id] && !pending[id] && a.indexOf(id) === i; });
    for (let i = 0; i < ids.length; i += 12) {
      const part = ids.slice(i, i + 12);
      part.forEach(function (id) { pending[id] = true; });
      api('getPhotoPreviews', part, 'thumb').then(function (r) {
        part.forEach(function (id) {
          delete pending[id];
          const url = r.previews[id];
          if (url) cache[id] = url;
          $all('img[data-phid="' + id + '"]').forEach(function (im) {
            if (url) im.src = url; else im.closest('.pimg').classList.add('nopv');
          });
        });
      }).catch(function () { part.forEach(function (id) { delete pending[id]; }); });
    }
  }
  /** Full-screen viewer with prev / next (arrow keys, swipe). */
  function view(list, index) {
    let i = index || 0;
    const root = document.createElement('div');
    root.className = 'overlay pview';
    root.innerHTML = '<div class="pview-box" role="dialog" aria-modal="true" aria-label="รูปสินค้า">' +
      '<div class="pview-top"><span class="small" data-cap></span><span class="sep"></span>' +
      '<button type="button" class="btn sm" data-orig>เปิดไฟล์ต้นฉบับ</button><button type="button" class="btn sm" data-x aria-label="ปิด">✕</button></div>' +
      '<div class="pview-stage"><button type="button" class="pnav prev" data-prev aria-label="รูปก่อนหน้า">‹</button>' +
      '<img alt="" data-big><span class="spinner" data-spin></span>' +
      '<button type="button" class="pnav next" data-next aria-label="รูปถัดไป">›</button></div>' +
      '<div class="pview-strip">' + list.map(function (a, k) {
        return '<button type="button" data-k="' + k + '"><img alt="" data-phid="' + esc(a.attachment_id) + '"' + (cache[a.attachment_id] ? ' src="' + cache[a.attachment_id] + '"' : '') + '></button>';
      }).join('') + '</div></div>';
    $('#modal-root').appendChild(root);
    const big = $('[data-big]', root);
    const show = function () {
      const a = list[i];
      $('[data-cap]', root).textContent = (i + 1) + ' / ' + list.length + ' · ' + a.file_name;
      $all('.pview-strip button', root).forEach(function (b, k) { b.classList.toggle('on', k === i); });
      big.src = cache[a.attachment_id] || '';
      $('[data-spin]', root).style.display = '';
      const want = a.attachment_id;
      api('getPhotoPreviews', [want], 'large').then(function (r) {
        if (list[i].attachment_id !== want) return;
        if (r.previews[want]) big.src = r.previews[want];
        $('[data-spin]', root).style.display = 'none';
      }).catch(function () { $('[data-spin]', root).style.display = 'none'; });
      $('[data-prev]', root).disabled = i === 0;
      $('[data-next]', root).disabled = i === list.length - 1;
    };
    const close = function () { root.remove(); document.removeEventListener('keydown', onKey); };
    const step = function (d) { const n = i + d; if (n >= 0 && n < list.length) { i = n; show(); } };
    const onKey = function (e) { if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); };
    document.addEventListener('keydown', onKey);
    root.addEventListener('click', function (e) { if (e.target === root || e.target.classList.contains('pview-stage')) close(); });
    $('[data-x]', root).onclick = close;
    $('[data-prev]', root).onclick = function () { step(-1); };
    $('[data-next]', root).onclick = function () { step(1); };
    $all('.pview-strip button', root).forEach(function (b) { b.onclick = function () { i = Number(b.getAttribute('data-k')); show(); }; });
    $('[data-orig]', root).onclick = function () {
      api('openAttachment', list[i].attachment_id).then(function (r) { window.open(r.url, '_blank'); }).catch(function (e) { toast(e.error, 'err'); });
    };
    let x0 = null;
    root.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
    root.addEventListener('touchend', function (e) {
      if (x0 == null) return;
      const dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
      x0 = null;
    });
    show();
    load(root);
  }
  /** Phone photos are often 4–12 MB: shrink to ≤ 1600 px JPEG before upload (HEIC is sent as is). */
  function shrink(file) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 400 * 1024) return Promise.resolve(file);
    return new Promise(function (resolve) {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = function () {
        const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k);
        c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) {
          if (!b || b.size >= file.size) { resolve(file); return; }
          resolve(new File([b], file.name.replace(/\.(png|webp|jpe?g)$/i, '') + '.jpg', { type: 'image/jpeg' }));
        }, 'image/jpeg', 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }
  function bind(root, o) {
    $all('[data-pgal]', root).forEach(function (g) {
      if (g.dataset.bound) return;
      g.dataset.bound = '1';
      const quoteId = g.getAttribute('data-quote');
      const listNow = function () { return of(o.attachments(), quoteId); };
      g.addEventListener('click', function (e) {
        const del = e.target.closest('[data-phdel]');
        if (del) {
          e.preventDefault();
          const id = del.getAttribute('data-phdel');
          dialog({ title: 'ลบรูปนี้?', message: 'รูปจะถูกลบออกจาก Supplier เจ้านี้', confirmText: 'ลบรูป', danger: true }).then(function (ok) {
            if (!ok) return;
            api('deleteAttachment', id).then(function () {
              const arr = o.attachments();
              const k = arr.findIndex(function (a) { return a.attachment_id === id; });
              if (k !== -1) arr.splice(k, 1);
              toast('ลบรูปแล้ว', 'ok');
              if (o.onChange) o.onChange(quoteId);
            }).catch(function (err) { toast(err.error, 'err'); });
          });
          return;
        }
        const ph = e.target.closest('[data-ph]');
        if (ph) { e.preventDefault(); view(listNow(), Number(ph.getAttribute('data-i'))); }
      });
      const input = $('[data-phup]', g);
      if (input) input.onchange = function () {
        const files = Array.prototype.slice.call(input.files || []);
        input.value = '';
        const room = maxPer() - listNow().length;
        if (files.length > room) toast('แนบได้อีก ' + Math.max(room, 0) + ' รูป (สูงสุด ' + maxPer() + ' รูปต่อ Supplier) — เลือกเฉพาะ ' + Math.max(room, 0) + ' รูปแรก', 'err', 7000);
        const prog = $('.pgal-prog', g);
        let chain = Promise.resolve();
        let added = 0;
        files.slice(0, Math.max(room, 0)).forEach(function (f) {
          chain = chain.then(function () {
            const row = document.createElement('div');
            row.innerHTML = '<div class="small">' + esc(f.name) + '</div><div class="progress"><div></div></div>';
            prog.appendChild(row);
            return shrink(f).then(function (small) {
              return uploadFile(small, { ticket_id: g.getAttribute('data-ticket'), item_id: g.getAttribute('data-item'), quote_id: quoteId, category: 'quote_photo' },
                function (p) { row.querySelector('.progress > div').style.width = Math.round(p * 100) + '%'; });
            }).then(function (att) { o.attachments().push(att); added++; row.remove(); })
              .catch(function (err) { toast(f.name + ': ' + err.error, 'err', 8000); row.remove(); });
          });
        });
        chain.then(function () {
          if (added) toast('แนบรูปแล้ว ' + added + ' รูป', 'ok');
          if (o.onChange) o.onChange(quoteId);
        });
      };
    });
    load(root);
  }
  return { html: html, bind: bind, load: load, view: view, of: of, max: maxPer };
})();
