    :root {
      --brand: #0A7F6C; --brand-dark: #08695A; --brand-soft: #E2F4EE;
      --grad: linear-gradient(135deg, #13A889 0%, #0E8E8A 48%, #0B6377 100%);
      --bg: #F3F8F6; --card: #fff; --surface-2: #EEF5F2; --text: #10231F; --ink-2: #3D524C; --muted: #6B807A; --line: #DCE8E3; --line-2: #C9DAD3;
      --ok-ink: #1f6e46; --ok-soft: #E4F3EA; --warn: #c98a12; --warn-soft: #FBF1DA; --danger: #bb3b2f; --danger-ink: #a12f25; --danger-soft: #FAE8E5;
      --blue: #2f6bb0; --blue-soft: #E7F0FA;
      --shadow: 0 1px 2px rgba(12,40,34,.05), 0 8px 28px rgba(12,40,34,.06);
      --font: "Inter", "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-head: "Sora", "Sarabun", "Inter", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "Sarabun", monospace;
      font-size: 15px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.55; -webkit-font-smoothing: antialiased; }
    h1, h2, h3 { font-family: var(--font-head); letter-spacing: -.01em; }
    b, strong, h1, h2, h3, .btn { font-weight: 600; }
    a { color: var(--brand); }
    button { font: inherit; color: inherit; }
    .mono { font-family: var(--font-mono); }
    .hint { font-size: .8rem; color: var(--muted); }
    .top { position: sticky; top: 0; z-index: 20; background: rgba(243,248,246,.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
    .top-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; background: var(--grad); color: #fff; font-weight: 700; font-size: .82rem; box-shadow: 0 4px 12px rgba(11,99,119,.25); }
    .brand b { display: block; font-family: var(--font-head); line-height: 1.15; } .brand small { color: var(--muted); font-size: .76rem; }
    .spacer { flex: 1; }
    .me { text-align: right; font-size: .82rem; line-height: 1.2; } .me small { color: var(--muted); }
    main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 40px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px; border: 1px solid var(--line-2); border-radius: 11px;
      background: #fff; color: var(--ink-2); cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn:hover { background: var(--surface-2); }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; } .btn.primary:hover { background: var(--brand-dark); }
    .btn.sm { min-height: 34px; padding: 4px 12px; font-size: .88rem; border-radius: 9px; }
    .btn:focus-visible, .go-card:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; }
    .tag { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 20px; font-size: .76rem; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); }
    .tag.amber { background: var(--warn-soft); color: #8a5d05; } .tag.blue { background: var(--blue-soft); color: var(--blue); } .tag.purple { background: #F2EAFB; color: #6a3aa6; } .tag.grey { background: #EDF1EF; color: #5d6e69; }
    .notice { padding: 12px 14px; border-radius: 12px; background: var(--brand-soft); border: 1px solid rgba(10,127,108,.25); font-size: .9rem; }
    .notice.danger { background: var(--danger-soft); border-color: rgba(187,59,47,.3); color: var(--danger-ink); }
    code { font-family: var(--font-mono); font-size: .85em; background: rgba(16,35,31,.06); padding: 1px 5px; border-radius: 5px; }
    .loading, .center { padding: 60px 16px; text-align: center; color: var(--muted); }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .9s linear infinite; vertical-align: -3px; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* hero */
    .hero { position: relative; overflow: hidden; border-radius: 20px; padding: 24px 26px 20px; margin-bottom: 16px; color: #fff; background: var(--grad); box-shadow: 0 10px 30px rgba(11,99,119,.22); }
    .hero::after { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px), radial-gradient(120% 90% at 85% 120%, rgba(6,58,72,.45), transparent 60%); }
    .hero > * { position: relative; z-index: 1; }
    .hero h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .hero-row { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
    .hero-k { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; opacity: .85; font-weight: 600; margin-bottom: 4px; }
    .hero .sub { opacity: .92; font-size: .92rem; }
    .hero-side { display: flex; align-items: center; gap: 10px; } .hint-w { font-size: .78rem; opacity: .85; }
    .hero-btn { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.4); color: #fff; } .hero-btn:hover { background: rgba(255,255,255,.26); }
    .hero-go { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 18px; }
    .go-card { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 14px; border: 1px solid rgba(255,255,255,.45); background: rgba(255,255,255,.14);
      color: #fff; text-decoration: none; text-align: left; cursor: pointer; transition: background .15s, transform .15s; }
    .go-card:hover { background: rgba(255,255,255,.24); transform: translateY(-1px); }
    .go-card.off { opacity: .6; cursor: default; transform: none; }
    .go-card .gi { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 12px; background: #fff; color: var(--brand-dark); font-size: 1.5rem; flex: none; }
    .go-card .gt { flex: 1; min-width: 0; } .go-card b { display: block; font-family: var(--font-head); font-size: 1.2rem; } .go-card small { opacity: .92; font-size: .8rem; }
    .go-card .ga { font-size: 1.5rem; }
    /* kpis */
    .pkpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
    .pk { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
    .pk .v { font-family: var(--font-mono); font-size: 1.8rem; font-weight: 600; line-height: 1.15; } .pk .l { font-weight: 600; font-size: .86rem; } .pk .s { font-size: .76rem; color: var(--muted); }
    .pk.warn { box-shadow: inset 0 -3px 0 var(--warn); } .pk.warn .v { color: #8a5d05; } .pk.ok .v { color: var(--ok-ink); }
    @media (max-width: 860px) { .pkpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    /* system cards */
    .psystems { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 16px; }
    .psys { display: flex; flex-direction: column; gap: 14px; }
    .ps-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .ps-ic { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 13px; font-size: 1.5rem; flex: none; }
    .ps-ic.food { background: var(--brand-soft); } .ps-ic.mech { background: #FFF1DD; }
    .ps-t { flex: 1; min-width: 160px; } .ps-t h2 { margin: 0; font-size: 1.3rem; }
    .pflow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
    .pflow li { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 10px 10px 12px; border-radius: 12px; background: var(--surface-2); min-width: 0; }
    .pflow li:not(:last-child)::after { content: "›"; position: absolute; right: -6px; top: 12px; color: var(--muted); z-index: 1; }
    .pflow li.hot { background: var(--warn-soft); } .pflow li:last-child { background: var(--ok-soft); }
    .pf-n { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 600; line-height: 1.1; } .pf-l { font-size: .74rem; color: var(--ink-2); line-height: 1.25; }
    .pf-bar { height: 4px; border-radius: 2px; background: rgba(16,35,31,.08); margin-top: 6px; overflow: hidden; } .pf-bar i { display: block; height: 100%; background: var(--brand); }
    @media (max-width: 560px) { .pflow { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pflow li::after { display: none; } .pflow li:last-child { grid-column: span 2; } }
    .pms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .pm { padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; } .pm b { display: block; font-family: var(--font-mono); font-size: 1.05rem; font-weight: 600; } .pm span { font-size: .74rem; color: var(--muted); }
    @media (max-width: 560px) { .pms { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .banner-s { padding: 8px 12px; border-radius: 10px; font-size: .84rem; } .banner-s.red { background: var(--danger-soft); color: var(--danger-ink); } .banner-s.blue { background: var(--blue-soft); color: var(--blue); }
    .ps-sub h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: .95rem; }
    .pwait { list-style: none; margin: 0; padding: 0; }
    .pwait li { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; } .pwait li:last-child { border-bottom: 0; }

  }
