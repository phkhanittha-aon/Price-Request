<!--
  File: PageTicket.html
  Ticket detail: header, workflow action buttons (from server permissions), items + price comparison,
  document checklist, attachments (upload / open / delete), traceability timeline.
-->
<script>
Pages.ticket = (function () {
  /** UI for each workflow action. Server re-checks every rule; this only shapes the dialog. */
  const ACTION_UI = {
    manager_approve: { label: 'อนุมัติ (Sales Manager)', cls: 'primary', comment: 'optional', confirm: 'ยืนยันอนุมัติใบ {no} ส่งต่อให้ GM?' },
    manager_return: { label: 'ส่งกลับให้แก้ไข', cls: '', comment: 'required', commentLabel: 'สิ่งที่ต้องการให้ Sales แก้ไข' },
    manager_reject: { label: 'ไม่อนุมัติ', cls: 'danger', comment: 'required', commentLabel: 'เหตุผลที่ไม่อนุมัติ', confirm: 'ไม่อนุมัติใบ {no}? ใบจะถูกปิดและแก้ไขต่อไม่ได้' },
    gm_approve: { label: '✅ อนุมัติฝั่งขาย', cls: 'primary', comment: 'optional', confirm: 'อนุมัติฝั่งขาย: อนุมัติคำขอราคาใบ {no} ส่งต่อให้ SR หาราคา?' },
    gm_reject: { label: 'ไม่อนุมัติฝั่งขาย', cls: 'danger', comment: 'required', commentLabel: 'เหตุผลที่ไม่อนุมัติ', confirm: 'ไม่อนุมัติคำขอราคาใบ {no}? ใบจะถูกปิด' },
    claim: { label: '✅ รับงาน', cls: 'primary', comment: 'none', confirm: 'รับงานใบ {no}? ระบบจะบันทึกคุณเป็น SR ผู้รับผิดชอบ' },
    queue_return: { label: '↩ ตีกลับ — ข้อมูลไม่ครบ', cls: 'danger', comment: 'required', commentLabel: 'ข้อมูลที่ขาด / สิ่งที่ต้องการให้ Sales เพิ่ม', fields: true,
      confirm: 'ส่งใบ {no} กลับให้ Sales เพิ่มข้อมูล — เมื่อ Sales ตอบ งานจะกลับเข้าคิวรอรับงาน' },
    assign: { label: 'มอบหมาย SR', cls: '', comment: 'optional', select: 'sr' },
    srm_approve: { label: 'อนุมัติราคา (SR Manager)', cls: 'primary', comment: 'optional', confirm: 'ยืนยันราคาใบ {no} ส่งต่อให้ GM อนุมัติฝั่งซื้อ?' },
    srm_return: { label: 'ส่งกลับให้ SR แก้ราคา', cls: '', comment: 'required', commentLabel: 'สิ่งที่ต้องการให้ SR แก้ไข' },
    gm_price_approve: { label: '✅ อนุมัติฝั่งซื้อ', cls: 'primary', comment: 'optional', confirm: 'อนุมัติฝั่งซื้อ: อนุมัติราคาซื้อและราคาขายใบ {no} แล้วส่งราคาขายถึง Sales?' },
    gm_price_return: { label: 'ส่งกลับให้ SR แก้ราคา', cls: '', comment: 'required', commentLabel: 'สิ่งที่ต้องการให้ SR แก้ไข' },
    request_info: { label: 'ขอข้อมูลเพิ่มจาก Sales', cls: '', comment: 'required', commentLabel: 'ข้อมูล/เอกสารที่ต้องการ', checklist: true },
    respond_info: { label: 'ส่งข้อมูลเพิ่มให้ SR', cls: 'primary', comment: 'required', commentLabel: 'คำตอบ / รายละเอียดที่ส่งเพิ่ม (แนบไฟล์ด้านล่างก่อนกดส่ง)' },
    accept: { label: 'รับทราบและตกลงราคา (ปิดงาน)', cls: 'primary', comment: 'optional', confirm: 'ยืนยันรับทราบราคาและปิดใบ {no}?' },
    request_revision: { label: 'ขอให้ SR ปรับราคา', cls: '', comment: 'required', commentLabel: 'สิ่งที่ต้องการให้ปรับ' },
    resubmit: { label: 'ส่งให้ Manager อีกครั้ง', cls: 'primary', comment: 'optional', confirm: 'ส่งใบ {no} ให้ Manager พิจารณาอีกครั้ง?' },
    cancel: { label: 'ยกเลิกใบขอราคา', cls: 'danger', comment: 'optional', commentLabel: 'เหตุผลที่ยกเลิก', confirm: 'ยกเลิกใบ {no}? ยกเลิกแล้วเปิดใหม่ไม่ได้' }
  };
  const CATEGORY_LABEL = { request: 'เอกสารประกอบคำขอ', info_response: 'ข้อมูลเพิ่มเติม', quotation: 'ใบเสนอราคา vendor', other: 'อื่นๆ' };

  function header(d) {
    const t = d.ticket;
    return '<div class="page-head"><h1>' + esc(t.ticket_no) + ' · ' + esc(t.title) + '</h1>' +
      statusBadge(t.status, t.status_label) + '<span class="badge">' + esc(t.stage_label) + '</span></div>' +
      '<div class="card"><dl class="kv">' +
      '<dt>ผู้ขอราคา</dt><dd>' + esc(t.requestor_name) + ' <span class="muted small">(' + esc(t.department_code) + ')</span></dd>' +
      '<dt>ลูกค้า (Customer)</dt><dd>' + esc(t.customer_name || '–') + '</dd>' +
      '<dt>กลุ่มลูกค้า</dt><dd>' + esc(t.customer_group || '–') + '</dd>' +
      '<dt>ประเทศปลายทาง</dt><dd>' + esc(t.destination_country || 'ไทย') + '</dd>' +
      '<dt>วันที่ต้องการให้ตอบกลับราคา</dt><dd>' + esc(fmtDate(t.due_date)) + (t.priority !== 'normal' ? ' · ' + prioText(t.priority) : '') + '</dd>' +
      '<dt>เอกสารที่ต้องการประกอบ</dt><dd>' + esc(t.documents_needed || 'ไม่ต้องการเอกสารประกอบ') + '</dd>' +
      '<dt>SR ผู้รับงาน</dt><dd>' + esc(t.sr_name || '–') + '</dd>' +
      '<dt>สร้างเมื่อ</dt><dd>' + esc(fmtDateTime(t.created_at)) + '</dd>' +
      (t.revision_count ? '<dt>ขอแก้ราคา</dt><dd>' + t.revision_count + ' ครั้ง</dd>' : '') +
      (t.rejection_reason ? '<dt>เหตุผล</dt><dd>' + esc(t.rejection_reason) + '</dd>' : '') +
      (t.description ? '<dt>หมายเหตุ (Remark)</dt><dd style="white-space:pre-wrap">' + esc(t.description) + '</dd>' : '') +
      '</dl></div>';
  }

  /** What SR checks before accepting a job: is the request complete enough to quote? */
  function completeness(d) {
    const t = d.ticket;
    const pics = function (it) { return d.attachments.filter(function (a) { return a.item_id === it.item_id; }).length; };
    const noSpec = d.items.filter(function (it) { return !it.net_weight || !it.size || !it.packing_size || !(it.qty > 0); });
    const noPic = d.items.filter(function (it) { return !pics(it); });
    const daysLeft = t.due_date ? Math.round((new Date(t.due_date + 'T00:00:00') - new Date(todayYmd(0) + 'T00:00:00')) / 86400000) : null;
    return [
      { ok: !!(t.customer_name && t.customer_group), label: 'ลูกค้า + กลุ่มลูกค้า', detail: [t.customer_name, t.customer_group, t.destination_country].filter(Boolean).join(' · '), key: 'ประเทศปลายทาง / กลุ่มลูกค้า' },
      { ok: !noSpec.length, label: 'สเปกครบทุกรายการ (NW · Size · Packing · ปริมาณ)', detail: noSpec.length ? 'ไม่ครบ: ' + noSpec.map(function (it) { return '#' + it.line_no; }).join(', ') : d.items.length + ' รายการ', key: 'สเปก / Grade / ขนาด' },
      { ok: !noPic.length, label: 'รูปภาพสินค้า', detail: noPic.length ? 'ไม่มีรูป: ' + noPic.map(function (it) { return '#' + it.line_no; }).join(', ') : 'มีรูปครบ', key: 'รูปภาพสินค้า', warn: true },
      { ok: true, label: 'เอกสารที่ลูกค้าต้องการ', detail: t.documents_needed || 'ไม่ต้องการเอกสาร', key: 'เอกสารที่ต้องการ' },
      { ok: daysLeft == null || daysLeft >= 2, label: 'เวลาหาราคา', detail: daysLeft == null ? '–' : 'เหลือ ' + daysLeft + ' วัน (ต้องการ ' + fmtDate(t.due_date) + ')', key: 'วันที่ต้องการ (เร็วเกินไป)', warn: true }
    ];
  }
  function queueCheck(d) {
    const rows = completeness(d);
    const bad = rows.filter(function (r) { return !r.ok && !r.warn; }).length;
    const warn = rows.filter(function (r) { return !r.ok && r.warn; }).length;
    return '<div class="notice qcheck"><b>งานใหม่ในคิว — ตรวจความครบถ้วนก่อนรับงาน</b><ul>' + rows.map(function (r) {
      return '<li class="' + (r.ok ? 'ok' : (r.warn ? 'warn' : 'bad')) + '">' + (r.ok ? '✓' : '⚠') + ' ' + esc(r.label) + ' <span class="small muted">— ' + esc(r.detail) + '</span></li>';
    }).join('') + '</ul><div class="small">' + (bad ? 'ข้อมูลยังไม่ครบ ' + bad + ' ข้อ → กด <b>↩ ตีกลับ</b> ให้ Sales เพิ่มข้อมูล' :
      warn ? 'ข้อมูลหลักครบ แต่มี ' + warn + ' ข้อที่ควรดู (⚠) → รับงานได้ หรือกด <b>↩ ตีกลับ</b> ถ้าจำเป็นต้องมี' : 'ข้อมูลครบ → กด <b>✅ รับงาน</b>') + '</div></div>';
  }

  function notices(d) {
    const t = d.ticket;
    let html = '';
    if (t.stage === 'need_info' && t.info_request) {
      const labels = (t.info_request.items || []).map(function (k) {
        const c = d.checklist.filter(function (x) { return x.item_key === k || x.check_id === k; })[0];
        return c ? c.label : k;
      });
      const fromQueue = t.info_request.return_stage === 'pending_assign';
      html += '<div class="notice warn"><b>' + (fromQueue ? 'SR ตีกลับ — ข้อมูลไม่ครบ:' : 'SR ขอข้อมูลเพิ่ม:') + '</b> ' + esc(t.info_request.comment) +
        (labels.length ? '<div class="small">รายการที่ขาด: ' + esc(labels.join(', ')) + '</div>' : '') + '</div>';
    }
    if (t.stage === 'returned') html += '<div class="notice warn">Sales Manager ส่งกลับให้แก้ไข — ดูเหตุผลใน Timeline ด้านล่าง แล้วกด “แก้ไขใบขอราคา”</div>';
    if (t.stage === 'pending_sr_manager') html += '<div class="notice">SR ส่งราคาแล้ว — รอ SR Manager ตรวจราคา แล้วส่งให้ GM อนุมัติ</div>';
    if (d.parent) html += '<div class="notice side-follow">📌 ใบส่งราคาตามหลัง — แยกมาจาก <a href="#" data-goto="' + esc(d.parent.ticket_id) + '">' + esc(d.parent.ticket_no) + '</a></div>';
    if (d.follow_ups && d.follow_ups.length) {
      html += '<div class="notice side-follow">📌 มีรายการส่งราคาตามหลัง: ' + d.follow_ups.map(function (c) {
        return '<a href="#" data-goto="' + esc(c.ticket_id) + '">' + esc(c.ticket_no) + '</a> <span class="small muted">(' + esc(c.stage_label) + ')</span>';
      }).join(' · ') + '</div>';
    }
    if (t.stage === 'pending_assign' && (d.me.role === 'sr' || d.me.role === 'sr_manager')) html += queueCheck(d);
    const isGm = d.me.role === 'gm';
    if (t.stage === 'pending_gm') {
      html += '<div class="notice side-sales"><b>🛒 อนุมัติฝั่งขาย</b>' + (isGm ? ' — ตรวจคำขอของ Sales: ลูกค้า สินค้า ปริมาณ และราคาที่ลูกค้าคาดหวัง ก่อนส่งให้ SR หาราคา' : ' — รอ GM อนุมัติคำขอราคา') + '</div>';
    }
    if (t.stage === 'pending_gm_price') {
      html += '<div class="notice side-buy"><b>📦 อนุมัติฝั่งซื้อ</b>' + (isGm ? ' — ตรวจราคาซื้อจาก vendor, ต้นทุนถึงคลัง, GP และราคาขาย (SR Manager ตรวจแล้ว) ก่อนส่งราคาขายถึง Sales' : ' — SR Manager อนุมัติแล้ว รอ GM อนุมัติราคา') + '</div>';
    }
    if (t.stage === 'awaiting_sales_ack') html += '<div class="notice">' + (d.me.role === 'sales' ? 'GM อนุมัติราคาแล้ว — ตรวจราคาขายด้านล่าง แล้วกดรับทราบ หรือขอให้ปรับราคา' : 'ส่งราคาขายถึง Sales แล้ว — รอ Sales รับทราบ') + '</div>';
    return html;
  }

  function actionBar(d) {
    const t = d.ticket;
    const p = d.permissions;
    const buttons = [];
    if (p.can_edit_request) buttons.push('<button class="btn" data-nav="edit">✏️ แก้ไขใบขอราคา</button>');
    if (d.me.role === 'sales' && t.requestor_email === d.me.email) buttons.push('<button class="btn" data-copy>📄 สร้างใบใหม่จากใบนี้</button>');
    const srWork = p.actions.indexOf('doc_complete') !== -1 || p.actions.indexOf('submit_quote') !== -1;
    if (srWork) buttons.push('<button class="btn primary" data-nav="pricing">' + (t.stage === 'doc_check' ? '📋 ตรวจเอกสาร' : '💰 กรอกราคา / เทียบราคา') + '</button>');
    // SR Manager / GM may fix the price in their own approval step, then approve
    if (p.can_edit_quotes && (t.stage === 'pending_sr_manager' || t.stage === 'pending_gm_price')) buttons.push('<button class="btn" data-nav="pricing">✏️ แก้ไขราคา</button>');
    p.actions.forEach(function (a) {
      const ui = ACTION_UI[a];
      if (ui) buttons.push('<button class="btn ' + ui.cls + '" data-action="' + a + '">' + esc(ui.label) + '</button>');
    });
    if (!buttons.length) return '';
    return '<div class="card"><div class="actions">' + buttons.join('') + '</div></div>';
  }

  function itemsHtml(d) {
    const showQ = d.permissions.can_view_quotes;
    return '<div class="card"><h3>รายการสินค้า (' + d.items.length + ')</h3>' + d.items.map(function (it) {
      let html = '<div class="item-row"><div class="head"><span>#' + it.line_no + ' ' + esc(it.product_name) + '</span><span class="sep"></span>' +
        '<span class="badge">' + esc(it.product_group_name) + '</span></div>' +
        '<dl class="kv small" style="margin-top:6px">' +
        '<dt>% Net Weight</dt><dd>' + esc(it.net_weight || '–') + '</dd><dt>ขนาด (Size)</dt><dd>' + esc(it.size || '–') + '</dd>' +
        '<dt>แพคย่อย (Packing Size)</dt><dd>' + esc(it.packing_size || '–') + '</dd>' +
        '<dt>ปริมาณต่อเดือน</dt><dd><b>' + fmtNum(it.qty) + ' ' + esc(it.uom) + '</b></dd>' +
        '<dt>ราคาที่ลูกค้าคาดหวัง</dt><dd>' + (it.target_price ? fmtMoney(it.target_price) + ' บาท/' + esc(it.uom) : 'ลูกค้ายังไม่ระบุ') + '</dd></dl>' +
        picturesHtml(d, it) +
        (it.spec ? '<div class="small">Spec: ' + esc(it.spec) + '</div>' : '') +
        (it.description ? '<div class="small muted" style="white-space:pre-wrap">' + esc(it.description) + '</div>' : '');
      if (it.quote_status) {
        html += itemStatusHtml(it);
      } else if (showQ && it.quotations.length) {
        html += '<div class="tbl-wrap" style="margin-top:8px"><table class="tbl stack"><thead><tr><th>Vendor</th><th class="num">ราคา/หน่วย</th>' +
          '<th>VAT</th><th class="num">ต้นทุนสินค้า/หน่วย (฿)</th><th class="num">ค่าเคลียร์ของ/หน่วย (฿)</th><th class="num">ต้นทุนถึงคลัง/หน่วย (฿)</th><th>เงื่อนไข</th></tr></thead><tbody>' +
          it.quotations.slice().sort(function (a, b) { return a.cost_rank - b.cost_rank; }).map(function (q) {
            return '<tr' + (q.is_selected ? ' style="background:#EEF7F3"' : '') + '><td class="main">' + esc(q.vendor_name) + ' ' +
              (q.is_selected ? '<span class="badge tag-win">✔ ผู้ชนะ</span> ' : '') + (q.is_cheapest ? '<span class="badge tag-cheap">ถูกที่สุด</span>' : '') +
              (q.supplier_warnings || []).map(function (w) { return ' <span class="sla ' + (w.level === 'expired' ? 'breach' : 'warning') + '">⚠ ' + esc(w.name) + (w.level === 'expired' ? ' หมดอายุ' : ' ใกล้หมดอายุ') + '</span>'; }).join('') +
              (q.is_selected && q.selection_reason ? '<div class="small muted">เหตุผล: ' + esc(q.selection_reason) + '</div>' : '') + '</td>' +
              '<td class="num" data-label="ราคา/หน่วย">' + fmtNum(q.unit_price) + ' ' + esc(q.currency) + (q.currency !== 'THB' ? '<div class="small muted">@' + fmtNum(q.fx_rate) + '</div>' : '') + '</td>' +
              '<td data-label="VAT">' + esc(vatLabel(q.vat_term)) + '</td>' +
              '<td class="num" data-label="ต้นทุนสินค้า/หน่วย">' + fmtMoney(q.net_unit_cost_thb) + '</td>' +
              '<td class="num" data-label="ค่าเคลียร์ของ/หน่วย">' + fmtMoney(q.clearance_thb || 0) + '</td>' +
              '<td class="num" data-label="ต้นทุนถึงคลัง/หน่วย"><b>' + fmtMoney(q.landed_unit_cost_thb) + '</b></td>' +
              '<td data-label="เงื่อนไข" class="small">' + [q.brand, q.origin_country ? 'Origin ' + q.origin_country : '', incoLabel(q.incoterm), q.packing,
                q.shelf_life ? 'อายุ ' + q.shelf_life : '', q.moq != null ? 'MOQ ' + fmtNum(q.moq) : '', q.lead_time_days != null ? 'Lead ' + q.lead_time_days + ' วัน' : '',
                q.payment_term, q.valid_until ? 'ยืนราคาถึง ' + fmtDate(q.valid_until) : ''].filter(Boolean).map(esc).join(' · ') + '</td></tr>';
          }).join('') + '</tbody></table></div>' + photoReviewHtml(d, it) + sellHtml(it);
      } else if (!showQ && it.sales_pricing) {
        html += salesSellHtml(it);
      } else if (!showQ && ['on_process'].indexOf(d.ticket.status) !== -1) {
        html += '<div class="small muted" style="margin-top:6px">ราคาขายจะแสดงเมื่อ GM อนุมัติราคาแล้ว</div>';
      }
      return html + '</div>';
    }).join('') + '</div>';
  }

  /** Selling price per unit (server-computed in it.pricing): product cost + clearance = landed; + GP = selling price. */
  function sellHtml(it) {
    const p = it.pricing;
    if (!p || p.sell_price_thb == null) return '';
    const u = 'บาท/' + esc(it.uom);
    const diff = p.target_diff_pct == null ? u : (p.target_diff_pct > 0 ? '<span class="sla breach">▲ สูงกว่าเป้า ' + fmtNum(p.target_diff_pct) + '%</span>' :
      '<span class="sla ok">✓ ' + (p.target_diff_pct < 0 ? 'ต่ำกว่าเป้า ' + fmtNum(-p.target_diff_pct) + '%' : 'เท่าราคาเป้า') + '</span>');
    return '<div class="sell"><h4>ราคาขาย (ต่อหน่วย) · ' + esc(p.vendor_name) + '</h4><table class="tbl costtbl"><tbody>' +
      '<tr><td>ต้นทุนสินค้า</td><td class="num">' + fmtMoney(p.product_cost_thb) + '</td><td class="u">' + u + '</td></tr>' +
      '<tr><td>+ ค่าเคลียร์ของ</td><td class="num">' + fmtMoney(p.clearance_thb) + '</td><td class="u">' + u + '</td></tr>' +
      '<tr class="sub"><td>= ต้นทุนถึงคลัง</td><td class="num">' + fmtMoney(p.landed_cost_thb) + '</td><td class="u">' + u + '</td></tr>' +
      '<tr><td>+ กำไร GP ' + fmtNum(p.gp_percent) + '%' + (p.gp_is_default ? ' <span class="small muted">(ค่าเริ่มต้น)</span>' : '') + '</td><td class="num">' + fmtMoney(p.profit_thb) + '</td><td class="u">' + u + '</td></tr>' +
      '<tr class="total"><td>= ราคาขาย</td><td class="num">' + fmtMoney(p.sell_price_thb) + '</td><td class="u">' + u + '</td></tr>' +
      '<tr class="ref"><td>ราคาที่ลูกค้าคาดหวัง</td><td class="num">' + (p.target_price ? fmtMoney(p.target_price) : 'ไม่มี') + '</td><td class="u">' + diff + '</td></tr>' +
      '</tbody></table></div>';
  }

  /** Item the SR answered without a price: not offered (reason) or sent later as its own ticket. */
  function itemStatusHtml(it) {
    if (it.quote_status === 'follow_up') {
      return '<div class="istat follow"><b>📌 ส่งราคาตามหลัง</b>' + (it.follow_up ? ' — แยกเป็นใบ <a href="#" data-goto="' + esc(it.follow_up.ticket_id) + '">' +
        esc(it.follow_up.ticket_no) + '</a> <span class="small muted">(' + esc(it.follow_up.stage_label) + ')</span>' : '') +
        (it.quote_status_reason ? '<div class="small">เหตุผล: ' + esc(it.quote_status_reason) + '</div>' : '') + '</div>';
    }
    return '<div class="istat no"><b>✕ ไม่เสนอราคา</b>' + (it.quote_status_reason ? '<div class="small">เหตุผล: ' + esc(it.quote_status_reason) + '</div>' : '') + '</div>';
  }

  /** Sales side: selling price per unit + offer terms only (the server sends no cost / vendor / GP). */
  function salesSellHtml(it) {
    const p = it.sales_pricing;
    const u = 'บาท/' + esc(it.uom);
    const diff = p.target_diff_pct == null ? '' : (p.target_diff_pct > 0 ? '<span class="sla breach">▲ สูงกว่าเป้า ' + fmtNum(p.target_diff_pct) + '%</span>' :
      '<span class="sla ok">✓ ' + (p.target_diff_pct < 0 ? 'ต่ำกว่าเป้า ' + fmtNum(-p.target_diff_pct) + '%' : 'เท่าราคาเป้า') + '</span>');
    const terms = [p.brand ? 'แบรนด์ ' + p.brand : '', p.origin_country ? 'Origin ' + p.origin_country : '', p.packing,
      p.shelf_life ? 'อายุ ' + p.shelf_life : '', p.moq != null ? 'MOQ ' + fmtNum(p.moq) : '', p.lead_time_days != null ? 'Lead ' + p.lead_time_days + ' วัน' : '']
      .filter(Boolean).map(esc).join(' · ');
    return '<div class="sell sales-sell"><div class="sell-price"><span class="lbl">ราคาขาย</span><b>' + fmtMoney(p.sell_price_thb) + '</b> <span class="u">' + u + '</span></div>' +
      '<dl class="kv small"><dt>ราคาที่ลูกค้าคาดหวัง</dt><dd>' + (p.target_price ? fmtMoney(p.target_price) + ' ' + u + ' ' + diff : 'ไม่มี') + '</dd>' +
      (p.valid_until ? '<dt>ยืนราคาถึง</dt><dd>' + esc(fmtDate(p.valid_until)) + '</dd>' : '') +
      (terms ? '<dt>รายละเอียดสินค้า</dt><dd>' + terms + '</dd>' : '') + '</dl></div>';
  }

  function incoLabel(k) {
    if (!k) return '';
    const v = (state.ref.incoterms || []).filter(function (x) { return x.key === k; })[0];
    return v ? v.label : k;
  }

  /** Supplier product photos per offer (winner first) — what SR Manager / GM look at before approving. */
  function photoReviewHtml(d, it) {
    const rows = it.quotations.slice().sort(function (a, b) { return (b.is_selected - a.is_selected) || (a.cost_rank - b.cost_rank); })
      .map(function (q) { return { q: q, list: Photos.of(d.attachments, q.quote_id) }; })
      .filter(function (r) { return r.list.length; });
    if (!rows.length) return '<div class="small muted" style="margin-top:6px">📷 ยังไม่มีรูปสินค้าจาก Supplier</div>';
    return '<div class="prev-photos"><h4>📷 รูปสินค้าจาก Supplier</h4>' + rows.map(function (r) {
      return '<div class="prev-row' + (r.q.is_selected ? ' win' : '') + '"><div class="small"><b>' + esc(r.q.vendor_name) + '</b>' +
        (r.q.is_selected ? ' <span class="badge tag-win">✔ ผู้ชนะ</span>' : '') + '</div>' +
        Photos.html(r.list, { quoteId: r.q.quote_id, editable: false, compact: true }) + '</div>';
    }).join('') + '</div>';
  }

  function picturesHtml(d, it) {
    const pics = d.attachments.filter(function (a) { return a.item_id === it.item_id && a.category !== 'quote_photo'; });
    if (!pics.length) return '';
    return '<div class="small" style="margin-top:4px">รูปภาพสินค้า: ' + pics.map(function (a) {
      return '<a href="#" data-open="' + esc(a.attachment_id) + '">' + (/^image\//.test(a.mime_type) ? '🖼️ ' : '📄 ') + esc(a.file_name) + '</a>';
    }).join(' · ') + '</div>';
  }

  function vatLabel(k) {
    const v = (state.ref.vat_terms || []).filter(function (x) { return x.key === k; })[0];
    return v ? v.label : k;
  }

  function checklistHtml(d) {
    if (!d.checklist.length) return '';
    const done = d.checklist.filter(function (c) { return c.is_checked; }).length;
    return '<div class="card"><h3>ตรวจเอกสาร (' + done + '/' + d.checklist.length + ')</h3><ul style="margin:0;padding-left:0;list-style:none">' +
      d.checklist.map(function (c) {
        return '<li style="padding:4px 0">' + (c.is_checked ? '✅' : '⬜') + ' ' + esc(c.label) + (c.is_required ? '' : ' <span class="muted small">(ไม่บังคับ)</span>') +
          (c.note ? '<div class="small muted" style="margin-left:26px">' + esc(c.note) + '</div>' : '') + '</li>';
      }).join('') + '</ul></div>';
  }

  function attachmentsHtml(d) {
    const p = d.permissions;
    const files = d.attachments.filter(function (a) { return a.category !== 'quote_photo'; });   // supplier photos: gallery per offer above
    const nPhotos = d.attachments.length - files.length;
    let html = '<div class="card"><h3>ไฟล์แนบ (' + files.length + ')</h3>';
    if (!files.length) html += '<div class="muted small">ยังไม่มีไฟล์แนบ</div>';
    if (nPhotos) html += '<div class="small muted" style="margin-bottom:6px">📷 รูปสินค้าจาก Supplier ' + nPhotos + ' รูป แสดงใต้ตารางเทียบราคาของแต่ละรายการ</div>';
    html += files.map(function (a) {
      const mine = a.uploaded_by === state.me.email;
      return '<div class="actions" style="align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">' +
        '<span>📎 <a href="#" data-open="' + esc(a.attachment_id) + '">' + esc(a.file_name) + '</a> <span class="small muted">' +
        fileSize(a.size_bytes) + ' · ' + esc(CATEGORY_LABEL[a.category] || a.category) + ' · ' + esc(fmtDateTime(a.uploaded_at)) + '</span></span><span class="sep"></span>' +
        (mine && p.can_upload ? '<button class="btn sm danger" data-del="' + esc(a.attachment_id) + '">ลบ</button>' : '') + '</div>';
    }).join('');
    if (p.can_upload) {
      const cat = d.ticket.stage === 'need_info' ? 'info_response' : (state.me.role === 'sr' ? 'quotation' : 'request');
      html += '<div style="margin-top:12px"><label class="btn"><input type="file" id="att-input" multiple hidden ' +
        'accept=".pdf,.jpg,.jpeg,.png,.webp,.heic,.xls,.xlsx,.csv">➕ แนบไฟล์ (PDF/รูป/Excel ≤ ' + state.ref.max_upload_mb + ' MB)</label>' +
        '<input type="hidden" id="att-cat" value="' + cat + '"><div id="att-progress"></div></div>';
    }
    return html + '</div>';
  }

  const FIELD_LABEL = {
    title: 'ชื่อเรื่อง', description: 'รายละเอียด', customer_name: 'ลูกค้า', priority: 'ความเร่งด่วน', due_date: 'วันที่ต้องการ',
    product_group_code: 'กลุ่มสินค้า', product_name: 'ชื่อสินค้า', spec: 'Spec', qty: 'จำนวน', uom: 'หน่วย', target_price: 'ราคาที่ลูกค้าคาดหวัง',
    target_currency: 'สกุลเงินเป้าหมาย', vendor_id: 'รหัส vendor', vendor_name: 'Vendor', unit_price: 'ราคาต่อหน่วย', currency: 'สกุลเงิน',
    fx_rate: 'อัตราแลกเปลี่ยน', vat_term: 'VAT', vat_rate: 'อัตรา VAT', moq: 'MOQ', lead_time_days: 'Lead time (วัน)', payment_term: 'เงื่อนไขชำระเงิน',
    valid_until: 'ยืนราคาถึง', remark: 'หมายเหตุ', clearance_thb: 'ค่าเคลียร์ของ (บาท/หน่วย)', gp_percent: 'GP %', attachment_file_id: 'ไฟล์ใบเสนอราคา', is_checked: 'ติ๊กแล้ว', note: 'หมายเหตุ'
  };
  function showVal(k, v) {
    if (v === true) return 'ใช่';
    if (v === false) return 'ไม่';
    if (v === '' || v == null) return '(ว่าง)';
    if (k === 'vat_term') return vatLabel(v);
    if (k === 'product_group_code') return groupName(v);
    return String(v);
  }

  function timelineHtml(d) {
    const dataCount = d.timeline.filter(function (l) { return l.log_type !== 'transition'; }).length;
    return '<div class="card"><h3>Timeline (ประวัติการทำรายการ)</h3>' +
      (dataCount ? '<label class="small" style="display:flex;gap:8px;align-items:center;min-height:36px;margin-bottom:8px">' +
        '<input type="checkbox" id="tl-data"> แสดงการแก้ไขข้อมูลด้วย (' + dataCount + ' รายการ)</label>' : '') +
      '<ul class="timeline" id="tl">' + d.timeline.slice().reverse().map(function (l) {
        const isTransition = l.log_type === 'transition';
        const m = l.metadata || {};
        let detail = '';
        if (isTransition) {
          detail = esc(l.from_stage ? stageText(l.from_stage) + ' → ' + stageText(l.to_stage) : '→ ' + stageText(l.to_stage));
          if (m.from_sr !== undefined && m.to_sr) detail += '<div>มอบหมายให้ ' + esc(m.to_sr) + '</div>';
        } else {
          const added = m.quote && m.quote.vendor_name ? m.quote.vendor_name['new'] || m.quote.vendor_name : '';
          const itemName = m.item && m.item.product_name ? ' ' + m.item.product_name : '';
          const subject = m.label || m.vendor_name || added || m.file_name || (m.line_no ? 'รายการที่ ' + m.line_no + itemName : '');
          if (subject) detail += '<div>' + esc(subject) + '</div>';
          if (m.diff) {
            detail += Object.keys(m.diff).map(function (k) {
              return '<div>' + esc(FIELD_LABEL[k] || k) + ': ' + esc(showVal(k, m.diff[k].old)) + ' → <b>' + esc(showVal(k, m.diff[k]['new'])) + '</b></div>';
            }).join('');
          }
          if (m.reason) detail += '<div>เหตุผล: ' + esc(m.reason) + '</div>';
        }
        return '<li class="' + (isTransition ? '' : 'data') + '"' + (isTransition ? '' : ' data-kind="data" hidden') + '><div><b>' + esc(l.action_label) + '</b> · ' + esc(l.actor_name) +
          ' <span class="muted small">(' + esc(l.actor_role) + ')</span></div><div class="meta">' + esc(l.ts_bkk) +
          (l.stage_duration_sec != null && isTransition && l.from_stage ? ' · อยู่ในขั้นตอนก่อนหน้า ' + esc(fmtHours(l.stage_duration_sec / 3600)) : '') + '</div>' +
          (detail ? '<div class="small">' + detail + '</div>' : '') +
          (l.comment ? '<div class="cmt">' + esc(l.comment) + '</div>' : '') + '</li>';
      }).join('') + '</ul></div>';
  }

  function runAction(view, d, action) {
    const t = d.ticket;
    const ui = ACTION_UI[action];
    let html = '';
    if (ui.select === 'sr') {
      html = '<label class="field"><span>มอบหมายให้ SR <span class="req">*</span></span><select id="dlg-sr"><option value="">— เลือก SR —</option>' +
        state.ref.sr_users.filter(function (u) { return u.email !== t.sr_email; })
          .map(function (u) { return '<option value="' + esc(u.email) + '">' + esc(u.full_name) + '</option>'; }).join('') + '</select></label>';
    }
    if (ui.fields) {
      const auto = completeness(d).filter(function (r) { return !r.ok; }).map(function (r) { return r.key; });
      const REQ_FIELDS = ['รูปภาพสินค้า', 'สเปก / Grade / ขนาด', '% Net Weight', 'Packing', 'ปริมาณ', 'ราคาที่ลูกค้าคาดหวัง', 'เอกสารที่ต้องการ',
        'ประเทศปลายทาง / กลุ่มลูกค้า', 'วันที่ต้องการ (เร็วเกินไป)', 'อื่นๆ (ระบุในเหตุผล)'];
      html = '<p class="small">เลือกข้อมูลที่ยังขาด (ระบบติ๊กให้ตามที่ตรวจพบ)</p><div class="miss-grid">' + REQ_FIELDS.map(function (f) {
        return '<label class="chk-inline"><input type="checkbox" class="dlg-miss" value="' + esc(f) + '"' + (auto.indexOf(f) !== -1 ? ' checked' : '') + '> ' + esc(f) + '</label>';
      }).join('') + '</div>';
    }
    if (ui.checklist && d.checklist.length) {
      html = '<p class="small">เลือกเอกสารที่ยังขาด (ถ้ามี)</p>' + d.checklist.map(function (c) {
        return '<label style="display:flex;gap:8px;align-items:center;min-height:36px"><input type="checkbox" class="dlg-miss" value="' + esc(c.item_key) + '"' +
          (c.is_checked ? '' : ' checked') + '> ' + esc(c.label) + '</label>';
      }).join('');
    }
    dialog({
      title: ui.label, message: (ui.confirm || '').replace('{no}', t.ticket_no), html: html,
      comment: ui.comment, commentLabel: ui.commentLabel, danger: ui.cls === 'danger', confirmText: ui.label,
      validate: function (root) { if (ui.select === 'sr' && !$('#dlg-sr', root).value) return 'กรุณาเลือก SR'; return null; }
    }).then(function (res) {
      if (!res) return;
      const payload = { expected_version: t.version };
      if (ui.select === 'sr') payload.sr_email = $('#dlg-sr', res.root).value;
      if (ui.checklist || ui.fields) payload.missing_items = $all('.dlg-miss', res.root).filter(function (x) { return x.checked; }).map(function (x) { return x.value; });
      toast('กำลังบันทึก...');
      api('transitionTicket', t.ticket_id, action, res.comment, payload).then(function (r) {
        toast(ui.label + ' สำเร็จ — ' + r.ticket.ticket_no + ' : ' + r.ticket.stage_label, 'ok');
        refreshPoll();
        load(view, t.ticket_id);
      }).catch(function (e) {
        toast(e.error, 'err');
        if (e.code === 'VERSION_CONFLICT') load(view, t.ticket_id);
      });
    });
  }

  function bind(view, d) {
    const t = d.ticket;
    Photos.bind(view, { attachments: function () { return d.attachments; } });
    $all('[data-action]', view).forEach(function (b) { b.onclick = function () { runAction(view, d, b.getAttribute('data-action')); }; });
    $all('[data-nav]', view).forEach(function (b) { b.onclick = function () { go({ page: b.getAttribute('data-nav'), id: t.ticket_id }); }; });
    $all('[data-copy]', view).forEach(function (b) { b.onclick = function () { go({ page: 'new', copy: t.ticket_id }); }; });
    $all('[data-goto]', view).forEach(function (a) { a.onclick = function (e) { e.preventDefault(); go({ page: 'ticket', id: a.getAttribute('data-goto') }); }; });
    $all('[data-open]', view).forEach(function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        const w = window.open('about:blank', '_blank');   // open synchronously so pop-up blockers allow it
        api('openAttachment', a.getAttribute('data-open')).then(function (r) {
          if (w) w.location = r.url; else window.open(r.url, '_blank');
        }).catch(function (err) { if (w) w.close(); toast(err.error, 'err'); });
      };
    });
    $all('[data-del]', view).forEach(function (b) {
      b.onclick = function () {
        dialog({ title: 'ลบไฟล์แนบ', message: 'ยืนยันลบไฟล์นี้?', danger: true, confirmText: 'ลบ' }).then(function (res) {
          if (!res) return;
          api('deleteAttachment', b.getAttribute('data-del')).then(function () { toast('ลบไฟล์แล้ว', 'ok'); load(view, t.ticket_id); })
            .catch(function (e) { toast(e.error, 'err'); });
        });
      };
    });
    const tl = $('#tl-data', view);
    if (tl) tl.onchange = function () { $all('[data-kind="data"]', view).forEach(function (li) { li.hidden = !tl.checked; }); };
    const input = $('#att-input', view);
    if (input) {
      input.onchange = function () {
        const files = Array.prototype.slice.call(input.files || []);
        input.value = '';
        const box = $('#att-progress', view);
        let chain = Promise.resolve();
        files.forEach(function (f) {
          chain = chain.then(function () {
            const row = document.createElement('div');
            row.innerHTML = '<div class="small">' + esc(f.name) + '</div><div class="progress"><div></div></div>';
            box.appendChild(row);
            return uploadFile(f, { ticket_id: t.ticket_id, category: $('#att-cat', view).value }, function (p) {
              row.querySelector('.progress > div').style.width = Math.round(p * 100) + '%';
            }).then(function () { toast('แนบไฟล์ ' + f.name + ' แล้ว', 'ok'); })
              .catch(function (e) { toast(f.name + ': ' + e.error, 'err'); row.remove(); });
          });
        });
        chain.then(function () { load(view, t.ticket_id); });
      };
    }
  }

  function load(view, id, isCurrent) {
    api('getTicket', id).then(function (d) {
      if (isCurrent && !isCurrent()) return;
      view.innerHTML = header(d) + notices(d) + actionBar(d) + itemsHtml(d) + checklistHtml(d) + attachmentsHtml(d) + timelineHtml(d);
      bind(view, d);
    }).catch(function (e) {
      if (isCurrent && !isCurrent()) return;
      view.innerHTML = errorHtml(e, 'App.reload()') + '<p style="text-align:center"><button class="btn" onclick="App.go({page:\'tickets\'})">กลับไปหน้ารายการ</button></p>';
    });
  }

  return {
    render: function (view, route, isCurrent) {
      if (!route.id) { go({ page: 'tickets' }, true); return; }
      load(view, route.id, isCurrent);
    }
  };
})();
</script>
