<!--
  File: PageDeals.html
  ติดตามการขาย (New Item follow-up) — same structure as the MGS Sales app (Mech), inside this web app:
    • KPI boxes that filter: งานที่เปิดอยู่ · ต้องอัปเดต · รอลูกค้าตัดสินใจ (฿/เดือน) · ปิดการขายได้ · ไม่ได้งาน
    • job cards: product the customer is interested in, volume / month, expected vs quoted price,
      status + customer stage, last update, next follow-up date, actions
    • 📝 อัปเดตความคืบหน้า: ผลการขาย · สถานะกับลูกค้า · สิ่งที่คุย · ขั้นตอนถัดไป · วันนัดติดตาม
    • ทีมขาย (Sales Manager / GM / Admin / SR Manager): one card per Sales → open that person's jobs
  An open deal "needs an update" when the follow-up date has come or nobody updated it for deal_follow_days (7).
  No cost data here (the server never sends it) — GP is on PageGp for GM / SR Manager / Admin.
-->
<script>
Pages.deals = (function () {
  let data = null, user = '';
  const f = { filter: 'open', q: '', sales: '', sr: '', group: '', view: 'jobs', dueOnly: false };
  const ST = {
    '': { cls: 'grey', label: 'รอติดตาม' }, follow: { cls: 'blue', label: 'กำลังติดตาม' }, sample: { cls: 'purple', label: 'ส่งตัวอย่าง / ทดลองสินค้า' },
    won: { cls: 'green', label: 'ปิดการขายได้ 🎉' }, lost: { cls: 'red', label: 'ไม่ได้งาน' }
  };
  const FILTERS = [['open', 'งานที่เปิดอยู่'], ['update', 'ต้องอัปเดต'], ['won', 'ปิดการขายได้'], ['lost', 'ไม่ได้งาน'], ['all', 'ทั้งหมด']];

  /** Avatar letter: skip the Thai title “คุณ” so every card does not show ค */
  const initial = function (name) { return String(name || '?').replace(/^คุณ\s*/, '').charAt(0) || '?'; };
  const agoTH = function (d) { return d == null ? '—' : d <= 0 ? 'วันนี้' : d === 1 ? 'เมื่อวาน' : d + ' วันที่แล้ว'; };
  const baht0 = function (v) { return '฿' + fmtInt(Math.round(v || 0)); };
  function inFilter(r, k) {
    if (k === 'open') return r.is_open;
    if (k === 'update') return r.is_due;
    if (k === 'won' || k === 'lost') return r.deal_status === k;
    return true;
  }
  function base() {
    const q = f.q.toLowerCase();
    return data.rows.filter(function (r) {
      if (f.sales && r.requestor_email !== f.sales) return false;
      if (f.sr && r.sr_email !== f.sr) return false;
      if (f.group && r.customer_group !== f.group) return false;
      if (q && (r.ticket_no + ' ' + r.customer_name + ' ' + r.product_name + ' ' + r.size + ' ' + r.requestor_name).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }
  function teamMode() { return data.can_see_everyone; }

  /* ---------- job card ---------- */
  function diffTag(r) {
    if (r.target_diff_pct == null) return '<span class="tag grey">ลูกค้ายังไม่บอกราคา</span>';
    if (r.target_diff_pct > 0) return '<span class="tag red">▲ สูงกว่าที่ลูกค้าคาด ' + fmtNum(r.target_diff_pct) + '%</span>';
    return '<span class="tag green">✓ ' + (r.target_diff_pct < 0 ? 'ต่ำกว่าที่ลูกค้าคาด ' + fmtNum(-r.target_diff_pct) + '%' : 'เท่าที่ลูกค้าคาด') + '</span>';
  }
  function jobCard(r) {
    const st = ST[r.deal_status] || ST[''];
    const late = r.deal_next_date && r.deal_next_date < todayYmd(0) && r.is_open;
    const acts = [];
    if (r.can_edit && r.is_open) acts.push('<button class="btn sm' + (r.is_due ? ' danger-solid' : '') + '" data-upd="' + esc(r.item_id) + '">📝 อัปเดตความคืบหน้า</button>');
    else if (r.can_edit) acts.push('<button class="btn sm ghost" data-upd="' + esc(r.item_id) + '">✏️ แก้ผลการขาย</button>');
    acts.push('<button class="btn sm ghost" data-copy="' + esc(r.item_id) + '">📋 คัดลอกราคา</button>');
    return '<article class="job' + (r.is_due ? ' alert' : '') + '">' +
      '<div class="job-top"><div style="min-width:0"><div class="job-t">' + esc(r.product_name) + '</div>' +
        '<div class="job-c">' + esc(r.customer_name) + (r.customer_group ? ' · ' + esc(r.customer_group) : '') +
          (r.destination_country && r.destination_country !== 'ไทย' ? ' · → ' + esc(r.destination_country) : '') + '</div></div>' +
        '<a href="#" class="job-no" data-ticket="' + esc(r.ticket_id) + '" title="เปิดใบขอราคา">' + esc(r.ticket_no) + ' #' + r.line_no + ' ↗</a></div>' +
      '<div class="job-mid"><span class="tag ' + st.cls + '">' + esc(st.label) + '</span>' +
        (r.deal_stage ? '<span class="tag outline">' + esc(r.deal_stage) + '</span>' : '') +
        (r.is_due ? '<span class="tag red">⏰ ต้องอัปเดต</span>' : '') + '</div>' +
      '<div class="job-price"><div><span class="job-val">' + fmtMoney(r.sell_price_thb) + '</span> <span class="hint">บาท/' + esc(r.uom) + '</span>' +
          '<div class="hint">' + fmtNum(r.qty) + ' ' + esc(r.uom) + '/เดือน · ≈ <b class="mono">' + baht0(r.monthly_value_thb) + '</b>/เดือน</div></div>' +
        '<div class="job-exp">' + (r.target_price ? '<div class="hint">ลูกค้าคาดหวัง <b class="mono">' + fmtMoney(r.target_price) + '</b></div>' : '') + diffTag(r) + '</div></div>' +
      '<div class="job-spec hint">' + esc([r.size, r.packing_size, r.net_weight ? 'NW ' + r.net_weight : ''].filter(Boolean).join(' · ')) + '</div>' +
      (r.deal_note || r.deal_reason ? '<div class="job-note">' + (r.deal_reason ? '<b>เหตุผล:</b> ' + esc(r.deal_reason) + (r.deal_note ? ' — ' : '') : '') + esc(r.deal_note) + '</div>' : '') +
      '<div class="job-meta">' +
        (teamMode() ? '<span>👤 ' + esc(r.requestor_name) + '</span>' + (r.sr_name ? '<span>🏭 SR ' + esc(r.sr_name) + '</span>' : '') : '') +
        '<span>💰 ได้ราคา ' + esc(fmtDate(r.quoted_ymd)) + '</span>' +
        (r.deal_updated_at ? '<span>📝 อัปเดต ' + esc(agoTH(r.days_since_update)) + (r.deal_updated_by ? ' · ' + esc(r.deal_updated_by) : '') + '</span>' : '<span>📝 ยังไม่เคยอัปเดต</span>') +
        (r.deal_next_step && r.is_open ? '<span>➡ ' + esc(r.deal_next_step) + '</span>' : '') +
        (r.deal_next_date && r.is_open ? '<span class="' + (late || r.is_due ? 'late' : '') + '">📅 นัด ' + esc(fmtDate(r.deal_next_date)) + '</span>' : '') +
        (!r.is_open && r.deal_closed_at ? '<span>🏁 ' + esc(fmtDate(r.deal_closed_at)) + '</span>' : '') +
      '</div><div class="job-acts">' + acts.join('') + '</div></article>';
  }

  /* ---------- team cards ---------- */
  function teamHtml(rows) {
    const people = {};
    (data.people || []).forEach(function (p) { people[p.email] = { email: p.email, name: p.full_name, rows: [] }; });
    rows.forEach(function (r) { (people[r.requestor_email] = people[r.requestor_email] || { email: r.requestor_email, name: r.requestor_name, rows: [] }).rows.push(r); });
    const list = Object.keys(people).map(function (k) {
      const p = people[k], rs = p.rows;
      const open = rs.filter(function (r) { return r.is_open; });
      return { email: p.email, name: p.name, open: open.length, upd: rs.filter(function (r) { return r.is_due; }).length,
        won: rs.filter(function (r) { return r.deal_status === 'won'; }).length, lost: rs.filter(function (r) { return r.deal_status === 'lost'; }).length,
        pipe: open.reduce(function (s, r) { return s + r.monthly_value_thb; }, 0) };
    }).sort(function (a, b) { return b.upd - a.upd || b.open - a.open; });
    if (!list.length) return '<div class="empty"><div class="big">👥</div>ยังไม่มี Sales ในระบบ</div>';
    return '<div class="team">' + list.map(function (p) {
      return '<button type="button" class="tcard" data-person="' + esc(p.email) + '"><div class="row-i"><span class="avatar">' + esc(initial(p.name)) + '</span>' +
        '<span class="tn"><b>' + esc(p.name) + '</b><span class="hint">' + esc(p.email) + '</span></span>' + (p.upd ? '<span class="tag red">ค้างอัปเดต ' + p.upd + '</span>' : '') + '</div>' +
        '<div class="tstats"><div><b>' + p.open + '</b><span>งานเปิด</span></div><div><b>' + p.upd + '</b><span>ต้องอัปเดต</span></div><div><b>' + p.won + '</b><span>ปิดได้</span></div><div><b>' + p.lost + '</b><span>ไม่ได้</span></div></div>' +
        '<div class="hint">รอลูกค้าตัดสินใจ <b class="mono" style="color:var(--text)">' + baht0(p.pipe) + '</b>/เดือน</div></button>';
    }).join('') + '</div>';
  }

  /* ---------- Sourcing view: one card per SR who made the prices (weekly meeting with Sales) ---------- */
  function updatedThisWeek(r) { return !!r.deal_updated_at && r.days_since_update <= 6; }
  function sourcingHtml(rows) {
    const people = {};
    (data.sourcing || []).forEach(function (p) { people[p.email] = { email: p.email, name: p.full_name, rows: [] }; });
    rows.forEach(function (r) { if (!r.sr_email) return; (people[r.sr_email] = people[r.sr_email] || { email: r.sr_email, name: r.sr_name, rows: [] }).rows.push(r); });
    const list = Object.keys(people).map(function (k) {
      const p = people[k], rs = p.rows;
      const won = rs.filter(function (r) { return r.deal_status === 'won'; }).length, lost = rs.filter(function (r) { return r.deal_status === 'lost'; }).length;
      const open = rs.filter(function (r) { return r.is_open; });
      return { email: p.email, name: p.name, total: rs.length, open: open.length, upd: rs.filter(function (r) { return r.is_due; }).length, won: won, lost: lost,
        week: rs.filter(updatedThisWeek).length, rate: rs.length ? Math.round(won / rs.length * 100) : null,
        pipe: open.reduce(function (s, r) { return s + r.monthly_value_thb; }, 0) };
    }).sort(function (a, b) { return b.total - a.total; });
    if (!list.length) return '<div class="empty"><div class="big">🏭</div>ยังไม่มี SR ในระบบ</div>';
    return '<p class="hint" style="margin:-4px 0 10px">แต่ละ SR ใช้ติดตามกับ Sales ใน weekly meeting ว่าราคาที่ตัวเองทำไปแล้ว ลูกค้าตอบอย่างไร · ข้อมูลเดียวกับที่ Sales เห็น (ไม่มีต้นทุน / GP)</p>' +
      '<div class="team">' + list.map(function (p) {
        return '<button type="button" class="tcard" data-srperson="' + esc(p.email) + '"><div class="row-i"><span class="avatar">' + esc(initial(p.name)) + '</span>' +
          '<span class="tn"><b>' + esc(p.name) + '</b><span class="hint">ทำราคาแล้ว ' + p.total + ' รายการ · อัตราปิด ' + (p.rate == null ? '–' : p.rate + '%') + '</span></span>' +
          (p.upd ? '<span class="tag red">Sales ค้างอัปเดต ' + p.upd + '</span>' : '') + '</div>' +
          '<div class="tstats"><div><b>' + p.open + '</b><span>รอลูกค้า</span></div><div><b>' + p.week + '</b><span>อัปเดตสัปดาห์นี้</span></div><div><b>' + p.won + '</b><span>ปิดได้</span></div><div><b>' + p.lost + '</b><span>ไม่ได้</span></div></div>' +
          '<div class="hint">รอลูกค้าตัดสินใจ <b class="mono" style="color:var(--text)">' + baht0(p.pipe) + '</b>/เดือน</div></button>';
      }).join('') + '</div>';
  }

  /** Text for the weekly meeting: the SR's prices grouped by Sales — status, last update, next step (no cost / GP). */
  function weeklyText(rows) {
    const srName = f.sr ? ((data.sourcing || []).filter(function (p) { return p.email === f.sr; })[0] || {}).full_name || (rows[0] || {}).sr_name || f.sr : 'ทุก SR';
    const keep = rows.filter(function (r) { return r.is_open || (r.deal_closed_at && (Date.now() - new Date(r.deal_closed_at).getTime()) < 8 * 86400000); });
    const bySales = {};
    keep.forEach(function (r) { (bySales[r.requestor_name] = bySales[r.requestor_name] || []).push(r); });
    const n = function (k) { return keep.filter(function (r) { return k(r); }).length; };
    const lines = ['📋 ติดตามงานขาย — SR ' + srName + ' · ' + fmtDate(todayYmd(0)),
      'เปิดอยู่ ' + n(function (r) { return r.is_open; }) + ' · ต้องอัปเดต ' + n(function (r) { return r.is_due; }) + ' · ปิดได้สัปดาห์นี้ ' + n(function (r) { return r.deal_status === 'won'; }) +
        ' · ไม่ได้งานสัปดาห์นี้ ' + n(function (r) { return r.deal_status === 'lost'; }), ''];
    Object.keys(bySales).sort().forEach(function (s) {
      lines.push('👤 ' + s);
      bySales[s].sort(function (a, b) { return (b.is_due - a.is_due) || (a.quoted_at < b.quoted_at ? -1 : 1); }).forEach(function (r) {
        const st = r.is_open ? PENDING.filter(function (b) { return b[0] === bucketOf(r); })[0][1].replace(/^\S+\s/, '') : (ST[r.deal_status] || ST['']).label.replace(' 🎉', '');
        lines.push((r.is_due ? '  ⏰ ' : '  • ') + r.ticket_no + ' ' + r.product_name + ' — ' + r.customer_name + ' · ' + fmtNum(r.qty) + ' ' + r.uom + '/เดือน · ' +
          fmtMoney(r.sell_price_thb) + ' บาท/' + r.uom + ' · ' + st + (r.deal_stage ? ' (' + r.deal_stage + ')' : '') +
          (r.deal_reason ? ' · เหตุผล: ' + r.deal_reason : '') +
          ' · ' + (r.deal_updated_at ? 'อัปเดต ' + agoTH(r.days_since_update) : 'ยังไม่เคยอัปเดต') +
          (r.is_open && r.deal_next_step ? ' · ถัดไป: ' + r.deal_next_step + (r.deal_next_date ? ' ' + fmtDate(r.deal_next_date) : '') : ''));
      });
      lines.push('');
    });
    if (!keep.length) lines.push('ไม่มีงานที่ต้องติดตาม');
    return lines.join('\n').trim();
  }

  /* ---------- งานค้าง: open lines only, grouped by what they are waiting for ---------- */
  const PENDING = [
    ['new', '🆕 ยังไม่เคยอัปเดต', 'ได้ราคาแล้ว แต่ Sales ยังไม่ได้บอกผลกับลูกค้า'],
    ['sample', '🧪 ตัวอย่างสินค้า', 'รอส่ง / ลูกค้ากำลังทดลองตัวอย่าง'],
    ['price', '💬 เรื่องราคา', 'ลูกค้าเทียบราคา / ต่อรอง / ขอปรับราคาจาก SR'],
    ['customer', '⏳ รอลูกค้าตัดสินใจ', 'เพิ่งส่งราคา / รออนุมัติภายในของลูกค้า / ลูกค้าเลื่อน'],
    ['closing', '🤝 ใกล้ปิด / รอ PO', 'ใกล้ปิดการขาย หรือรอใบสั่งซื้อ'],
    ['other', '📌 กำลังติดตาม', 'ยังไม่ระบุสถานะกับลูกค้า']
  ];
  /** Which pending bucket an open line belongs to (from status, customer stage and next step). */
  function bucketOf(r) {
    const st = r.deal_stage || '', nx = r.deal_next_step || '';
    if (!r.deal_status) return 'new';
    if (r.deal_status === 'sample' || /ตัวอย่าง|ทดลอง/.test(st + ' ' + nx)) return 'sample';
    if (/ราคา/.test(st.replace('เพิ่งส่งราคาให้ลูกค้า', '')) || /ปรับราคา/.test(nx)) return 'price';
    if (/ใกล้ปิด/.test(st) || /PO|ปิดการขาย/.test(nx)) return 'closing';
    if (st) return 'customer';
    return 'other';
  }
  function pendingHtml(rows) {
    const open = rows.filter(function (r) { return r.is_open && (!f.dueOnly || r.is_due); });
    const by = {};
    open.forEach(function (r) { (by[bucketOf(r)] = by[bucketOf(r)] || []).push(r); });
    const allOpen = rows.filter(function (r) { return r.is_open; });
    let html = '<div class="pend-bar"><span class="hint">แสดงเฉพาะรายการที่ยังไม่ปิด (' + allOpen.length + ') แยกตามเรื่องที่ค้าง · เรียงจากที่ไม่ได้อัปเดตนานที่สุด</span>' +
      '<label class="chk-inline"><input type="checkbox" id="dl-dueonly"' + (f.dueOnly ? ' checked' : '') + '> เฉพาะที่ต้องอัปเดต (' + allOpen.filter(function (r) { return r.is_due; }).length + ')</label>' +
      '<div class="pend-chips">' + PENDING.map(function (b) {
        const n = (by[b[0]] || []).length;
        return n ? '<a href="#pend-' + b[0] + '" class="tag outline" data-jump="' + b[0] + '">' + esc(b[1]) + ' <b>' + n + '</b></a>' : '';
      }).join('') + '</div></div>';
    if (!open.length) return html + '<div class="card empty"><div class="big">🎉</div>' + (f.dueOnly ? 'ไม่มีรายการที่ต้องอัปเดต' : 'ไม่มีงานค้าง — ทุกรายการปิดแล้ว') + '</div>';
    html += '<div class="pend-groups">' + PENDING.filter(function (b) { return (by[b[0]] || []).length; }).map(function (b) {
      const list = by[b[0]].sort(function (a, c) { return (c.is_due - a.is_due) || (c.days_since_update - a.days_since_update); });
      return '<section class="card pend" id="pend-' + b[0] + '"><div class="pend-h"><h3>' + esc(b[1]) + ' <span class="tag grey">' + list.length + '</span></h3><span class="hint">' + esc(b[2]) + '</span></div>' +
        '<ul class="pend-list">' + list.map(function (r) {
          const late = r.deal_next_date && r.deal_next_date < todayYmd(0);
          return '<li class="' + (r.is_due ? 'due' : '') + '"><div class="pl-main"><b>' + esc(r.product_name) + '</b> <span class="hint">' + fmtNum(r.qty) + ' ' + esc(r.uom) + '/เดือน · ' +
              fmtMoney(r.sell_price_thb) + ' บาท/' + esc(r.uom) + '</span>' +
            '<div class="hint">' + esc(r.customer_name) + (teamMode() ? ' · 👤 ' + esc(r.requestor_name) + (r.sr_name ? ' · 🏭 ' + esc(r.sr_name) : '') : '') +
              ' · <a href="#" data-ticket="' + esc(r.ticket_id) + '">' + esc(r.ticket_no) + '</a></div>' +
            ((r.deal_stage || r.deal_next_step || r.deal_note) ? '<div class="pl-note">' + esc([r.deal_stage, r.deal_next_step ? '➡ ' + r.deal_next_step : ''].filter(Boolean).join(' · ')) +
              (r.deal_note ? ' — ' + esc(r.deal_note.length > 90 ? r.deal_note.slice(0, 90) + '…' : r.deal_note) : '') + '</div>' : '') + '</div>' +
            '<div class="pl-side"><span class="' + (r.is_due ? 'tag red' : 'tag grey') + '">' + (r.deal_updated_at ? 'อัปเดต ' + agoTH(r.days_since_update) : 'ได้ราคา ' + agoTH(r.days_since_update)) + '</span>' +
              (r.deal_next_date ? '<span class="hint' + (late ? ' late' : '') + '">📅 ' + esc(fmtDate(r.deal_next_date)) + '</span>' : '') +
              (r.can_edit ? '<button class="btn sm' + (r.is_due ? ' danger-solid' : '') + '" data-upd="' + esc(r.item_id) + '">📝 อัปเดต</button>' : '') + '</div></li>';
        }).join('') + '</ul></section>';
    }).join('') + '</div>';
    return html;
  }

  function draw(view) {
    const all = base();
    const by = function (k) { return all.filter(function (r) { return inFilter(r, k); }); };
    const open = by('open'), won = by('won'), lost = by('lost'), upd = by('update');
    const rows = by(f.filter).sort(function (a, b) { return (b.is_due - a.is_due) || (a.quoted_at < b.quoted_at ? 1 : -1); });
    const who = f.sales ? (data.rows.filter(function (r) { return r.requestor_email === f.sales; })[0] || {}).requestor_name ||
      ((data.people || []).filter(function (p) { return p.email === f.sales; })[0] || {}).full_name : '';
    const groups = data.rows.map(function (r) { return r.customer_group; }).filter(function (g, i, a) { return g && a.indexOf(g) === i; });
    const kpi = function (k, l, v, s, color) {
      return '<button type="button" class="kpi' + (f.filter === k && f.view === 'jobs' ? ' on' : '') + '" data-filter="' + k + '"><span class="l">' + l + '</span>' +
        '<span class="v"' + (color ? ' style="color:var(--' + color + ')"' : '') + '>' + v + '</span><span class="s">' + s + '</span></button>';
    };
    const srWho = f.sr ? ((data.sourcing || []).filter(function (p) { return p.email === f.sr; })[0] || {}).full_name || (data.rows.filter(function (r) { return r.sr_email === f.sr; })[0] || {}).sr_name || f.sr : '';
    let html = (state.me.role === 'sr' ? '' : reportTabs('deals')) +
      '<div class="person"><span class="avatar lg">' + esc(initial(srWho || who || state.me.full_name)) + '</span><div style="flex:1;min-width:200px"><h1>' +
        (f.sr ? 'ราคาที่ ' + (f.sr === state.me.email ? 'ฉัน' : esc(srWho)) + ' ทำ — ติดตามกับ Sales' + (f.sales ? ' · ' + esc(who) : '') : f.sales ? 'งานของ ' + esc(who) :
          f.view === 'sourcing' ? 'ติดตามการขาย — แยกตาม Sourcing' : teamMode() ? 'ติดตามการขาย — ทีมขาย' : 'ติดตามการขายของฉัน') + '</h1>' +
        '<div class="hint">ทุกรายการที่ GM อนุมัติราคาแล้ว · อัปเดตความคืบหน้ากับลูกค้าอย่างน้อยทุก ' + data.follow_days + ' วัน</div></div>' +
        '<div class="seg" role="tablist"><button type="button" class="' + (f.view === 'jobs' ? 'on' : '') + '" data-view="jobs">📋 รายการ</button>' +
          '<button type="button" class="' + (f.view === 'pending' ? 'on' : '') + '" data-view="pending">⏳ งานค้าง</button>' +
          (teamMode() ? '<button type="button" class="' + (f.view === 'team' ? 'on' : '') + '" data-view="team">👥 ทีมขาย</button>' +
            ((data.sourcing || []).length ? '<button type="button" class="' + (f.view === 'sourcing' ? 'on' : '') + '" data-view="sourcing">🏭 Sourcing</button>' : '') : '') + '</div>' +
        (f.sr && (f.view === 'jobs' || f.view === 'pending') ? '<button class="btn sm" data-weekly>📋 สรุปสำหรับประชุมประจำสัปดาห์</button>' : '') +
        (f.sales || f.sr ? '<button class="btn sm ghost" data-clear-person>✕ ดูทุกคน</button>' : '') + '</div>';
    html += '<div class="kpis5">' +
      kpi('open', 'งานที่เปิดอยู่', fmtInt(open.length), 'รอลูกค้าตัดสินใจ ' + baht0(open.reduce(function (s, r) { return s + r.monthly_value_thb; }, 0)) + '/เดือน') +
      kpi('update', 'ต้องอัปเดต', fmtInt(upd.length), 'ถึงวันนัด / เกิน ' + data.follow_days + ' วัน', upd.length ? 'danger' : '') +
      kpi('won', 'ปิดการขายได้', fmtInt(won.length), baht0(won.reduce(function (s, r) { return s + r.monthly_value_thb; }, 0)) + '/เดือน', 'ok') +
      kpi('lost', 'ไม่ได้งาน', fmtInt(lost.length), 'ดูเหตุผลเพื่อปรับราคา / สินค้า') +
      kpi('all', 'อัตราปิดการขาย', all.length ? Math.round(won.length / all.length * 100) + '%' : '–', (won.length + lost.length ? 'ชนะ ' + Math.round(won.length / (won.length + lost.length) * 100) + '% ของที่ตัดสินแล้ว · ' : '') + all.length + ' รายการ') +
      '</div>';
    if (f.view === 'team' && teamMode()) {
      html += teamHtml(all);
    } else if (f.view === 'sourcing' && teamMode()) {
      html += sourcingHtml(all);
    } else if (f.view === 'pending') {
      html += pendingHtml(all);
    } else {
      html += '<div class="toolbar"><input type="search" class="search" id="dl-q" placeholder="🔍 ค้นหา ลูกค้า / สินค้า / เลขที่ใบ" value="' + esc(f.q) + '">' +
        '<select id="dl-filter">' + FILTERS.map(function (x) { return '<option value="' + x[0] + '"' + (f.filter === x[0] ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') + '</select>' +
        (groups.length > 1 ? '<select id="dl-group"><option value="">ทุกกลุ่มลูกค้า</option>' + groups.map(function (g) { return '<option' + (f.group === g ? ' selected' : '') + '>' + esc(g) + '</option>'; }).join('') + '</select>' : '') +
        '<span class="hint">' + rows.length + ' รายการ</span></div>';
      html += rows.length ? '<div class="jobs">' + rows.map(jobCard).join('') + '</div>' :
        '<div class="card empty"><div class="big">📭</div>' + (data.rows.length ? 'ไม่มีงานในหมวดนี้' : 'ยังไม่มีรายการที่ได้ราคาจาก GM — เมื่อราคาส่งถึง Sales แล้ว รายการจะมาอยู่ที่นี่') + '</div>';
    }
    view.innerHTML = html;
    bind(view);
  }

  function bind(view) {
    bindReportTabs(view);
    $all('[data-filter]', view).forEach(function (b) { b.onclick = function () { f.filter = b.getAttribute('data-filter'); f.view = 'jobs'; draw(view); }; });
    $all('[data-view]', view).forEach(function (b) { b.onclick = function () { f.view = b.getAttribute('data-view'); draw(view); }; });
    if ($('#dl-dueonly', view)) $('#dl-dueonly', view).onchange = function (e) { f.dueOnly = e.target.checked; draw(view); };
    $all('[data-jump]', view).forEach(function (a) {
      a.onclick = function (e) { e.preventDefault(); const t = $('#pend-' + a.getAttribute('data-jump'), view); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    });
    $all('[data-person]', view).forEach(function (b) { b.onclick = function () { f.sales = b.getAttribute('data-person'); f.view = 'jobs'; f.filter = 'open'; draw(view); }; });
    $all('[data-clear-person]', view).forEach(function (b) { b.onclick = function () { f.sales = ''; f.sr = ''; draw(view); }; });
    $all('[data-srperson]', view).forEach(function (b) { b.onclick = function () { f.sr = b.getAttribute('data-srperson'); f.view = 'jobs'; f.filter = 'open'; draw(view); }; });
    $all('[data-weekly]', view).forEach(function (b) { b.onclick = function () { copyText(weeklyText(base()), 'คัดลอกสรุปแล้ว — วางในแชท / เอกสารประชุมได้เลย'); }; });
    const q = $('#dl-q', view);
    if (q) q.oninput = debounce(function () {
      f.q = q.value.trim(); draw(view);
      const n = $('#dl-q', view); n.focus(); n.setSelectionRange(n.value.length, n.value.length);
    }, 250);
    if ($('#dl-filter', view)) $('#dl-filter', view).onchange = function (e) { f.filter = e.target.value; draw(view); };
    if ($('#dl-group', view)) $('#dl-group', view).onchange = function (e) { f.group = e.target.value; draw(view); };
    $all('[data-ticket]', view).forEach(function (a) { a.onclick = function (e) { e.preventDefault(); go({ page: 'ticket', id: a.getAttribute('data-ticket') }); }; });
    $all('[data-upd]', view).forEach(function (b) { b.onclick = function () { edit(view, rowOf(b.getAttribute('data-upd'))); }; });
    $all('[data-copy]', view).forEach(function (b) { b.onclick = function () { copyOffer(rowOf(b.getAttribute('data-copy'))); }; });
  }
  function rowOf(id) { return data.rows.filter(function (r) { return r.item_id === id; })[0]; }

  /** Price text for the customer (selling price + offer terms only — never cost). */
  function copyOffer(r) {
    const o = r.offer || {};
    const txt = ['ใบเสนอราคา ' + r.ticket_no + ' — ' + r.customer_name, '',
      r.product_name + ([r.size, r.packing_size].filter(Boolean).length ? ' (' + [r.size, r.packing_size].filter(Boolean).join(' · ') + ')' : ''),
      'ราคา ' + fmtMoney(r.sell_price_thb) + ' บาท/' + r.uom,
      [o.brand ? 'แบรนด์ ' + o.brand : '', o.origin_country ? 'ประเทศต้นทาง ' + o.origin_country : '', o.packing ? 'Packing ' + o.packing : '',
        o.shelf_life ? 'อายุสินค้า ' + o.shelf_life : ''].filter(Boolean).join(' · '),
      [o.moq != null ? 'MOQ ' + fmtNum(o.moq) + ' ' + r.uom : '', o.lead_time_days != null ? 'ส่งของภายใน ' + o.lead_time_days + ' วัน' : '',
        o.valid_until ? 'ยืนราคาถึง ' + fmtDate(o.valid_until) : ''].filter(Boolean).join(' · ')].filter(function (x, i) { return i < 2 || x; }).join('\n');
    copyText(txt, 'คัดลอกราคาแล้ว — วางในแชทลูกค้าได้เลย');
  }
  function copyText(txt, msg) {
    const done = function () { toast(msg, 'ok'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { fallback(txt, done); });
    else fallback(txt, done);
  }
  function fallback(t, done) {
    const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); done(); } catch (e) { window.prompt('คัดลอกข้อความนี้', t); }
    a.remove();
  }

  /** 📝 อัปเดตความคืบหน้า: ผลการขาย → (เปิดอยู่: สถานะกับลูกค้า + ขั้นตอนถัดไป + วันนัด) / (ไม่ได้งาน: เหตุผล) + สิ่งที่คุย */
  function edit(view, r) {
    const cur = r.deal_status || 'follow';
    const opt = function (list, v) { return list.map(function (x) { return '<option' + (v === x ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join(''); };
    const html = '<div class="hint" style="margin:-4px 0 12px">' + esc(r.ticket_no) + ' · ' + esc(r.customer_name) + ' · ' + fmtNum(r.qty) + ' ' + esc(r.uom) + '/เดือน · เสนอ ' +
        fmtMoney(r.sell_price_thb) + ' บาท/' + esc(r.uom) + (r.deal_updated_at ? ' · อัปเดตล่าสุด ' + esc(agoTH(r.days_since_update)) : '') + '</div>' +
      '<div class="flbl">ผลการขาย</div><div class="deal-st" role="radiogroup" aria-label="ผลการขาย">' + ['follow', 'sample', 'won', 'lost'].map(function (k) {
        return '<label class="dchip-opt d-' + k + '"><input type="radio" name="dst" value="' + k + '"' + (k === cur ? ' checked' : '') + '><span>' + esc(ST[k].label) + '</span></label>';
      }).join('') + '</div>' +
      '<label class="field" data-show="follow sample"><span>สถานะกับลูกค้าตอนนี้</span><select id="d-stage"><option value="">— เลือก —</option>' + opt(data.customer_stages, r.deal_stage) + '</select></label>' +
      '<label class="field" data-show="lost"><span>เหตุผลที่ไม่ได้งาน <span class="req">*</span></span><select id="d-reason"><option value="">— เลือก —</option>' + opt(data.lost_reasons, r.deal_reason) + '</select></label>' +
      '<label class="field"><span>รายละเอียด / สิ่งที่คุยกับลูกค้า</span><textarea id="d-note" maxlength="2000" rows="3" placeholder="เช่น ลูกค้าขอทดลอง 1 ลัง / เทียบอยู่กับอีก 2 เจ้า / คู่แข่งเสนอ …">' + esc(r.deal_note) + '</textarea></label>' +
      '<div class="fgrid two" data-show="follow sample"><label class="field"><span>ขั้นตอนถัดไป</span><select id="d-step"><option value="">— เลือก —</option>' + opt(data.next_steps, r.deal_next_step) + '</select></label>' +
        '<label class="field"><span>วันที่นัดติดตาม</span><input type="date" id="d-next" min="' + todayYmd(0) + '" value="' + esc(r.deal_next_date && r.deal_next_date >= todayYmd(0) ? r.deal_next_date : todayYmd(data.follow_days)) + '"></label></div>';
    const sync = function (root) {
      const st = ($('input[name="dst"]:checked', root) || {}).value;
      $all('[data-show]', root).forEach(function (el) { el.hidden = el.getAttribute('data-show').split(' ').indexOf(st) === -1; });
      if (st === 'sample' && !$('#d-stage', root).value) $('#d-stage', root).value = data.customer_stages.filter(function (x) { return /ตัวอย่าง/.test(x); })[0] || '';
    };
    dialog({
      title: '📝 อัปเดตความคืบหน้า — ' + r.product_name, html: html, confirmText: 'บันทึกการอัปเดต',
      onOpen: function (root) { sync(root); $all('input[name="dst"]', root).forEach(function (x) { x.onchange = function () { sync(root); }; }); },
      validate: function (root) {
        const st = ($('input[name="dst"]:checked', root) || {}).value;
        if (!st) return 'กรุณาเลือกผลการขาย';
        if (st === 'lost' && !$('#d-reason', root).value) return 'กรุณาเลือกเหตุผลที่ไม่ได้งาน';
        if (st === 'lost' && $('#d-reason', root).value === 'อื่นๆ' && !$('#d-note', root).value.trim()) return 'เลือก “อื่นๆ” กรุณาระบุรายละเอียด';
        if ((st === 'follow' || st === 'sample') && $('#d-next', root).value && $('#d-next', root).value < todayYmd(0)) return 'วันนัดต้องไม่เป็นวันที่ผ่านมาแล้ว';
        return null;
      }
    }).then(function (res) {
      if (!res) return;
      const root = res.root;
      const st = $('input[name="dst"]:checked', root).value;
      const open = st === 'follow' || st === 'sample';
      api('updateDeal', r.item_id, { status: st, reason: st === 'lost' ? $('#d-reason', root).value : '', note: $('#d-note', root).value.trim(),
        stage: open ? $('#d-stage', root).value : '', next_step: open ? $('#d-step', root).value : '', next_date: open ? $('#d-next', root).value : '' })
        .then(function (out) {
          data.rows = data.rows.map(function (x) { return x.item_id === r.item_id && out.deal ? out.deal : x; });
          toast(st === 'won' ? '🎉 บันทึกว่าปิดการขายได้ — แจ้ง SR และกลุ่มแล้ว' : 'บันทึกความคืบหน้าแล้ว', 'ok');
          draw(view);
          refreshPoll();
        }).catch(function (e) { toast(e.error, 'err', 8000); });
    });
  }

  return {
    render: function (view, route, isCurrent) {
      if (data && user === state.me.email) draw(view); else view.innerHTML = loadingHtml('กำลังโหลดงานติดตามการขาย...');
      const who = state.me.email;
      api('listDeals').then(function (d) {
        if (!data || user !== who) {
          f.sales = ''; f.q = ''; f.group = '';
          f.sr = d.default_sr || '';      // SR opens on the prices they made
          f.view = 'jobs';
          f.filter = d.rows.some(function (r) { return r.is_due && r.can_edit; }) ? 'update' : 'open';
        }
        data = d; user = who;
        if (isCurrent()) draw(view);
      }).catch(function (e) { if (isCurrent()) view.innerHTML = errorHtml(e, 'App.reload()'); });
    }
  };
})();
</script>
