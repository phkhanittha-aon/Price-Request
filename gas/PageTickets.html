<!--
  File: PageTickets.html
  Ticket list: scope (inbox / mine / queue / all), filters, search, SLA summary, paging.
  Filtering happens on the server (listTickets) — the browser never receives tickets the user may not see.
-->
<script>
Pages.tickets = (function () {
  const TITLES = { inbox: 'งานรอฉัน', mine: 'ของฉัน', queue: 'คิวรอ SR รับงาน', all: 'ใบขอราคาทั้งหมด' };
  const filters = {};   // per scope, kept while the page is open

  function defaults(scope) {
    return { scope: scope, q: '', status: '', outcome: '', stage: '', group_code: '', priority: '', date_from: '', date_to: '', sr: '', requestor: '',
      sort: (scope === 'inbox' || scope === 'queue') ? 'urgency' : 'updated_desc', page: 1 };
  }

  function title(scope) {
    if (scope === 'mine') return state.me.role === 'sr' ? 'งานของฉัน' : 'ใบขอราคาของฉัน';
    return TITLES[scope] || TITLES.all;
  }

  function filterBar(f) {
    const st = state.ref.status_labels;
    const sg = state.ref.stage_labels;
    return '<div class="card"><div class="row">' +
      '<label class="field" style="flex:2 1 260px"><span>ค้นหา</span><input type="search" id="f-q" placeholder="เลขที่ใบ / ชื่อเรื่อง / สินค้า / ลูกค้า" value="' + esc(f.q) + '"></label>' +
      '<label class="field"><span>ผลการเสนอราคา</span><select id="f-outcome"><option value="">ทั้งหมด</option>' +
      [['done', '✓ เสนอราคาจบแล้ว'], ['open', '⏳ ยังไม่จบ'], ['rejected', '✕ ไม่อนุมัติ / ยกเลิก']].map(function (o) {
        return '<option value="' + o[0] + '"' + (f.outcome === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label>' +
      '<label class="field"><span>สถานะ</span><select id="f-status"><option value="">ทั้งหมด</option>' +
      Object.keys(st).map(function (k) { return '<option value="' + k + '"' + (f.status === k ? ' selected' : '') + '>' + esc(st[k]) + '</option>'; }).join('') + '</select></label>' +
      '<label class="field"><span>เรียงตาม</span><select id="f-sort">' +
      [['urgency', 'เร่งด่วนก่อน (SLA)'], ['updated_desc', 'อัปเดตล่าสุด'], ['created_desc', 'สร้างล่าสุด'], ['due_asc', 'วันที่ต้องการราคา']]
        .map(function (o) { return '<option value="' + o[0] + '"' + (f.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label>' +
      '</div><details' + (f.stage || f.group_code || f.priority || f.date_from || f.date_to || f.sr || f.requestor ? ' open' : '') + '><summary class="small" style="cursor:pointer;color:var(--brand)">ตัวกรองเพิ่มเติม</summary><div class="row" style="margin-top:8px">' +
      '<label class="field"><span>ขั้นตอน</span><select id="f-stage"><option value="">ทั้งหมด</option>' +
      Object.keys(sg).map(function (k) { return '<option value="' + k + '"' + (f.stage === k ? ' selected' : '') + '>' + esc(sg[k]) + '</option>'; }).join('') + '</select></label>' +
      '<label class="field"><span>กลุ่มสินค้า</span><select id="f-group">' + groupOptions(f.group_code, true) + '</select></label>' +
      '<label class="field"><span>ความเร่งด่วน</span><select id="f-prio"><option value="">ทั้งหมด</option>' +
      [['urgent', 'ด่วนมาก'], ['high', 'สูง'], ['normal', 'ปกติ'], ['low', 'ต่ำ']].map(function (o) {
        return '<option value="' + o[0] + '"' + (f.priority === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label>' +
      (state.me.role !== 'sales' ? '<label class="field"><span>ผู้ขอ (Sales)</span><select id="f-req"><option value="">ทั้งหมด</option>' +
        (state.ref.sales_users || []).map(function (u) { return '<option value="' + esc(u.email) + '"' + (f.requestor === u.email ? ' selected' : '') + '>' + esc(u.full_name) + '</option>'; }).join('') +
        '</select></label>' : '') +
      (state.me.role !== 'sales' ? '<label class="field"><span>SR ผู้รับงาน</span><select id="f-sr"><option value="">ทั้งหมด</option>' +
        state.ref.sr_users.map(function (u) { return '<option value="' + esc(u.email) + '"' + (f.sr === u.email ? ' selected' : '') + '>' + esc(u.full_name) + '</option>'; }).join('') +
        '</select></label>' : '') +
      '<label class="field"><span>สร้างตั้งแต่</span><input type="date" id="f-from" value="' + esc(f.date_from) + '"></label>' +
      '<label class="field"><span>ถึง</span><input type="date" id="f-to" value="' + esc(f.date_to) + '"></label>' +
      '</div><button class="btn sm" id="f-clear">ล้างตัวกรอง</button></details></div>';
  }

  function rowsHtml(d) {
    if (!d.rows.length) {
      return '<div class="card empty">' + (state.route.scope === 'inbox' ? 'ไม่มีงานรอคุณอยู่ตอนนี้ 🎉' : 'ไม่พบใบขอราคาตามเงื่อนไขนี้') +
        (state.me.role === 'sales' ? '<p><button class="btn primary" onclick="App.go({page:\'new\'})">+ สร้างใบขอราคา</button></p>' : '') + '</div>';
    }
    const s = d.sla_counts;
    let html = '<p class="small"><b>' + fmtInt(d.total) + '</b> ใบ' +
      (s.breach ? ' · <span class="sla breach">⛔ เกิน SLA ' + s.breach + '</span>' : '') +
      (s.warning ? ' · <span class="sla warning">⚠ ใกล้ครบ ' + s.warning + '</span>' : '') + '</p>';
    html += '<div class="card" style="padding:0"><div class="tbl-wrap"><table class="tbl stack"><thead><tr>' +
      '<th>ใบขอราคา</th><th>สถานะ / ขั้นตอน</th><th>ผู้ขอ</th><th>SR</th><th class="num">รายการ</th><th>ค้างในขั้นตอน</th><th>อายุ</th></tr></thead><tbody>' +
      d.rows.map(function (r) {
        return '<tr class="click" data-id="' + esc(r.ticket_id) + '" tabindex="0">' +
          '<td class="main"><div><b>' + esc(r.ticket_no) + '</b> ' + (r.priority !== 'normal' ? prioText(r.priority) : '') +
          (r.revision_count ? ' <span class="badge">แก้ราคา ' + r.revision_count + '</span>' : '') + '</div>' +
          '<div>' + esc(r.title) + '</div><div class="small muted">' + esc(r.item_names).slice(0, 120) + '</div></td>' +
          '<td data-label="สถานะ">' + statusBadge(r.status, r.status_label) + '<div class="small">' + esc(r.stage_label) + '</div></td>' +
          '<td data-label="ผู้ขอ">' + esc(r.requestor_name) + '</td>' +
          '<td data-label="SR">' + esc(r.sr_name || '–') + '</td>' +
          '<td data-label="รายการ" class="num">' + r.item_count + '</td>' +
          '<td data-label="ค้างในขั้นตอน">' + (r.sla_status === 'done' ? '–' : fmtHours(r.stage_age_hours) + '<div class="small">' + slaBadge(r.sla_status) + '</div>') + '</td>' +
          '<td data-label="อายุ">' + r.age_days + ' วัน' + (r.due_date ? '<div class="small muted">ต้องการ ' + esc(fmtDate(r.due_date)) + '</div>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
    const pages = Math.ceil(d.total / d.page_size);
    if (pages > 1) {
      html += '<div class="actions" style="justify-content:center">' +
        '<button class="btn sm" id="pg-prev"' + (d.page <= 1 ? ' disabled' : '') + '>‹ ก่อนหน้า</button>' +
        '<span class="small" style="align-self:center">หน้า ' + d.page + ' / ' + pages + '</span>' +
        '<button class="btn sm" id="pg-next"' + (d.page >= pages ? ' disabled' : '') + '>ถัดไป ›</button></div>';
    }
    return html;
  }

  return {
    render: function (view, route, isCurrent) {
      const scope = route.scope || (state.me.role === 'sales' ? 'mine' : 'all');
      const fromRoute = route.stage || route.requestor || route.sr || route.outcome;
      const f = filters[scope] = fromRoute ? Object.assign(defaults(scope), {
        stage: route.stage || '', requestor: route.requestor || '', sr: route.sr || '', outcome: route.outcome || ''
      }) : (filters[scope] || defaults(scope));
      view.innerHTML = '<div class="page-head"><h1>' + esc(title(scope)) + '</h1>' +
        (state.me.role === 'sales' ? '<button class="btn primary" onclick="App.go({page:\'new\'})">+ สร้างใบขอราคา</button>' : '') +
        '</div>' + filterBar(f) + '<div id="t-results">' + loadingHtml() + '</div>';

      const load = function () {
        const box = $('#t-results');
        if (!box) return;
        box.innerHTML = loadingHtml();
        const q = { scope: scope, q: f.q, sort: f.sort, page: f.page, page_size: 50, group_code: f.group_code, priority: f.priority,
          date_from: f.date_from, date_to: f.date_to, sr: f.sr, requestor: f.requestor, outcome: f.outcome,
          status: f.status ? [f.status] : [], stage: f.stage ? [f.stage] : [] };
        api('listTickets', q).then(function (d) {
          if (!isCurrent()) return;
          box.innerHTML = rowsHtml(d);
          $all('tr.click', box).forEach(function (tr) {
            const open = function () { go({ page: 'ticket', id: tr.getAttribute('data-id') }); };
            tr.onclick = open;
            tr.onkeydown = function (e) { if (e.key === 'Enter') open(); };
          });
          if ($('#pg-prev')) $('#pg-prev').onclick = function () { f.page--; load(); };
          if ($('#pg-next')) $('#pg-next').onclick = function () { f.page++; load(); };
        }).catch(function (e) { if (isCurrent()) box.innerHTML = errorHtml(e, 'App.reload()'); });
      };

      const bind = function (id, key, ev) {
        const el = $('#' + id);
        if (!el) return;
        el.addEventListener(ev || 'change', function () { f[key] = el.value; f.page = 1; load(); });
      };
      $('#f-q').addEventListener('input', debounce(function () { f.q = $('#f-q').value.trim(); f.page = 1; load(); }, 400));
      bind('f-status', 'status'); bind('f-outcome', 'outcome'); bind('f-req', 'requestor'); bind('f-sort', 'sort'); bind('f-stage', 'stage'); bind('f-group', 'group_code');
      bind('f-prio', 'priority'); bind('f-sr', 'sr'); bind('f-from', 'date_from'); bind('f-to', 'date_to');
      $('#f-clear').onclick = function () { filters[scope] = defaults(scope); Pages.tickets.render(view, route, isCurrent); };
      load();
    }
  };
})();
</script>
